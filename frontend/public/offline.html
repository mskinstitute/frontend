<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | MSK Institute</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A2540">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0A2540 0%, #061526 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    h1 span {
      color: #FF6B00;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #FF8533;
      margin-bottom: 12px;
    }
    p {
      color: #CBD5E1;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #FF6B00;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 107, 0, 0.35);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #FF8533;
      transform: translateY(-2px);
    }
    .status {
      margin-top: 18px;
      font-size: 12px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #EF4444;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.jpg" alt="MSK Institute" class="logo">
    <h1>MSK<span>.</span>Institute</h1>
    <div class="subtitle">You&apos;re Currently Offline</div>
    <p>It looks like your internet connection is lost. Check your Wi-Fi or mobile data and try reloading the app.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="status">
      <span class="dot"></span>
      <span>Cached offline shell active</span>
    </div>
  </div>
</body>
</html>
