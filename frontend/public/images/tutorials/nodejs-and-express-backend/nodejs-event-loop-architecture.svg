<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0B1320" rx="16"/>
  <text x="400" y="45" fill="#22C55E" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Node.js Runtime &amp; Event Loop Architecture</text>
  
  <!-- V8 Engine Block -->
  <g transform="translate(60, 90)">
    <rect width="200" height="320" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
    <text x="100" y="35" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">V8 Engine &amp; Stack</text>
    <rect x="20" y="60" width="160" height="45" rx="6" fill="#334155"/>
    <text x="100" y="88" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">Call Stack (LIFO)</text>
    <rect x="20" y="120" width="160" height="45" rx="6" fill="#334155"/>
    <text x="100" y="148" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">Memory Heap</text>
    <rect x="20" y="180" width="160" height="45" rx="6" fill="#334155"/>
    <text x="100" y="208" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">Microtasks (Promises)</text>
    <rect x="20" y="240" width="160" height="45" rx="6" fill="#334155"/>
    <text x="100" y="268" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">process.nextTick()</text>
  </g>

  <!-- Event Loop Circle -->
  <g transform="translate(300, 100)">
    <circle cx="100" cy="150" r="95" fill="none" stroke="#22C55E" stroke-width="4" stroke-dasharray="8 6"/>
    <circle cx="100" cy="150" r="60" fill="#1E293B" stroke="#4ADE80" stroke-width="2"/>
    <text x="100" y="145" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">EVENT</text>
    <text x="100" y="165" fill="#22C55E" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LOOP</text>
    
    <!-- Phases -->
    <rect x="50" y="20" width="100" height="26" rx="6" fill="#15803D"/>
    <text x="100" y="37" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">1. Timers</text>

    <rect x="150" y="137" width="100" height="26" rx="6" fill="#15803D"/>
    <text x="200" y="154" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">2. Poll (I/O)</text>

    <rect x="50" y="254" width="100" height="26" rx="6" fill="#15803D"/>
    <text x="100" y="271" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">3. Check (setImm)</text>

    <rect x="-50" y="137" width="100" height="26" rx="6" fill="#15803D"/>
    <text x="0" y="154" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">4. Close Events</text>
  </g>

  <!-- Libuv Threadpool Block -->
  <g transform="translate(540, 90)">
    <rect width="200" height="320" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="100" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Libuv Worker Pool</text>
    <rect x="20" y="60" width="160" height="45" rx="6" fill="#0F172A"/>
    <text x="100" y="88" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">File System (fs)</text>
    <rect x="20" y="120" width="160" height="45" rx="6" fill="#0F172A"/>
    <text x="100" y="148" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">DNS Lookups</text>
    <rect x="20" y="180" width="160" height="45" rx="6" fill="#0F172A"/>
    <text x="100" y="208" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Crypto Operations</text>
    <rect x="20" y="240" width="160" height="45" rx="6" fill="#0F172A"/>
    <text x="100" y="268" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Zlib Compression</text>
  </g>
</svg>