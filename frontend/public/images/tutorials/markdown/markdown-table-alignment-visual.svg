<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">GFM Markdown Tables: Syntax &amp; Alignment Rules</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Pipes (|), Hyphens (-), and Colon Placement (:---, :---:, ---:)</text>

  <!-- Left Side: Raw Markdown Code Block -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="380" height="360" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="0" y="0" width="380" height="34" rx="10" fill="#0f172a" />
    <text x="20" y="22" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">📄 raw-table-syntax.md</text>

    <g transform="translate(20, 55)" font-family="monospace" font-size="11">
      <text x="0" y="20" fill="#94a3b8">| Item Name | Status | Price ($) |</text>
      <text x="0" y="42" fill="#38bdf8">| :-------- | :----: | --------: |</text>
      <text x="0" y="64" fill="#cbd5e1">| MacBook   | Stock  |     1,299 |</text>
      <text x="0" y="86" fill="#cbd5e1">| Mouse     | Low    |        25 |</text>
      <text x="0" y="108" fill="#cbd5e1">| Keyboard  | Out    |        75 |</text>

      <!-- Annotations -->
      <rect x="0" y="150" width="340" height="175" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="175" fill="#facc15" font-weight="bold" font-family="sans-serif" font-size="12">Alignment Colon Cheat Sheet:</text>
      <text x="15" y="200" fill="#38bdf8">• <tspan font-weight="bold">:---</tspan> (Colon on LEFT)  → Left Aligned</text>
      <text x="15" y="224" fill="#a855f7">• <tspan font-weight="bold">:---:</tspan> (Colons BOTH) → Center Aligned</text>
      <text x="15" y="248" fill="#10b981">• <tspan font-weight="bold">---:</tspan> (Colon on RIGHT) → Right Aligned</text>
      <text x="15" y="272" fill="#94a3b8">• <tspan font-weight="bold">---</tspan> (No colons)      → Default (Left)</text>
      <text x="15" y="300" fill="#cbd5e1" font-size="10" font-family="sans-serif">Minimum 3 hyphens per cell in separator row!</text>
    </g>
  </g>

  <!-- Right Side: Browser Rendered Table -->
  <g transform="translate(470, 85)">
    <rect x="0" y="0" width="380" height="360" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="380" height="34" rx="10" fill="#047857" />
    <text x="190" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🌐 Rendered HTML Output</text>

    <!-- Rendered Table UI -->
    <g transform="translate(15, 60)">
      <!-- Header Row -->
      <rect x="0" y="0" width="350" height="36" fill="#0f172a" stroke="#334155" />
      <text x="15" y="23" fill="#38bdf8" font-size="12" font-weight="bold">Item Name (Left)</text>
      <text x="175" y="23" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Status (Center)</text>
      <text x="335" y="23" fill="#34d399" font-size="12" font-weight="bold" text-anchor="end">Price (Right)</text>

      <!-- Row 1 -->
      <rect x="0" y="36" width="350" height="34" fill="#1e293b" stroke="#334155" />
      <text x="15" y="58" fill="#f8fafc" font-size="12">MacBook</text>
      <rect x="145" y="44" width="60" height="18" rx="4" fill="#065f46" />
      <text x="175" y="57" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">Stock</text>
      <text x="335" y="58" fill="#f8fafc" font-size="12" text-anchor="end">$1,299</text>

      <!-- Row 2 -->
      <rect x="0" y="70" width="350" height="34" fill="#0f172a" stroke="#334155" />
      <text x="15" y="92" fill="#f8fafc" font-size="12">Mouse</text>
      <rect x="145" y="78" width="60" height="18" rx="4" fill="#854d0e" />
      <text x="175" y="91" fill="#fde047" font-size="10" font-weight="bold" text-anchor="middle">Low</text>
      <text x="335" y="92" fill="#f8fafc" font-size="12" text-anchor="end">$25</text>

      <!-- Row 3 -->
      <rect x="0" y="104" width="350" height="34" fill="#1e293b" stroke="#334155" />
      <text x="15" y="126" fill="#f8fafc" font-size="12">Keyboard</text>
      <rect x="145" y="112" width="60" height="18" rx="4" fill="#991b1b" />
      <text x="175" y="125" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Out</text>
      <text x="335" y="126" fill="#f8fafc" font-size="12" text-anchor="end">$75</text>
    </g>

    <!-- Tips below table -->
    <g transform="translate(25, 245)" fill="#cbd5e1" font-size="11">
      <text x="0" y="18" fill="#34d399" font-weight="bold">Best Practices for Tables:</text>
      <text x="0" y="38">• Use Right-align for numbers, currency, and quantities.</text>
      <text x="0" y="56">• Use Center-align for badges, status, and dates.</text>
      <text x="0" y="74">• Use Left-align for textual descriptions and titles.</text>
      <text x="0" y="92">• Outer pipes (| at line ends) are optional in GFM but</text>
      <text x="10" y="108">strongly recommended for markdown readability.</text>
    </g>
  </g>
</svg>