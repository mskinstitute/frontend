<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Digital Financial Tools in India (डिजिटल वित्तीय उपकरण)</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">NPCI Ecosystem: UPI, QR Code, AEPS, Internet Banking (NEFT/RTGS/IMPS), &amp; PoS</text>

  <!-- 1. UPI & QR Code -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="240" height="360" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#0284c7" />
    <text x="120" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. UPI &amp; QR Code</text>

    <!-- Phone Illustration -->
    <rect x="50" y="55" width="140" height="210" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- QR Code grid inside phone -->
    <rect x="75" y="80" width="90" height="90" fill="#ffffff" rx="4" />
    <rect x="85" y="90" width="25" height="25" fill="#0f172a" />
    <rect x="130" y="90" width="25" height="25" fill="#0f172a" />
    <rect x="85" y="135" width="25" height="25" fill="#0f172a" />
    <rect x="120" y="125" width="15" height="15" fill="#0f172a" />

    <text x="120" y="200" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">BHIM UPI</text>
    <text x="120" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">Virtual Payment Address</text>
    <text x="120" y="235" fill="#facc15" font-size="10" font-family="monospace" text-anchor="middle">user@upi</text>

    <g transform="translate(15, 275)" fill="#cbd5e1" font-size="11">
      <text x="0" y="15">• Instant 24x7 Interbank transfer</text>
      <text x="0" y="35">• 4-6 digit UPI PIN protection</text>
      <text x="0" y="55">• Developed by NPCI in 2016</text>
      <text x="0" y="75">• Scan any merchant BharatQR</text>
    </g>
  </g>

  <!-- 2. AEPS (Aadhaar Enabled Payment) -->
  <g transform="translate(330, 85)">
    <rect x="0" y="0" width="240" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#059669" />
    <text x="120" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. AEPS (आधार पेमेंट)</text>

    <!-- Fingerprint / Micro-ATM illustration -->
    <rect x="50" y="55" width="140" height="210" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="120" cy="130" r="45" fill="#059669" opacity="0.2" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <text x="120" y="140" font-size="40" text-anchor="middle">👆</text>
    
    <text x="120" y="200" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Biometric Auth</text>
    <text x="120" y="220" fill="#94a3b8" font-size="10" text-anchor="middle">Aadhaar + Fingerprint</text>
    <text x="120" y="240" fill="#facc15" font-size="10" text-anchor="middle">Banking Correspondent</text>

    <g transform="translate(15, 275)" fill="#cbd5e1" font-size="11">
      <text x="0" y="15">• No debit card required</text>
      <text x="0" y="35">• Cash withdrawal at village</text>
      <text x="0" y="55">• Balance enquiry &amp; mini-statement</text>
      <text x="0" y="75">• Micro-ATMs in rural India</text>
    </g>
  </g>

  <!-- 3. NEFT vs RTGS vs IMPS & PoS -->
  <g transform="translate(610, 85)">
    <rect x="0" y="0" width="240" height="360" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#d97706" />
    <text x="120" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3. NetBanking &amp; Cards</text>

    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <!-- NEFT -->
      <rect x="0" y="0" width="210" height="52" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="10" y="20" fill="#fbbf24" font-weight="bold">NEFT (National Electronic Fund)</text>
      <text x="10" y="38" fill="#94a3b8" font-size="10">Settled in half-hourly batches (24x7)</text>

      <!-- RTGS -->
      <rect x="0" y="60" width="210" height="52" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="10" y="80" fill="#fbbf24" font-weight="bold">RTGS (Real Time Gross Settlement)</text>
      <text x="10" y="98" fill="#f43f5e" font-size="10" font-weight="bold">Minimum Limit: ₹2,00,000</text>

      <!-- IMPS -->
      <rect x="0" y="120" width="210" height="52" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="10" y="140" fill="#fbbf24" font-weight="bold">IMPS (Immediate Payment)</text>
      <text x="10" y="158" fill="#34d399" font-size="10">Instant 24x7 phone/account transfer</text>

      <!-- Debit Card / PoS -->
      <rect x="0" y="180" width="210" height="85" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="10" y="200" fill="#60a5fa" font-weight="bold">Debit/Credit Card Security:</text>
      <text x="10" y="220" fill="#cbd5e1" font-size="10">• 16-Digit Card Number</text>
      <text x="10" y="238" fill="#cbd5e1" font-size="10">• Expiry Date (MM/YY)</text>
      <text x="10" y="256" fill="#f43f5e" font-size="10" font-weight="bold">• CVV: 3 Digits on Back (Secret!)</text>

      <rect x="0" y="275" width="210" height="28" rx="6" fill="#1e293b" />
      <text x="105" y="293" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle">Never share OTP or CVV with anyone!</text>
    </g>
  </g>
</svg>