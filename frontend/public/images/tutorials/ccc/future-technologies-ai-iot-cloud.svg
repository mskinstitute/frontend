<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Title -->
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Future Skills &amp; Emerging Technologies (भविष्य की तकनीकें)</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">NIELIT CCC Chapter 10: Industry 4.0 pillars shaping modern digital careers</text>

  <!-- Card 1: Artificial Intelligence (AI) & ML -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="255" height="180" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#7c3aed" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🤖 Artificial Intelligence (AI)</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16">• Making machines think like humans</text>
      <text x="0" y="36">• Machine Learning &amp; Deep Learning</text>
      <text x="0" y="56">• NLP, Computer Vision, Speech Rec</text>
      <text x="0" y="76">• Examples: ChatGPT, Alexa, Self-driving</text>
      <text x="0" y="102" fill="#a78bfa" font-weight="bold">Father of AI: John McCarthy (1956)</text>
    </g>
  </g>

  <!-- Card 2: Internet of Things (IoT) -->
  <g transform="translate(322, 85)">
    <rect x="0" y="0" width="255" height="180" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#0284c7" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🌐 Internet of Things (IoT)</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16">• Physical devices connected to Internet</text>
      <text x="0" y="36">• Sensors collect &amp; exchange real-time data</text>
      <text x="0" y="56">• Smart Homes, Smart Cities, Agriculture</text>
      <text x="0" y="76">• Wearables (Smartwatches), Connected cars</text>
      <text x="0" y="102" fill="#38bdf8" font-weight="bold">Coined by: Kevin Ashton (1999)</text>
    </g>
  </g>

  <!-- Card 3: Cloud Computing -->
  <g transform="translate(605, 85)">
    <rect x="0" y="0" width="255" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#059669" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">☁️ Cloud Computing</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16">• On-demand computing over Internet</text>
      <text x="0" y="36">• Pay-as-you-go model (No hard drive limit)</text>
      <text x="0" y="56">• Models: IaaS, PaaS, SaaS</text>
      <text x="0" y="76">• Public, Private, Hybrid Cloud</text>
      <text x="0" y="102" fill="#6ee7b7" font-weight="bold">Examples: Google Drive, AWS, Azure</text>
    </g>
  </g>

  <!-- Card 4: Big Data Analytics -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="255" height="185" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#d97706" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📊 Big Data Analytics</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16">• Enormous datasets impossible for Excel</text>
      <text x="0" y="36" fill="#fbbf24" font-weight="bold">5 V's of Big Data:</text>
      <text x="10" y="54">• Volume (Scale of data - Petabytes)</text>
      <text x="10" y="70">• Velocity (Speed of streaming data)</text>
      <text x="10" y="86">• Variety (Text, audio, video, logs)</text>
      <text x="10" y="102">• Veracity (Trustworthiness) &amp; Value</text>
      <text x="0" y="122" fill="#facc15" font-weight="bold">Tools: Hadoop, Spark, MongoDB</text>
    </g>
  </g>

  <!-- Card 5: Robotic Process Automation (RPA) -->
  <g transform="translate(322, 285)">
    <rect x="0" y="0" width="255" height="185" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#db2777" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🦾 Robotic Process Automation</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16">• Software "bots" automating repetitive tasks</text>
      <text x="0" y="36">• High accuracy, 24x7 without human fatigue</text>
      <text x="0" y="56">• Data entry, invoice processing, payroll</text>
      <text x="0" y="76">• Distinct from physical hardware robots</text>
      <text x="0" y="102" fill="#f472b6" font-weight="bold">Platforms: UiPath, Blue Prism</text>
    </g>
  </g>

  <!-- Card 6: 3D Printing & Virtual Reality (VR/AR) -->
  <g transform="translate(605, 285)">
    <rect x="0" y="0" width="255" height="185" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#4f46e5" />
    <text x="127" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🥽 3D Printing &amp; VR / AR</text>
    <g transform="translate(15, 48)" fill="#cbd5e1" font-size="11">
      <text x="0" y="16" fill="#a5b4fc" font-weight="bold">3D Printing (Additive Mfg):</text>
      <text x="10" y="34">• Layer-by-layer physical object creation</text>
      <text x="0" y="56" fill="#a5b4fc" font-weight="bold">VR (Virtual Reality):</text>
      <text x="10" y="74">• 100% immersive computer simulated world</text>
      <text x="0" y="96" fill="#a5b4fc" font-weight="bold">AR (Augmented Reality):</text>
      <text x="10" y="114">• Digital overlays on physical world (Pokemon)</text>
    </g>
  </g>
</svg>