<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="36" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Computer Network Topologies (नेटवर्क टोपोलॉजी)</text>
  <text x="450" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Geometrical arrangements of nodes in a Local Area Network (LAN)</text>

  <!-- 1. BUS TOPOLOGY -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="380" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="190" y="24" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">1. Bus Topology (सिंगल केबल बैकबोन)</text>
    
    <!-- Central Backbone Bus Cable -->
    <line x1="30" y1="95" x2="350" y2="95" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <rect x="25" y="87" width="12" height="16" fill="#ef4444" />
    <rect x="343" y="87" width="12" height="16" fill="#ef4444" />
    <text x="190" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Terminator ← Backbone Cable → Terminator</text>

    <!-- Nodes attached -->
    <line x1="70" y1="95" x2="70" y2="55" stroke="#64748b" stroke-width="2" />
    <rect x="55" y="35" width="30" height="20" rx="3" fill="#0284c7" />
    <text x="70" y="49" fill="#ffffff" font-size="9" text-anchor="middle">PC 1</text>

    <line x1="150" y1="95" x2="150" y2="135" stroke="#64748b" stroke-width="2" />
    <rect x="135" y="135" width="30" height="20" rx="3" fill="#0284c7" />
    <text x="150" y="149" fill="#ffffff" font-size="9" text-anchor="middle">PC 2</text>

    <line x1="230" y1="95" x2="230" y2="55" stroke="#64748b" stroke-width="2" />
    <rect x="215" y="35" width="30" height="20" rx="3" fill="#0284c7" />
    <text x="230" y="49" fill="#ffffff" font-size="9" text-anchor="middle">PC 3</text>

    <line x1="310" y1="95" x2="310" y2="135" stroke="#64748b" stroke-width="2" />
    <rect x="295" y="135" width="30" height="20" rx="3" fill="#0284c7" />
    <text x="310" y="149" fill="#ffffff" font-size="9" text-anchor="middle">PC 4</text>
  </g>

  <!-- 2. STAR TOPOLOGY (MOST COMMON) -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="380" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="190" y="24" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">2. Star Topology (सेंट्रल Hub / Switch)</text>
    
    <!-- Central Hub -->
    <rect x="160" y="80" width="60" height="35" rx="6" fill="#059669" stroke="#10b981" />
    <text x="190" y="102" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">HUB / SW</text>

    <!-- Peripheral nodes and spokes -->
    <line x1="160" y1="90" x2="80" y2="60" stroke="#64748b" stroke-width="2" />
    <rect x="55" y="45" width="35" height="24" rx="4" fill="#0284c7" />
    <text x="72" y="61" fill="#fff" font-size="9" text-anchor="middle">Node A</text>

    <line x1="220" y1="90" x2="300" y2="60" stroke="#64748b" stroke-width="2" />
    <rect x="290" y="45" width="35" height="24" rx="4" fill="#0284c7" />
    <text x="307" y="61" fill="#fff" font-size="9" text-anchor="middle">Node B</text>

    <line x1="160" y1="105" x2="80" y2="135" stroke="#64748b" stroke-width="2" />
    <rect x="55" y="125" width="35" height="24" rx="4" fill="#0284c7" />
    <text x="72" y="141" fill="#fff" font-size="9" text-anchor="middle">Node C</text>

    <line x1="220" y1="105" x2="300" y2="135" stroke="#64748b" stroke-width="2" />
    <rect x="290" y="125" width="35" height="24" rx="4" fill="#0284c7" />
    <text x="307" y="141" fill="#fff" font-size="9" text-anchor="middle">Node D</text>
  </g>

  <!-- 3. RING TOPOLOGY -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="380" height="175" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="190" y="24" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">3. Ring Topology (टोकन रिंग)</text>
    
    <!-- Circular loop -->
    <circle cx="190" cy="100" r="48" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- 4 Nodes on circle -->
    <rect x="175" y="40" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="190" y="55" fill="#fff" font-size="9" text-anchor="middle">N1</text>
    
    <rect x="235" y="90" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="250" y="105" fill="#fff" font-size="9" text-anchor="middle">N2</text>

    <rect x="175" y="140" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="190" y="155" fill="#fff" font-size="9" text-anchor="middle">N3</text>

    <rect x="115" y="90" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="130" y="105" fill="#fff" font-size="9" text-anchor="middle">N4</text>
  </g>

  <!-- 4. MESH TOPOLOGY -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="380" height="175" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="190" y="24" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">4. Mesh Topology (प्रत्येक नोड आपस में जुड़ा)</text>
    
    <!-- Mesh interconnections: 4 nodes connected to all other 3 -->
    <line x1="110" y1="65" x2="270" y2="65" stroke="#ec4899" stroke-width="1.5" />
    <line x1="110" y1="135" x2="270" y2="135" stroke="#ec4899" stroke-width="1.5" />
    <line x1="110" y1="65" x2="110" y2="135" stroke="#ec4899" stroke-width="1.5" />
    <line x1="270" y1="65" x2="270" y2="135" stroke="#ec4899" stroke-width="1.5" />
    <line x1="110" y1="65" x2="270" y2="135" stroke="#ec4899" stroke-width="1.5" />
    <line x1="110" y1="135" x2="270" y2="65" stroke="#ec4899" stroke-width="1.5" />

    <rect x="95" y="52" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="110" y="67" fill="#fff" font-size="9" text-anchor="middle">A</text>
    <rect x="255" y="52" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="270" y="67" fill="#fff" font-size="9" text-anchor="middle">B</text>
    <rect x="95" y="125" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="110" y="140" fill="#fff" font-size="9" text-anchor="middle">C</text>
    <rect x="255" y="125" width="30" height="22" rx="3" fill="#0284c7" />
    <text x="270" y="140" fill="#fff" font-size="9" text-anchor="middle">D</text>
  </g>
</svg>