<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Spreadsheet Architecture: LibreOffice Calc &amp; MS Excel</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Rows (1,048,576), Columns (1024 in Calc / 16,384 in Excel), Name Box &amp; Formulas</text>

  <!-- Spreadsheet UI Container -->
  <g transform="translate(50, 85)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="800" height="375" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="800" height="32" rx="8" fill="#059669" />
    <text x="20" y="22" fill="#ffffff" font-size="12" font-weight="bold">LibreOffice Calc - Untitled1.ods</text>

    <!-- Formula Bar Row -->
    <rect x="0" y="32" width="800" height="36" fill="#0f172a" stroke="#334155" />
    
    <!-- Name Box (Active Cell) -->
    <rect x="15" y="38" width="70" height="24" rx="4" fill="#1e293b" stroke="#10b981" />
    <text x="50" y="55" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">C4</text>

    <!-- Formula input -->
    <text x="100" y="55" fill="#94a3b8" font-size="13" font-weight="bold">fx</text>
    <rect x="125" y="38" width="655" height="24" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="140" y="55" fill="#f8fafc" font-size="13" font-family="monospace">=SUM(C1:C3)</text>

    <!-- Column Headers Row -->
    <g transform="translate(0, 68)">
      <!-- Corner Top-Left Button -->
      <rect x="0" y="0" width="50" height="28" fill="#334155" stroke="#1e293b" />
      
      <!-- Columns A, B, C, D, E, F -->
      <rect x="50" y="0" width="120" height="28" fill="#334155" stroke="#1e293b" />
      <text x="110" y="19" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">A</text>
      
      <rect x="170" y="0" width="120" height="28" fill="#334155" stroke="#1e293b" />
      <text x="230" y="19" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">B</text>
      
      <rect x="290" y="0" width="120" height="28" fill="#047857" stroke="#10b981" />
      <text x="350" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">C (Active Col)</text>
      
      <rect x="410" y="0" width="120" height="28" fill="#334155" stroke="#1e293b" />
      <text x="470" y="19" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">D</text>
      
      <rect x="530" y="0" width="120" height="28" fill="#334155" stroke="#1e293b" />
      <text x="590" y="19" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">E</text>

      <rect x="650" y="0" width="150" height="28" fill="#334155" stroke="#1e293b" />
      <text x="725" y="19" fill="#94a3b8" font-size="11" text-anchor="middle">... to AMJ (1024)</text>
    </g>

    <!-- Rows Grid -->
    <!-- Row 1 -->
    <g transform="translate(0, 96)" fill="#f8fafc" font-size="12">
      <rect x="0" y="0" width="50" height="34" fill="#334155" stroke="#1e293b" />
      <text x="25" y="22" text-anchor="middle">1</text>
      <rect x="50" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="60" y="22">Ramesh</text>
      <rect x="170" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="180" y="22">Maths</text>
      <rect x="290" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="350" y="22" text-anchor="middle">85</text>
      <rect x="410" y="0" width="390" height="34" fill="#0f172a" stroke="#1e293b" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 130)" fill="#f8fafc" font-size="12">
      <rect x="0" y="0" width="50" height="34" fill="#334155" stroke="#1e293b" />
      <text x="25" y="22" text-anchor="middle">2</text>
      <rect x="50" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="60" y="22">Suresh</text>
      <rect x="170" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="180" y="22">Science</text>
      <rect x="290" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="350" y="22" text-anchor="middle">92</text>
      <rect x="410" y="0" width="390" height="34" fill="#0f172a" stroke="#1e293b" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 164)" fill="#f8fafc" font-size="12">
      <rect x="0" y="0" width="50" height="34" fill="#334155" stroke="#1e293b" />
      <text x="25" y="22" text-anchor="middle">3</text>
      <rect x="50" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="60" y="22">Pooja</text>
      <rect x="170" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="180" y="22">English</text>
      <rect x="290" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="350" y="22" text-anchor="middle">78</text>
      <rect x="410" y="0" width="390" height="34" fill="#0f172a" stroke="#1e293b" />
    </g>

    <!-- Row 4 (ACTIVE CELL C4) -->
    <g transform="translate(0, 198)" fill="#f8fafc" font-size="12">
      <rect x="0" y="0" width="50" height="34" fill="#047857" stroke="#10b981" />
      <text x="25" y="22" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
      <rect x="50" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <text x="60" y="22" fill="#34d399" font-weight="bold">TOTAL</text>
      <rect x="170" y="0" width="120" height="34" fill="#0f172a" stroke="#1e293b" />
      <rect x="290" y="0" width="120" height="34" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
      <text x="350" y="22" fill="#34d399" font-weight="bold" text-anchor="middle">255</text>
      <rect x="410" y="0" width="390" height="34" fill="#0f172a" stroke="#1e293b" />
    </g>

    <!-- Status Bar / Sheet Tabs -->
    <rect x="0" y="335" width="800" height="40" fill="#020617" stroke="#334155" />
    <rect x="10" y="342" width="75" height="26" rx="4" fill="#10b981" />
    <text x="47" y="359" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Sheet 1</text>
    <rect x="90" y="342" width="26" height="26" rx="4" fill="#1e293b" />
    <text x="103" y="359" fill="#94a3b8" font-size="14" text-anchor="middle">+</text>
    <text x="680" y="360" fill="#94a3b8" font-size="11">Selected: C4 | Sum: 255</text>
  </g>
</svg>