<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#061A14" rx="16"/>
  <text x="400" y="45" fill="#10B981" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">MongoDB Document Model &amp; Aggregation Pipeline</text>
  
  <!-- BSON Document Block -->
  <g transform="translate(60, 90)">
    <rect width="280" height="320" rx="12" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">BSON Document (JSON-like)</text>
    
    <text x="25" y="70" fill="#A7F3D0" font-family="monospace" font-size="12">{</text>
    <text x="40" y="95" fill="#6EE7B7" font-family="monospace" font-size="12">"_id": ObjectId("65f1a..."),</text>
    <text x="40" y="125" fill="#6EE7B7" font-family="monospace" font-size="12">"name": "Er. Sumit Kumar",</text>
    <text x="40" y="155" fill="#6EE7B7" font-family="monospace" font-size="12">"role": "Full Stack Architect",</text>
    <text x="40" y="185" fill="#6EE7B7" font-family="monospace" font-size="12">"skills": ["React", "Node", "Mongo"],</text>
    <text x="40" y="215" fill="#6EE7B7" font-family="monospace" font-size="12">"address": {</text>
    <text x="60" y="240" fill="#34D399" font-family="monospace" font-size="12">"city": "Shikohabad",</text>
    <text x="60" y="265" fill="#34D399" font-family="monospace" font-size="12">"pincode": 283135</text>
    <text x="40" y="290" fill="#6EE7B7" font-family="monospace" font-size="12">}</text>
    <text x="25" y="305" fill="#A7F3D0" font-family="monospace" font-size="12">}</text>
  </g>

  <!-- Pipeline Stages -->
  <g transform="translate(380, 90)">
    <rect width="360" height="320" rx="12" fill="#022C22" stroke="#059669" stroke-width="1.5"/>
    <text x="180" y="32" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Aggregation Pipeline</text>
    
    <!-- Stage 1 -->
    <g transform="translate(30, 50)">
      <rect width="300" height="48" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1"/>
      <text x="20" y="28" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="bold">$match: { status: 'Active' }</text>
    </g>
    <!-- Arrow -->
    <line x1="180" y1="102" x2="180" y2="114" stroke="#10B981" stroke-width="3"/>
    
    <!-- Stage 2 -->
    <g transform="translate(30, 115)">
      <rect width="300" height="48" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1"/>
      <text x="20" y="28" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="bold">$group: { _id: '$dept', total: { $sum: 1 } }</text>
    </g>
    <!-- Arrow -->
    <line x1="180" y1="167" x2="180" y2="179" stroke="#10B981" stroke-width="3"/>

    <!-- Stage 3 -->
    <g transform="translate(30, 180)">
      <rect width="300" height="48" rx="8" fill="#065F46" stroke="#34D399" stroke-width="1"/>
      <text x="20" y="28" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="bold">$lookup: { from: 'orders', ... }</text>
    </g>
    <!-- Arrow -->
    <line x1="180" y1="232" x2="180" y2="244" stroke="#10B981" stroke-width="3"/>

    <!-- Stage 4 -->
    <g transform="translate(30, 245)">
      <rect width="300" height="48" rx="8" fill="#047857" stroke="#34D399" stroke-width="1"/>
      <text x="20" y="28" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="bold">$sort: { total: -1 } / $project</text>
    </g>
  </g>
</svg>