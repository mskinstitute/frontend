<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#000000" rx="16"/>
  <text x="400" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Next.js 15 App Router &amp; Server Actions Architecture</text>
  
  <!-- Server Environment (RSC) -->
  <g transform="translate(50, 80)">
    <rect width="330" height="330" rx="12" fill="#111111" stroke="#333333" stroke-width="2"/>
    <rect x="15" y="15" width="300" height="36" rx="6" fill="#1E293B"/>
    <text x="165" y="38" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SERVER ENVIRONMENT (Default)</text>
    
    <g transform="translate(20, 65)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">React Server Components (RSC)</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">Direct DB access, 0 client JS bundle</text>
    </g>
    
    <g transform="translate(20, 130)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Server Actions ('use server')</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">Form mutations, revalidatePath()</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">API Route Handlers (route.ts)</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">GET, POST, PUT, DELETE REST APIs</text>
    </g>

    <g transform="translate(20, 260)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Full Route &amp; Data Cache</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">Granular caching &amp; memoization</text>
    </g>
  </g>

  <!-- Client Environment -->
  <g transform="translate(420, 80)">
    <rect width="330" height="330" rx="12" fill="#111111" stroke="#333333" stroke-width="2"/>
    <rect x="15" y="15" width="300" height="36" rx="6" fill="#1E293B"/>
    <text x="165" y="38" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CLIENT ENVIRONMENT ('use client')</text>
    
    <g transform="translate(20, 65)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Interactive Client Components</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">useState, useEffect, event listeners</text>
    </g>
    
    <g transform="translate(20, 130)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Optimistic UI &amp; Form Status</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">useActionState, useFormStatus</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Client-Side Navigation</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">next/link prefetching &amp; useRouter</text>
    </g>

    <g transform="translate(20, 260)">
      <rect width="290" height="50" rx="6" fill="#18181B" stroke="#27272A"/>
      <text x="15" y="22" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Browser DOM &amp; Storage</text>
      <text x="15" y="40" fill="#A1A1AA" font-family="monospace" font-size="11">localStorage, cookies, Web APIs</text>
    </g>
  </g>
</svg>