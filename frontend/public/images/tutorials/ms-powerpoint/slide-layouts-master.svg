<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24726"/>
      <stop offset="100%" stop-color="#A23218"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="slideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#pptOrange)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- PowerPoint Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#8F2510"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">P</text>

  <!-- Presentation Title & Search -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Slide Layouts & Placeholders - Microsoft PowerPoint</text>

  <!-- Quick Save / Undo icons placeholder -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Header Title Banner -->
  <rect x="0" y="38" width="800" height="42" fill="#F8FAFC"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#E2E8F0"/>
  <text x="24" y="64" fill="#0F172A" font-size="14" font-weight="bold">Home &gt; Slides &gt; Layout Gallery (Standard Office Themes)</text>

  <!-- Layout Cards Grid (3x3 grid of layouts) -->
  <!-- Card 1: Title Slide -->
  <g transform="translate(40, 96)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="25" y="30" width="160" height="18" rx="2" fill="#D24726" fill-opacity="0.15" stroke="#D24726" stroke-dasharray="2 2"/>
    <text x="105" y="43" fill="#D24726" font-size="10" font-weight="bold" text-anchor="middle">Title Placeholder</text>
    <rect x="45" y="58" width="120" height="14" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <text x="105" y="68" fill="#64748B" font-size="8" text-anchor="middle">Subtitle Placeholder</text>
    <text x="105" y="94" fill="#1E293B" font-size="11" font-weight="bold" text-anchor="middle">1. Title Slide</text>
  </g>

  <!-- Card 2: Title and Content -->
  <g transform="translate(295, 96)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#D24726" stroke-width="2"/>
    <rect x="15" y="12" width="180" height="16" rx="2" fill="#D24726" fill-opacity="0.15" stroke="#D24726" stroke-dasharray="2 2"/>
    <text x="105" y="24" fill="#D24726" font-size="9" font-weight="bold" text-anchor="middle">Title Placeholder</text>
    <rect x="15" y="34" width="180" height="46" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <!-- Placeholder icons -->
    <rect x="40" y="44" width="16" height="16" rx="2" fill="#CBD5E1"/>
    <rect x="65" y="44" width="16" height="16" rx="2" fill="#CBD5E1"/>
    <rect x="90" y="44" width="16" height="16" rx="2" fill="#CBD5E1"/>
    <rect x="115" y="44" width="16" height="16" rx="2" fill="#CBD5E1"/>
    <rect x="140" y="44" width="16" height="16" rx="2" fill="#CBD5E1"/>
    <text x="105" y="94" fill="#D24726" font-size="11" font-weight="bold" text-anchor="middle">2. Title and Content (Default)</text>
  </g>

  <!-- Card 3: Section Header -->
  <g transform="translate(550, 96)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="25" y="38" width="160" height="18" rx="2" fill="#D24726" fill-opacity="0.15" stroke="#D24726" stroke-dasharray="2 2"/>
    <text x="105" y="51" fill="#D24726" font-size="10" font-weight="bold" text-anchor="middle">Section Header</text>
    <text x="105" y="94" fill="#1E293B" font-size="11" font-weight="bold" text-anchor="middle">3. Section Header</text>
  </g>

  <!-- Card 4: Two Content -->
  <g transform="translate(40, 220)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="10" width="180" height="14" rx="2" fill="#D24726" fill-opacity="0.15"/>
    <rect x="15" y="30" width="85" height="50" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <text x="57" y="58" fill="#64748B" font-size="9" text-anchor="middle">Column 1</text>
    <rect x="110" y="30" width="85" height="50" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <text x="152" y="58" fill="#64748B" font-size="9" text-anchor="middle">Column 2</text>
    <text x="105" y="94" fill="#1E293B" font-size="11" font-weight="bold" text-anchor="middle">4. Two Content</text>
  </g>

  <!-- Card 5: Comparison -->
  <g transform="translate(295, 220)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="10" width="180" height="14" rx="2" fill="#D24726" fill-opacity="0.15"/>
    <rect x="15" y="28" width="85" height="12" rx="1" fill="#E2E8F0"/>
    <rect x="15" y="44" width="85" height="36" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <rect x="110" y="28" width="85" height="12" rx="1" fill="#E2E8F0"/>
    <rect x="110" y="44" width="85" height="36" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2 2"/>
    <text x="105" y="94" fill="#1E293B" font-size="11" font-weight="bold" text-anchor="middle">5. Comparison</text>
  </g>

  <!-- Card 6: Blank -->
  <g transform="translate(550, 220)">
    <rect width="210" height="105" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="65" rx="2" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="105" y="52" fill="#94A3B8" font-size="10" text-anchor="middle">Clean Canvas (No Placeholders)</text>
    <text x="105" y="94" fill="#1E293B" font-size="11" font-weight="bold" text-anchor="middle">6. Blank</text>
  </g>

  <!-- Bottom Slide Master Callout Banner -->
  <rect x="40" y="348" width="720" height="110" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="56" y="362" width="28" height="28" rx="6" fill="#EA580C"/>
  <text x="70" y="381" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">M</text>
  <text x="96" y="375" fill="#9A3412" font-size="13" font-weight="bold">Pro Tip: View &gt; Slide Master</text>
  <text x="96" y="396" fill="#C2410C" font-size="11">The Parent Slide Master controls universal company logos, brand fonts, background styles, and slide numbers across every child layout automatically.</text>
  <text x="96" y="415" fill="#7C2D12" font-size="11" font-weight="600">Shortcut to insert slide with selected layout: Ctrl + M (inserts new slide with same layout)</text>
  <text x="96" y="434" fill="#431407" font-size="11">Right-click thumbnail &gt; Layout to swap layout without losing typed text content!</text>

</svg>
