<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24726"/>
      <stop offset="100%" stop-color="#A23218"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="slideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#pptOrange)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- PowerPoint Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#8F2510"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">P</text>

  <!-- Presentation Title & Search -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Slide Zoom & Non-Linear Interactive Navigation - Microsoft PowerPoint</text>

  <!-- Quick Save / Undo icons placeholder -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Top Banner -->
  <rect x="0" y="38" width="800" height="40" fill="#F8FAFC"/>
  <line x1="0" y1="78" x2="800" y2="78" stroke="#E2E8F0"/>
  <text x="24" y="63" fill="#0F172A" font-size="13" font-weight="bold">Insert &gt; Zoom (Summary Zoom, Section Zoom, Slide Zoom)</text>

  <!-- Main Slide: Summary Zoom Dashboard -->
  <rect x="30" y="95" width="740" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="30" y="95" width="740" height="35" rx="8 8 0 0" fill="#D24726"/>
  <text x="50" y="118" fill="#FFFFFF" font-size="13" font-weight="bold">Interactive Summary Zoom Landing Slide</text>

  <text x="50" y="155" fill="#64748B" font-size="11">Clicking any interactive thumbnail zooms directly into that section during presentation:</text>

  <!-- Zoom Card 1: Section A -->
  <g transform="translate(50, 170)">
    <rect width="210" height="130" rx="6" fill="#F8FAFC" stroke="#D24726" stroke-width="2"/>
    <rect x="10" y="10" width="190" height="20" rx="3" fill="#D24726"/>
    <text x="105" y="24" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">1. Product Roadmap</text>
    <circle cx="45" cy="65" r="18" fill="#FDBA74"/>
    <circle cx="105" cy="65" r="18" fill="#FB923C"/>
    <circle cx="165" cy="65" r="18" fill="#EA580C"/>
    <rect x="20" y="100" width="170" height="8" rx="2" fill="#CBD5E1"/>
    <text x="105" y="122" fill="#D24726" font-size="9" font-weight="bold" text-anchor="middle">Zoom &amp; Return [✓]</text>
  </g>

  <!-- Zoom Card 2: Section B -->
  <g transform="translate(295, 170)">
    <rect width="210" height="130" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
    <rect x="10" y="10" width="190" height="20" rx="3" fill="#2563EB"/>
    <text x="105" y="24" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">2. Market Traction</text>
    <rect x="30" y="45" width="30" height="45" fill="#93C5FD"/>
    <rect x="75" y="40" width="30" height="50" fill="#60A5FA"/>
    <rect x="120" y="30" width="30" height="60" fill="#3B82F6"/>
    <rect x="165" y="20" width="30" height="70" fill="#1D4ED8"/>
    <text x="105" y="122" fill="#2563EB" font-size="9" font-weight="bold" text-anchor="middle">Zoom &amp; Return [✓]</text>
  </g>

  <!-- Zoom Card 3: Section C -->
  <g transform="translate(540, 170)">
    <rect width="210" height="130" rx="6" fill="#F8FAFC" stroke="#16A34A" stroke-width="2"/>
    <rect x="10" y="10" width="190" height="20" rx="3" fill="#16A34A"/>
    <text x="105" y="24" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">3. Financial Model</text>
    <circle cx="105" cy="65" r="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="105" y="69" fill="#15803D" font-size="11" font-weight="bold" text-anchor="middle">+128%</text>
    <text x="105" y="122" fill="#16A34A" font-size="9" font-weight="bold" text-anchor="middle">Zoom &amp; Return [✓]</text>
  </g>

  <!-- Bottom Navigation Buttons -->
  <g transform="translate(30, 370)">
    <rect width="740" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="20" y="24" fill="#1E3A8A" font-size="12" font-weight="bold">Interactive Action Buttons &amp; Non-Linear Branching:</text>
    
    <!-- Action Button 1: Home -->
    <rect x="20" y="36" width="110" height="36" rx="4" fill="#2563EB"/>
    <text x="75" y="58" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">🏠 Home Menu</text>

    <!-- Action Button 2: Next Section -->
    <rect x="145" y="36" width="120" height="36" rx="4" fill="#1E40AF"/>
    <text x="205" y="58" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">Next Section ➔</text>

    <!-- Action Button 3: Custom Link -->
    <rect x="280" y="36" width="130" height="36" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="345" y="58" fill="#2563EB" font-size="11" font-weight="bold" text-anchor="middle">🔗 Web Resource</text>

    <text x="430" y="50" fill="#1D4ED8" font-size="11">Insert &gt; Links &gt; Action: Trigger slide jump or macro on click/hover</text>
    <text x="430" y="68" fill="#1E40AF" font-size="10">Insert &gt; Link (Ctrl + K): Hyperlink to any website, document, or slide</text>
  </g>

</svg>
