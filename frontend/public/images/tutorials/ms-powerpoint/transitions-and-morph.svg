<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24726"/>
      <stop offset="100%" stop-color="#A23218"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="slideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#pptOrange)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- PowerPoint Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#8F2510"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">P</text>

  <!-- Presentation Title & Search -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Slide Transitions & The Morph Magic - Microsoft PowerPoint</text>

  <!-- Quick Save / Undo icons placeholder -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Transitions Ribbon Bar -->
  <rect x="0" y="38" width="800" height="65" fill="#F8FAFC"/>
  <line x1="0" y1="103" x2="800" y2="103" stroke="#CBD5E1"/>

  <!-- Transition Types Cards -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="70" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="35" y="28" fill="#64748B" font-size="11" text-anchor="middle">None</text>

    <rect x="80" y="0" width="80" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="120" y="28" fill="#1E293B" font-size="11" text-anchor="middle">Fade</text>

    <rect x="170" y="0" width="80" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="210" y="28" fill="#1E293B" font-size="11" text-anchor="middle">Push</text>

    <rect x="260" y="0" width="80" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="300" y="28" fill="#1E293B" font-size="11" text-anchor="middle">Wipe</text>

    <!-- Morph Highlighted -->
    <rect x="350" y="0" width="100" height="46" rx="4" fill="#FEF2F2" stroke="#D24726" stroke-width="2"/>
    <text x="400" y="24" fill="#D24726" font-size="12" font-weight="bold" text-anchor="middle">✨ Morph</text>
    <text x="400" y="38" fill="#B91C1C" font-size="9" text-anchor="middle">Cinematic Motion</text>

    <!-- Timing Controls on right -->
    <rect x="470" y="0" width="300" height="46" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="480" y="18" fill="#334155" font-size="10">Duration: 01.50</text>
    <text x="590" y="18" fill="#334155" font-size="10">Sound: [No Sound]</text>
    <rect x="480" y="25" width="90" height="16" rx="2" fill="#D24726"/>
    <text x="525" y="37" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">Apply To All</text>
    <text x="590" y="37" fill="#475569" font-size="10">[✓] On Mouse Click</text>
  </g>

  <!-- Morph Demonstration Diagram (Slide 1 vs Slide 2) -->
  <text x="30" y="130" fill="#0F172A" font-size="14" font-weight="bold">How PowerPoint Morph Works Seamlessly Between Consecutive Slides:</text>

  <!-- Slide 1 -->
  <g transform="translate(40, 150)">
    <rect width="320" height="190" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="24" rx="6 6 0 0" fill="#E2E8F0"/>
    <text x="12" y="16" fill="#475569" font-size="11" font-weight="bold">Slide 1: Initial State</text>
    
    <!-- Object A (Small top-left circle) -->
    <circle cx="60" cy="70" r="24" fill="#D24726"/>
    <text x="60" y="74" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">Plan</text>

    <!-- Object B (Small circle) -->
    <circle cx="130" cy="70" r="24" fill="#2563EB"/>
    <text x="130" y="74" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">Code</text>

    <!-- Text Header -->
    <rect x="30" y="120" width="160" height="14" rx="2" fill="#0F172A"/>
    <text x="35" y="131" fill="#FFFFFF" font-size="9">Overview Stage</text>
    <rect x="30" y="142" width="220" height="8" rx="1" fill="#94A3B8"/>
    <rect x="30" y="156" width="180" height="8" rx="1" fill="#CBD5E1"/>
  </g>

  <!-- Transition Arrow with Morph icon -->
  <g transform="translate(375, 220)">
    <circle cx="25" cy="25" r="22" fill="#D24726"/>
    <text x="25" y="31" fill="#FFFFFF" font-size="16" text-anchor="middle">→</text>
    <text x="25" y="62" fill="#D24726" font-size="11" font-weight="bold" text-anchor="middle">Morph</text>
  </g>

  <!-- Slide 2 -->
  <g transform="translate(440, 150)">
    <rect width="320" height="190" rx="6" fill="#FFFFFF" stroke="#D24726" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="24" rx="6 6 0 0" fill="#FEF2F2"/>
    <text x="12" y="16" fill="#B91C1C" font-size="11" font-weight="bold">Slide 2: Expanded Focus (Morph Applied)</text>
    
    <!-- Object A (Expanded large circle in center) -->
    <circle cx="80" cy="110" r="50" fill="#D24726"/>
    <text x="80" y="108" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Plan</text>
    <text x="80" y="124" fill="#FFEDD5" font-size="10" text-anchor="middle">Phase 1</text>

    <!-- Object B shifted to side -->
    <circle cx="280" cy="60" r="16" fill="#94A3B8" opacity="0.6"/>
    <text x="280" y="64" fill="#FFFFFF" font-size="8" text-anchor="middle">Code</text>

    <!-- Detailed content appeared -->
    <rect x="150" y="55" width="150" height="16" rx="2" fill="#0F172A"/>
    <text x="155" y="67" fill="#FFFFFF" font-size="10" font-weight="bold">Deep Dive: Planning</text>
    <rect x="150" y="80" width="150" height="8" rx="1" fill="#475569"/>
    <rect x="150" y="96" width="140" height="8" rx="1" fill="#475569"/>
    <rect x="150" y="112" width="120" height="8" rx="1" fill="#64748B"/>
  </g>

  <!-- Pro Tip Box -->
  <rect x="40" y="360" width="720" height="100" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="60" y="385" fill="#166534" font-size="13" font-weight="bold">Morph Pro-Tips &amp; The Exclamation Naming Secret (!!name):</text>
  <text x="60" y="405" fill="#15803D" font-size="11">1. Duplicate Slide: Create Slide 1, press Ctrl + D to duplicate, and simply move/resize objects on Slide 2.</text>
  <text x="60" y="424" fill="#15803D" font-size="11">2. Morph Different Shapes (e.g. Circle into Star): Open Selection Pane (Alt + F10), name both objects with two exclamation marks: "!!Shape1". PowerPoint will magically morph the geometry!</text>
  <text x="60" y="443" fill="#166534" font-size="10" font-weight="600">3. Effect Options: Choose Morph by 'Objects', 'Words', or 'Characters' for silky smooth text animations.</text>

</svg>
