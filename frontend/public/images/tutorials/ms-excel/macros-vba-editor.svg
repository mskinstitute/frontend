<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5A2E"/>
    </linearGradient>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#excelGreen)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- Excel Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#0A4D27"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">X</text>

  <!-- Workbook Title -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Macros & Visual Basic for Applications (VBA) - Microsoft Excel</text>

  <!-- AutoSave Pill -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Top Banner -->
  <rect x="0" y="38" width="800" height="40" fill="#F8FAFC"/>
  <line x1="0" y1="78" x2="800" y2="78" stroke="#CBD5E1"/>
  <text x="24" y="63" fill="#0F172A" font-size="13" font-weight="bold">Developer Tab &gt; Record Macro &amp; Visual Basic Editor (Alt + F11)</text>

  <!-- Left: Record Macro Dialog -->
  <g transform="translate(30, 95)">
    <rect width="320" height="245" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect width="320" height="30" rx="8 8 0 0" fill="#F8FAFC"/>
    <text x="15" y="20" fill="#0F172A" font-size="12" font-weight="bold">Record Macro</text>

    <text x="15" y="55" fill="#334155" font-size="11">Macro name:</text>
    <rect x="15" y="62" width="290" height="24" rx="3" fill="#FFFFFF" stroke="#107C41" stroke-width="1.5"/>
    <text x="25" y="78" fill="#0F172A" font-size="11" font-weight="bold">FormatWeeklyReport</text>

    <text x="15" y="108" fill="#334155" font-size="11">Shortcut key: Ctrl + Shift +</text>
    <rect x="175" y="96" width="30" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="186" y="111" fill="#0F172A" font-size="11" font-weight="bold">R</text>

    <text x="15" y="138" fill="#334155" font-size="11">Store macro in: This Workbook</text>
    <text x="15" y="168" fill="#334155" font-size="11">Description:</text>
    <rect x="15" y="174" width="290" height="40" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="22" y="190" fill="#64748B" font-size="10">Applies zebra styling, auto-fits columns</text>
    <text x="22" y="204" fill="#64748B" font-size="10">and inserts header summary formula.</text>

    <rect x="165" y="220" width="65" height="22" rx="3" fill="#107C41"/>
    <text x="197" y="235" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">OK</text>
    <rect x="240" y="220" width="65" height="22" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="272" y="235" fill="#475569" font-size="10" text-anchor="middle">Cancel</text>
  </g>

  <!-- Right: VBE (Visual Basic Editor) Code Window -->
  <g transform="translate(370, 95)">
    <rect width="400" height="245" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="400" height="28" rx="8 8 0 0" fill="#1E293B"/>
    <text x="15" y="19" fill="#FFFFFF" font-size="11" font-weight="bold">Microsoft Visual Basic for Applications - [Module1 (Code)]</text>

    <!-- Code Editor Surface -->
    <rect y="28" width="400" height="217" rx="0 0 8 8" fill="#0F172A"/>
    
    <g transform="translate(15, 45)" font-family="monospace" font-size="10">
      <text y="0" fill="#38BDF8">Sub</text>
      <text x="25" y="0" fill="#FFFFFF">FormatWeeklyReport()</text>

      <text y="18" fill="#64748B">' Turn off screen updating for lightning speed</text>
      <text y="34" fill="#FFFFFF">Application.ScreenUpdating = </text>
      <text x="185" y="34" fill="#F43F5E">False</text>

      <text y="56" fill="#64748B">' AutoFit all columns across active sheet</text>
      <text y="72" fill="#FFFFFF">Cells.EntireColumn.AutoFit</text>

      <text y="94" fill="#64748B">' Apply bold and emerald green color to Header</text>
      <text y="110" fill="#FFFFFF">With Range(</text>
      <text x="75" y="110" fill="#FACC15">"A1:G1"</text>
      <text x="115" y="110" fill="#FFFFFF">).Interior</text>
      <text x="20" y="126" fill="#FFFFFF">.Color = RGB(16, 124, 65)</text>
      <text y="142" fill="#FFFFFF">End With</text>

      <text y="164" fill="#FFFFFF">Application.ScreenUpdating = </text>
      <text x="185" y="164" fill="#F43F5E">True</text>
      <text y="182" fill="#38BDF8">End Sub</text>
    </g>
  </g>

  <!-- Bottom Panel: Macro Workbook File Type Warning -->
  <g transform="translate(30, 350)">
    <rect width="740" height="105" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="20" y="24" fill="#991B1B" font-size="12" font-weight="bold">Critical Macro Rule: Save as .XLSM!</text>
    <text x="20" y="46" fill="#B91C1C" font-size="11">Standard Excel workbooks (.xlsx) automatically strip and delete all VBA code upon saving!</text>
    <text x="20" y="66" fill="#B91C1C" font-size="11">You must always save macro projects as "Excel Macro-Enabled Workbook (*.xlsm)".</text>
    <text x="20" y="86" fill="#7F1D1D" font-size="10" font-weight="600">Assign Macro to Worksheet Button: Insert &gt; Shapes &gt; draw rectangle &gt; right-click &gt; Assign Macro.</text>
  </g>

</svg>
