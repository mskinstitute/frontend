<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5A2E"/>
    </linearGradient>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#excelGreen)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- Excel Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#0A4D27"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">X</text>

  <!-- Workbook Title -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Capstone Project: Executive Sales Dashboard - Microsoft Excel</text>

  <!-- AutoSave Pill -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Dark Executive Dashboard Canvas -->
  <rect x="0" y="38" width="800" height="442" fill="#0B132B"/>

  <!-- Top Dashboard Header -->
  <text x="30" y="70" fill="#38BDF8" font-size="10" font-weight="bold" letter-spacing="2">EXECUTIVE INTELLIGENCE</text>
  <text x="30" y="98" fill="#FFFFFF" font-size="20" font-weight="900">2026 Global Revenue &amp; Performance Dashboard</text>

  <!-- Slicer Filter Bar across top right -->
  <g transform="translate(460, 60)">
    <rect width="70" height="24" rx="3" fill="#107C41"/>
    <text x="35" y="16" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">All (2026)</text>
    <rect x="75" width="60" height="24" rx="3" fill="#1C2541"/>
    <text x="105" y="16" fill="#94A3B8" font-size="10" text-anchor="middle">US West</text>
    <rect x="140" width="60" height="24" rx="3" fill="#1C2541"/>
    <text x="170" y="16" fill="#94A3B8" font-size="10" text-anchor="middle">US East</text>
    <rect x="205" width="60" height="24" rx="3" fill="#1C2541"/>
    <text x="235" y="16" fill="#94A3B8" font-size="10" text-anchor="middle">EMEA</text>
    <rect x="270" width="40" height="24" rx="3" fill="#1C2541"/>
    <text x="290" y="16" fill="#94A3B8" font-size="10" text-anchor="middle">APAC</text>
  </g>

  <!-- 4 KPI Cards Grid -->
  <!-- Card 1: Total Revenue -->
  <g transform="translate(30, 115)">
    <rect width="170" height="80" rx="6" fill="#1C2541" stroke="#3A506B"/>
    <text x="15" y="24" fill="#94A3B8" font-size="10" font-weight="bold">TOTAL REVENUE (YTD)</text>
    <text x="15" y="52" fill="#FFFFFF" font-size="20" font-weight="900">$4.82M</text>
    <text x="15" y="70" fill="#4ADE80" font-size="10" font-weight="bold">▲ +24.8% vs LY</text>
  </g>

  <!-- Card 2: Average Order Value -->
  <g transform="translate(220, 115)">
    <rect width="170" height="80" rx="6" fill="#1C2541" stroke="#3A506B"/>
    <text x="15" y="24" fill="#94A3B8" font-size="10" font-weight="bold">AVG ORDER VALUE</text>
    <text x="15" y="52" fill="#FFFFFF" font-size="20" font-weight="900">$1,420</text>
    <text x="15" y="70" fill="#4ADE80" font-size="10" font-weight="bold">▲ +12.3% vs Target</text>
  </g>

  <!-- Card 3: Gross Margin -->
  <g transform="translate(410, 115)">
    <rect width="170" height="80" rx="6" fill="#1C2541" stroke="#3A506B"/>
    <text x="15" y="24" fill="#94A3B8" font-size="10" font-weight="bold">GROSS MARGIN</text>
    <text x="15" y="52" fill="#FFFFFF" font-size="20" font-weight="900">68.4%</text>
    <text x="15" y="70" fill="#38BDF8" font-size="10" font-weight="bold">● Steady Margin</text>
  </g>

  <!-- Card 4: Active Enterprise Customers -->
  <g transform="translate(600, 115)">
    <rect width="170" height="80" rx="6" fill="#1C2541" stroke="#3A506B"/>
    <text x="15" y="24" fill="#94A3B8" font-size="10" font-weight="bold">ACTIVE ACCOUNTS</text>
    <text x="15" y="52" fill="#FFFFFF" font-size="20" font-weight="900">1,894</text>
    <text x="15" y="70" fill="#4ADE80" font-size="10" font-weight="bold">▲ 142 New MoM</text>
  </g>

  <!-- Bottom Visuals: Left Monthly Trend Chart (460px) -->
  <g transform="translate(30, 210)">
    <rect width="460" height="250" rx="8" fill="#1C2541" stroke="#3A506B"/>
    <text x="20" y="26" fill="#FFFFFF" font-size="12" font-weight="bold">Monthly Sales Performance &amp; Forecast</text>

    <!-- Bar & Line Chart -->
    <g transform="translate(30, 45)">
      <!-- Bars -->
      <rect x="15" y="90" width="22" height="70" fill="#107C41"/>
      <rect x="47" y="75" width="22" height="85" fill="#107C41"/>
      <rect x="79" y="60" width="22" height="100" fill="#107C41"/>
      <rect x="111" y="80" width="22" height="80" fill="#107C41"/>
      <rect x="143" y="45" width="22" height="115" fill="#107C41"/>
      <rect x="175" y="30" width="22" height="130" fill="#107C41"/>
      <rect x="207" y="50" width="22" height="110" fill="#107C41"/>
      <rect x="239" y="35" width="22" height="125" fill="#107C41"/>
      <rect x="271" y="20" width="22" height="140" fill="#107C41"/>
      <rect x="303" y="10" width="22" height="150" fill="#3B82F6"/>
      <rect x="335" y="5" width="22" height="155" fill="#3B82F6" fill-opacity="0.5"/>
      <rect x="367" y="0" width="22" height="160" fill="#3B82F6" fill-opacity="0.3"/>

      <!-- Base line -->
      <line x1="0" y1="160" x2="400" y2="160" stroke="#3A506B"/>
      <!-- Target dashed line -->
      <line x1="0" y1="40" x2="400" y2="40" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="400" y="35" fill="#F59E0B" font-size="9" text-anchor="end">Target: $450K/mo</text>

      <!-- Month labels -->
      <text x="26" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Jan</text>
      <text x="58" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Feb</text>
      <text x="90" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Mar</text>
      <text x="122" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Apr</text>
      <text x="154" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">May</text>
      <text x="186" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Jun</text>
      <text x="218" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Jul</text>
      <text x="250" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Aug</text>
      <text x="282" y="175" fill="#94A3B8" font-size="8" text-anchor="middle">Sep</text>
      <text x="314" y="175" fill="#38BDF8" font-size="8" text-anchor="middle">Oct</text>
      <text x="346" y="175" fill="#38BDF8" font-size="8" text-anchor="middle">Nov</text>
      <text x="378" y="175" fill="#38BDF8" font-size="8" text-anchor="middle">Dec</text>
    </g>
  </g>

  <!-- Right: Top Products Leaderboard Table (240px) -->
  <g transform="translate(510, 210)">
    <rect width="260" height="250" rx="8" fill="#1C2541" stroke="#3A506B"/>
    <text x="15" y="26" fill="#FFFFFF" font-size="12" font-weight="bold">Product Category Share</text>

    <!-- Product 1 -->
    <g transform="translate(15, 45)">
      <text y="12" fill="#E2E8F0" font-size="11">Cloud Infrastructure</text>
      <text x="230" y="12" fill="#4ADE80" font-size="11" font-weight="bold" text-anchor="end">$1.84M</text>
      <rect y="20" width="230" height="6" rx="3" fill="#0B132B"/>
      <rect y="20" width="160" height="6" rx="3" fill="#107C41"/>
    </g>

    <!-- Product 2 -->
    <g transform="translate(15, 85)">
      <text y="12" fill="#E2E8F0" font-size="11">AI Automation Suite</text>
      <text x="230" y="12" fill="#4ADE80" font-size="11" font-weight="bold" text-anchor="end">$1.42M</text>
      <rect y="20" width="230" height="6" rx="3" fill="#0B132B"/>
      <rect y="20" width="125" height="6" rx="3" fill="#3B82F6"/>
    </g>

    <!-- Product 3 -->
    <g transform="translate(15, 125)">
      <text y="12" fill="#E2E8F0" font-size="11">Enterprise Security</text>
      <text x="230" y="12" fill="#4ADE80" font-size="11" font-weight="bold" text-anchor="end">$960K</text>
      <rect y="20" width="230" height="6" rx="3" fill="#0B132B"/>
      <rect y="20" width="85" height="6" rx="3" fill="#8B5CF6"/>
    </g>

    <!-- Product 4 -->
    <g transform="translate(15, 165)">
      <text y="12" fill="#E2E8F0" font-size="11">Consulting Services</text>
      <text x="230" y="12" fill="#4ADE80" font-size="11" font-weight="bold" text-anchor="end">$600K</text>
      <rect y="20" width="230" height="6" rx="3" fill="#0B132B"/>
      <rect y="20" width="50" height="6" rx="3" fill="#F59E0B"/>
    </g>

    <text x="15" y="235" fill="#64748B" font-size="9">Updated via Power Query: Today, 08:30 AM</text>
  </g>

</svg>
