<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pandasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="896" height="496" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">
    PANDAS CORE ARCHITECTURE: SERIES VS DATAFRAME
  </text>
  <text x="450" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    1D Labeled Array (Series) vs 2D Tabular Labeled Matrix with Heterogeneous Columns (DataFrame)
  </text>

  <!-- 1D SERIES CONTAINER (Left) -->
  <g transform="translate(60, 105)" filter="url(#shadow)">
    <rect width="250" height="345" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect width="250" height="45" rx="12" fill="url(#pandasGrad)" />
    <rect y="35" width="250" height="10" fill="url(#pandasGrad)" />
    <text x="125" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      1D pd.Series
    </text>

    <!-- Series Explanations -->
    <rect x="20" y="60" width="80" height="25" rx="5" fill="#334155" />
    <text x="60" y="77" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Index</text>

    <rect x="110" y="60" width="120" height="25" rx="5" fill="#334155" />
    <text x="170" y="77" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Values (1D)</text>

    <!-- Series Rows -->
    <g font-family="monospace" font-size="12">
      <!-- Row 0 -->
      <rect x="20" y="95" width="80" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="60" y="115" fill="#f59e0b" text-anchor="middle" font-weight="600">0 ('A')</text>
      <rect x="110" y="95" width="120" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="170" y="115" fill="#f8fafc" text-anchor="middle">24,500</text>

      <!-- Row 1 -->
      <rect x="20" y="135" width="80" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="60" y="155" fill="#f59e0b" text-anchor="middle" font-weight="600">1 ('B')</text>
      <rect x="110" y="135" width="120" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="170" y="155" fill="#f8fafc" text-anchor="middle">31,200</text>

      <!-- Row 2 -->
      <rect x="20" y="175" width="80" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="60" y="195" fill="#f59e0b" text-anchor="middle" font-weight="600">2 ('C')</text>
      <rect x="110" y="175" width="120" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="170" y="195" fill="#f8fafc" text-anchor="middle">18,900</text>

      <!-- Row 3 -->
      <rect x="20" y="215" width="80" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="60" y="235" fill="#f59e0b" text-anchor="middle" font-weight="600">3 ('D')</text>
      <rect x="110" y="215" width="120" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="170" y="235" fill="#f8fafc" text-anchor="middle">45,100</text>
    </g>

    <!-- Series Meta -->
    <rect x="20" y="265" width="210" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="30" y="285" fill="#94a3b8" font-family="system-ui" font-size="11">Name: <tspan fill="#ec4899" font-weight="700">'Salary'</tspan></text>
    <text x="30" y="303" fill="#94a3b8" font-family="system-ui" font-size="11">Dtype: <tspan fill="#38bdf8" font-weight="700">int64</tspan></text>
  </g>

  <!-- 2D DATAFRAME CONTAINER (Right) -->
  <g transform="translate(350, 105)" filter="url(#shadow)">
    <rect width="490" height="345" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect width="490" height="45" rx="12" fill="url(#primaryGrad)" />
    <rect y="35" width="490" height="10" fill="url(#primaryGrad)" />
    <text x="245" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      2D pd.DataFrame (Collection of aligned Series sharing an Index)
    </text>

    <!-- Column Headers (Columns Index) -->
    <g font-family="monospace" font-size="11" font-weight="700">
      <rect x="20" y="60" width="60" height="25" rx="4" fill="#334155" />
      <text x="50" y="77" fill="#f59e0b" text-anchor="middle">Index</text>

      <rect x="90" y="60" width="115" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" />
      <text x="147" y="77" fill="#60a5fa" text-anchor="middle">name (object)</text>

      <rect x="215" y="60" width="75" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" />
      <text x="252" y="77" fill="#60a5fa" text-anchor="middle">age (int64)</text>

      <rect x="300" y="60" width="95" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" />
      <text x="347" y="77" fill="#60a5fa" text-anchor="middle">dept (object)</text>

      <rect x="405" y="60" width="70" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" />
      <text x="440" y="77" fill="#60a5fa" text-anchor="middle">salary (int)</text>
    </g>

    <!-- Rows -->
    <g font-family="monospace" font-size="11">
      <!-- Row 0 -->
      <rect x="20" y="95" width="60" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="50" y="115" fill="#f59e0b" font-weight="700" text-anchor="middle">0</text>
      <rect x="90" y="95" width="115" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="147" y="115" fill="#f8fafc" text-anchor="middle">'Aarav'</text>
      <rect x="215" y="95" width="75" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="252" y="115" fill="#f8fafc" text-anchor="middle">28</text>
      <rect x="300" y="95" width="95" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="347" y="115" fill="#f8fafc" text-anchor="middle">'Analytics'</text>
      <rect x="405" y="95" width="70" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="440" y="115" fill="#f8fafc" text-anchor="middle">65000</text>

      <!-- Row 1 -->
      <rect x="20" y="135" width="60" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="50" y="155" fill="#f59e0b" font-weight="700" text-anchor="middle">1</text>
      <rect x="90" y="135" width="115" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="147" y="155" fill="#f8fafc" text-anchor="middle">'Priya'</text>
      <rect x="215" y="135" width="75" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="252" y="155" fill="#f8fafc" text-anchor="middle">24</text>
      <rect x="300" y="135" width="95" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="347" y="155" fill="#f8fafc" text-anchor="middle">'Finance'</text>
      <rect x="405" y="135" width="70" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="440" y="155" fill="#f8fafc" text-anchor="middle">58000</text>

      <!-- Row 2 -->
      <rect x="20" y="175" width="60" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="50" y="195" fill="#f59e0b" font-weight="700" text-anchor="middle">2</text>
      <rect x="90" y="175" width="115" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="147" y="195" fill="#f8fafc" text-anchor="middle">'Rohan'</text>
      <rect x="215" y="175" width="75" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="252" y="195" fill="#f8fafc" text-anchor="middle">31</text>
      <rect x="300" y="175" width="95" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="347" y="195" fill="#f8fafc" text-anchor="middle">'Engineering'</text>
      <rect x="405" y="175" width="70" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="440" y="195" fill="#f8fafc" text-anchor="middle">82000</text>

      <!-- Row 3 -->
      <rect x="20" y="215" width="60" height="30" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="50" y="235" fill="#f59e0b" font-weight="700" text-anchor="middle">3</text>
      <rect x="90" y="215" width="115" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="147" y="235" fill="#f8fafc" text-anchor="middle">'Sneha'</text>
      <rect x="215" y="215" width="75" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="252" y="235" fill="#f8fafc" text-anchor="middle">29</text>
      <rect x="300" y="215" width="95" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="347" y="235" fill="#f8fafc" text-anchor="middle">'Marketing'</text>
      <rect x="405" y="215" width="70" height="30" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="440" y="235" fill="#f8fafc" text-anchor="middle">61000</text>
    </g>

    <!-- DataFrame Meta Box -->
    <rect x="20" y="265" width="455" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="35" y="288" fill="#38bdf8" font-family="monospace" font-size="12">
      df.shape: (4, 4) | df.columns: Index(['name', 'age', 'dept', 'salary'])
    </text>
    <text x="35" y="308" fill="#94a3b8" font-family="system-ui" font-size="11">
      Access individual column as Series: <tspan fill="#f59e0b" font-family="monospace">df['salary']</tspan> | Row selection: <tspan fill="#ec4899" font-family="monospace">df.loc[0]</tspan>
    </text>
  </g>
</svg>