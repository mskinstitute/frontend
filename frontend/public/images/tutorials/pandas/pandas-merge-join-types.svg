<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad2)" />
  <rect x="2" y="2" width="896" height="476" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    PANDAS pd.merge(): THE 4 RELATIONAL JOIN TYPES
  </text>
  <text x="450" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Syntax: pd.merge(df_left, df_right, on='key', how='inner' | 'left' | 'right' | 'outer')
  </text>

  <!-- 1. INNER JOIN -->
  <g transform="translate(45, 95)" filter="url(#glow)">
    <rect width="185" height="340" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="185" height="35" rx="10" fill="#2563eb" />
    <text x="92" y="23" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">how='inner'</text>
    
    <!-- Venn diagram -->
    <g transform="translate(92, 95)">
      <circle cx="-22" cy="0" r="35" fill="#334155" opacity="0.6" stroke="#64748b" stroke-width="1.5" />
      <circle cx="22" cy="0" r="35" fill="#334155" opacity="0.6" stroke="#64748b" stroke-width="1.5" />
      <!-- Intersection clip -->
      <clipPath id="cLeft"><circle cx="-22" cy="0" r="35" /></clipPath>
      <circle cx="22" cy="0" r="35" fill="#3b82f6" clip-path="url(#cLeft)" />
      <text x="-32" y="4" fill="#cbd5e1" font-size="10" font-family="system-ui">Left</text>
      <text x="32" y="4" fill="#cbd5e1" font-size="10" font-family="system-ui">Right</text>
    </g>

    <text x="92" y="165" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Intersection Only</text>
    <rect x="15" y="180" width="155" height="135" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="202" fill="#94a3b8" font-family="system-ui" font-size="11">Only keys existing in</text>
    <text x="25" y="218" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">BOTH DataFrames</text>
    <text x="25" y="234" fill="#94a3b8" font-family="system-ui" font-size="11">are retained.</text>
    <text x="25" y="260" fill="#f59e0b" font-family="monospace" font-size="10">• Default behavior</text>
    <text x="25" y="278" fill="#f59e0b" font-family="monospace" font-size="10">• No NaN from keys</text>
    <text x="25" y="296" fill="#f59e0b" font-family="monospace" font-size="10">• Smallest output</text>
  </g>

  <!-- 2. LEFT JOIN -->
  <g transform="translate(255, 95)" filter="url(#glow)">
    <rect width="185" height="340" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="185" height="35" rx="10" fill="#059669" />
    <text x="92" y="23" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">how='left'</text>
    
    <!-- Venn diagram -->
    <g transform="translate(92, 95)">
      <circle cx="-22" cy="0" r="35" fill="#10b981" opacity="0.9" stroke="#059669" stroke-width="1.5" />
      <circle cx="22" cy="0" r="35" fill="#334155" opacity="0.6" stroke="#64748b" stroke-width="1.5" />
      <clipPath id="cLeft2"><circle cx="-22" cy="0" r="35" /></clipPath>
      <circle cx="22" cy="0" r="35" fill="#059669" clip-path="url(#cLeft2)" />
      <text x="-32" y="4" fill="#0f172a" font-size="10" font-weight="700" font-family="system-ui">Left</text>
      <text x="32" y="4" fill="#cbd5e1" font-size="10" font-family="system-ui">Right</text>
    </g>

    <text x="92" y="165" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">All Left + Matched Right</text>
    <rect x="15" y="180" width="155" height="135" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="202" fill="#94a3b8" font-family="system-ui" font-size="11">Keeps every row from</text>
    <text x="25" y="218" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Left DataFrame.</text>
    <text x="25" y="234" fill="#94a3b8" font-family="system-ui" font-size="11">Fills right with NaN</text>
    <text x="25" y="250" fill="#94a3b8" font-family="system-ui" font-size="11">if no match is found.</text>
    <text x="25" y="278" fill="#34d399" font-family="monospace" font-size="10">• Master table join</text>
    <text x="25" y="296" fill="#34d399" font-family="monospace" font-size="10">• Most popular in BI</text>
  </g>

  <!-- 3. RIGHT JOIN -->
  <g transform="translate(465, 95)" filter="url(#glow)">
    <rect width="185" height="340" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="185" height="35" rx="10" fill="#d97706" />
    <text x="92" y="23" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">how='right'</text>
    
    <!-- Venn diagram -->
    <g transform="translate(92, 95)">
      <circle cx="-22" cy="0" r="35" fill="#334155" opacity="0.6" stroke="#64748b" stroke-width="1.5" />
      <circle cx="22" cy="0" r="35" fill="#f59e0b" opacity="0.9" stroke="#d97706" stroke-width="1.5" />
      <clipPath id="cRight3"><circle cx="22" cy="0" r="35" /></clipPath>
      <circle cx="-22" cy="0" r="35" fill="#b45309" clip-path="url(#cRight3)" />
      <text x="-32" y="4" fill="#cbd5e1" font-size="10" font-family="system-ui">Left</text>
      <text x="32" y="4" fill="#0f172a" font-size="10" font-weight="700" font-family="system-ui">Right</text>
    </g>

    <text x="92" y="165" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">All Right + Matched Left</text>
    <rect x="15" y="180" width="155" height="135" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="202" fill="#94a3b8" font-family="system-ui" font-size="11">Keeps every row from</text>
    <text x="25" y="218" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Right DataFrame.</text>
    <text x="25" y="234" fill="#94a3b8" font-family="system-ui" font-size="11">Fills left with NaN</text>
    <text x="25" y="250" fill="#94a3b8" font-family="system-ui" font-size="11">if unmatched.</text>
    <text x="25" y="278" fill="#fbbf24" font-family="monospace" font-size="10">• Mirror of left join</text>
    <text x="25" y="296" fill="#fbbf24" font-family="monospace" font-size="10">• Rare in practice</text>
  </g>

  <!-- 4. OUTER JOIN -->
  <g transform="translate(675, 95)" filter="url(#glow)">
    <rect width="185" height="340" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <rect width="185" height="35" rx="10" fill="#db2777" />
    <text x="92" y="23" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">how='outer'</text>
    
    <!-- Venn diagram -->
    <g transform="translate(92, 95)">
      <circle cx="-22" cy="0" r="35" fill="#ec4899" opacity="0.8" stroke="#be185d" stroke-width="1.5" />
      <circle cx="22" cy="0" r="35" fill="#ec4899" opacity="0.8" stroke="#be185d" stroke-width="1.5" />
      <text x="-32" y="4" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui">Left</text>
      <text x="32" y="4" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui">Right</text>
    </g>

    <text x="92" y="165" fill="#f472b6" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Full Union of Both</text>
    <rect x="15" y="180" width="155" height="135" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="202" fill="#94a3b8" font-family="system-ui" font-size="11">Retains ALL rows from</text>
    <text x="25" y="218" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">both Left &amp; Right.</text>
    <text x="25" y="234" fill="#94a3b8" font-family="system-ui" font-size="11">Missing values filled</text>
    <text x="25" y="250" fill="#94a3b8" font-family="system-ui" font-size="11">with NaN on both sides.</text>
    <text x="25" y="278" fill="#f472b6" font-family="monospace" font-size="10">• Full reconciliation</text>
    <text x="25" y="296" fill="#f472b6" font-family="monospace" font-size="10">• Largest output</text>
  </g>
</svg>