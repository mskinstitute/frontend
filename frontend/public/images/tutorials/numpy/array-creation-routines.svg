<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Essential NumPy Array Creation Routines</text>
  <text x="450" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Generating Pre-Filled Arrays, Numerical Sequences &amp; Identity Matrices</text>

  <!-- Card 1: np.zeros -->
  <g transform="translate(40, 105)">
    <rect width="250" height="170" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#0284c7"/>
    <text x="125" y="21" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">np.zeros((2, 3))</text>
    
    <g transform="translate(50, 45)">
      <rect x="0" y="0" width="45" height="30" fill="#0369a1" rx="4"/><text x="22" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
      <rect x="50" y="0" width="45" height="30" fill="#0369a1" rx="4"/><text x="72" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
      <rect x="100" y="0" width="45" height="30" fill="#0369a1" rx="4"/><text x="122" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
      
      <rect x="0" y="35" width="45" height="30" fill="#0369a1" rx="4"/><text x="22" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
      <rect x="50" y="35" width="45" height="30" fill="#0369a1" rx="4"/><text x="72" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
      <rect x="100" y="35" width="45" height="30" fill="#0369a1" rx="4"/><text x="122" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.</text>
    </g>
    <text x="125" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Initializes array filled with float zeros</text>
  </g>

  <!-- Card 2: np.ones -->
  <g transform="translate(325, 105)">
    <rect width="250" height="170" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#059669"/>
    <text x="125" y="21" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">np.ones((2, 3), dtype=int)</text>
    
    <g transform="translate(50, 45)">
      <rect x="0" y="0" width="45" height="30" fill="#047857" rx="4"/><text x="22" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="50" y="0" width="45" height="30" fill="#047857" rx="4"/><text x="72" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="100" y="0" width="45" height="30" fill="#047857" rx="4"/><text x="122" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      
      <rect x="0" y="35" width="45" height="30" fill="#047857" rx="4"/><text x="22" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="50" y="35" width="45" height="30" fill="#047857" rx="4"/><text x="72" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="100" y="35" width="45" height="30" fill="#047857" rx="4"/><text x="122" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
    </g>
    <text x="125" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Initializes array filled with ones</text>
  </g>

  <!-- Card 3: np.full -->
  <g transform="translate(610, 105)">
    <rect width="250" height="170" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#d97706"/>
    <text x="125" y="21" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">np.full((2, 3), 7)</text>
    
    <g transform="translate(50, 45)">
      <rect x="0" y="0" width="45" height="30" fill="#b45309" rx="4"/><text x="22" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      <rect x="50" y="0" width="45" height="30" fill="#b45309" rx="4"/><text x="72" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      <rect x="100" y="0" width="45" height="30" fill="#b45309" rx="4"/><text x="122" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      
      <rect x="0" y="35" width="45" height="30" fill="#b45309" rx="4"/><text x="22" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      <rect x="50" y="35" width="45" height="30" fill="#b45309" rx="4"/><text x="72" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      <rect x="100" y="35" width="45" height="30" fill="#b45309" rx="4"/><text x="122" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
    </g>
    <text x="125" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Initializes array with custom constant</text>
  </g>

  <!-- Card 4: np.arange -->
  <g transform="translate(40, 295)">
    <rect width="390" height="170" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="390" height="32" rx="10" fill="#7c3aed"/>
    <text x="195" y="21" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">np.arange(start=10, stop=30, step=5)</text>
    
    <g transform="translate(35, 55)">
      <rect x="0" y="0" width="70" height="40" fill="#6d28d9" rx="6"/><text x="35" y="25" fill="#fff" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">10</text>
      <rect x="80" y="0" width="70" height="40" fill="#6d28d9" rx="6"/><text x="115" y="25" fill="#fff" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">15</text>
      <rect x="160" y="0" width="70" height="40" fill="#6d28d9" rx="6"/><text x="195" y="25" fill="#fff" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">20</text>
      <rect x="240" y="0" width="70" height="40" fill="#6d28d9" rx="6"/><text x="275" y="25" fill="#fff" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">25</text>
    </g>
    <text x="195" y="125" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Step-based spacing (Stop value 30 is EXCLUDED)</text>
    <text x="195" y="145" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Returns: array([10, 15, 20, 25])</text>
  </g>

  <!-- Card 5: np.linspace -->
  <g transform="translate(470, 295)">
    <rect width="390" height="170" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="390" height="32" rx="10" fill="#db2777"/>
    <text x="195" y="21" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">np.linspace(start=0, stop=1, num=5)</text>
    
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="65" height="40" fill="#be185d" rx="6"/><text x="32" y="25" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0.00</text>
      <rect x="72" y="0" width="65" height="40" fill="#be185d" rx="6"/><text x="104" y="25" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0.25</text>
      <rect x="144" y="0" width="65" height="40" fill="#be185d" rx="6"/><text x="176" y="25" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0.50</text>
      <rect x="216" y="0" width="65" height="40" fill="#be185d" rx="6"/><text x="248" y="25" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0.75</text>
      <rect x="288" y="0" width="65" height="40" fill="#be185d" rx="6"/><text x="320" y="25" fill="#fff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">1.00</text>
    </g>
    <text x="195" y="125" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Endpoint-inclusive evenly spaced points (Crucial for plotting!)</text>
    <text x="195" y="145" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Returns: array([0.  , 0.25, 0.5 , 0.75, 1.  ])</text>
  </g>
</svg>