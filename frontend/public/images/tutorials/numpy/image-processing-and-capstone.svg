<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NumPy Capstone: Images as 3D Ndarrays</text>
  <text x="450" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Manipulating Pixels, Color Channels (RGB), Cropping and Image Transformations</text>

  <!-- Left: 3D Image Tensor Anatomy -->
  <g transform="translate(50, 95)">
    <rect width="380" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="380" height="35" rx="10" fill="#0284c7"/>
    <text x="190" y="23" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Image = 3D ndarray: (Height, Width, 3)</text>

    <!-- RGB 3 Stacked Channels Visual -->
    <g transform="translate(60, 60)">
      <!-- Blue Channel (Back) -->
      <g transform="translate(40, -20)">
        <rect width="180" height="120" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" rx="6"/>
        <text x="90" y="65" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Blue: [:, :, 2]</text>
      </g>
      <!-- Green Channel (Middle) -->
      <g transform="translate(20, -10)">
        <rect width="180" height="120" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="6"/>
        <text x="90" y="65" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Green: [:, :, 1]</text>
      </g>
      <!-- Red Channel (Front) -->
      <g transform="translate(0, 0)">
        <rect width="180" height="120" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" rx="6"/>
        <text x="90" y="65" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Red: [:, :, 0]</text>
      </g>
    </g>

    <rect x="25" y="220" width="330" height="135" fill="#0f172a" rx="8"/>
    <text x="40" y="245" fill="#38bdf8" font-family="monospace" font-size="12">import matplotlib.pyplot as plt</text>
    <text x="40" y="265" fill="#f8fafc" font-family="monospace" font-size="12">img = plt.imread('photo.jpg')</text>
    <text x="40" y="290" fill="#94a3b8" font-family="monospace" font-size="11">print(img.shape) # (1080, 1920, 3)</text>
    <text x="40" y="310" fill="#94a3b8" font-family="monospace" font-size="11">print(img.dtype) # uint8 (0 to 255)</text>
    <text x="40" y="330" fill="#22c55e" font-family="monospace" font-size="11"># Each pixel is an RGB tuple</text>
  </g>

  <!-- Right: Common Array Manipulations on Images -->
  <g transform="translate(470, 95)">
    <rect width="380" height="375" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="380" height="35" rx="10" fill="#059669"/>
    <text x="190" y="23" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Array Transformation Recipes</text>

    <g transform="translate(25, 50)">
      <!-- Recipe 1 -->
      <rect width="330" height="60" fill="#0f172a" rx="6"/>
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">1. Cropping Image via Slicing:</text>
      <text x="15" y="44" fill="#cbd5e1" font-family="monospace" font-size="11">cropped = img[200:600, 300:800, :]</text>

      <!-- Recipe 2 -->
      <rect y="70" width="330" height="60" fill="#0f172a" rx="6"/>
      <text x="15" y="92" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">2. Invert Colors (Negative Film):</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="monospace" font-size="11">inverted = 255 - img  # Vectorized math!</text>

      <!-- Recipe 3 -->
      <rect y="140" width="330" height="60" fill="#0f172a" rx="6"/>
      <text x="15" y="162" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">3. Grayscale (Luminosity weights):</text>
      <text x="15" y="184" fill="#cbd5e1" font-family="monospace" font-size="11">gray = np.dot(img[...,:3], [0.299, 0.587, 0.114])</text>

      <!-- Recipe 4 -->
      <rect y="210" width="330" height="60" fill="#0f172a" rx="6"/>
      <text x="15" y="232" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">4. Flip &amp; Rotate:</text>
      <text x="15" y="254" fill="#cbd5e1" font-family="monospace" font-size="11">flipped_horizontal = img[:, ::-1, :]</text>
    </g>

    <text x="190" y="350" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Everything in Computer Vision (OpenCV, PyTorch) is an ndarray!</text>
  </g>
</svg>