<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NumPy Indexing, Slicing &amp; Multi-Dimensional Strides</text>
  <text x="450" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Syntax: arr[row_start:row_stop:step, col_start:col_stop:step]</text>

  <!-- 2D Grid Representation -->
  <g transform="translate(60, 110)">
    <!-- Column Index Header -->
    <text x="100" y="-15" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Col 0</text>
    <text x="175" y="-15" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Col 1</text>
    <text x="250" y="-15" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Col 2</text>
    <text x="325" y="-15" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Col 3</text>
    <text x="400" y="-15" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Col 4</text>

    <!-- Row 0 -->
    <text x="20" y="38" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="700">Row 0</text>
    <rect x="80" y="10" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="112" y="38" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">00</text>
    <rect x="155" y="10" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="187" y="38" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">01</text>
    <rect x="230" y="10" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="262" y="38" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">02</text>
    <rect x="305" y="10" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="337" y="38" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">03</text>
    <rect x="380" y="10" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="412" y="38" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">04</text>

    <!-- Row 1 -->
    <text x="20" y="98" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="700">Row 1</text>
    <rect x="80" y="70" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="112" y="98" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">10</text>
    <!-- Highlighted block starts here: arr[1:3, 1:4] -->
    <rect x="155" y="70" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="187" y="98" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">11</text>
    <rect x="230" y="70" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="262" y="98" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">12</text>
    <rect x="305" y="70" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="337" y="98" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">13</text>
    <rect x="380" y="70" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="412" y="98" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">14</text>

    <!-- Row 2 -->
    <text x="20" y="158" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="700">Row 2</text>
    <rect x="80" y="130" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="112" y="158" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">20</text>
    <rect x="155" y="130" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="187" y="158" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">21</text>
    <rect x="230" y="130" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="262" y="158" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">22</text>
    <rect x="305" y="130" width="65" height="45" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/><text x="337" y="158" fill="#ffffff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">23</text>
    <rect x="380" y="130" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="412" y="158" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">24</text>

    <!-- Row 3 -->
    <text x="20" y="218" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="700">Row 3</text>
    <rect x="80" y="190" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="112" y="218" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">30</text>
    <rect x="155" y="190" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="187" y="218" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">31</text>
    <rect x="230" y="190" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="262" y="218" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">32</text>
    <rect x="305" y="190" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="337" y="218" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">33</text>
    <rect x="380" y="190" width="65" height="45" fill="#1e293b" stroke="#475569" rx="4"/><text x="412" y="218" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">34</text>

    <!-- Visual Highlight Bounding Box -->
    <rect x="150" y="65" width="225" height="115" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" rx="8"/>
    <text x="262" y="270" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">Highlighted Slice: arr[1:3, 1:4]</text>
  </g>

  <!-- Right Explanations Box -->
  <g transform="translate(540, 100)">
    <rect width="320" height="380" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="320" height="40" rx="12" fill="#334155"/>
    <text x="160" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Common Indexing Recipes</text>

    <g transform="translate(20, 60)">
      <text x="0" y="20" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="700">1. Single Element:</text>
      <text x="10" y="40" fill="#cbd5e1" font-family="monospace" font-size="12">arr[2, 3]  # -&gt; 23 (Row 2, Col 3)</text>

      <text x="0" y="75" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">2. Entire Row / Column:</text>
      <text x="10" y="95" fill="#cbd5e1" font-family="monospace" font-size="12">arr[1, :]  # All cols in Row 1</text>
      <text x="10" y="115" fill="#cbd5e1" font-family="monospace" font-size="12">arr[:, 2]  # All rows in Col 2</text>

      <text x="0" y="150" fill="#22c55e" font-family="monospace" font-size="13" font-weight="700">3. Strided / Stepped Slice:</text>
      <text x="10" y="170" fill="#cbd5e1" font-family="monospace" font-size="12">arr[::2, ::2] # Every 2nd element</text>

      <text x="0" y="205" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">4. Reverse Array:</text>
      <text x="10" y="225" fill="#cbd5e1" font-family="monospace" font-size="12">arr[::-1, ::-1] # Flip upside-down</text>

      <text x="0" y="260" fill="#a855f7" font-family="monospace" font-size="13" font-weight="700">5. Golden Rule:</text>
      <text x="10" y="280" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11">Standard slices produce VIEWS in memory!</text>
      <text x="10" y="298" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11">Modifying a slice alters the parent array.</text>
    </g>
  </g>
</svg>