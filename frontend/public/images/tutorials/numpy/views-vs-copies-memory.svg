<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NumPy Memory Mechanics: Views vs. Deep Copies</text>
  <text x="450" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Shared Underlying Memory Buffer (view) vs. Independent RAM Allocation (copy)</text>

  <!-- Left: Original Array -->
  <g transform="translate(60, 100)">
    <rect width="360" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="360" height="32" rx="10" fill="#1d4ed8"/>
    <text x="180" y="22" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Original Array 'a' = np.array([10, 20, 30, 40])</text>
    
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="70" height="45" fill="#0284c7" stroke="#38bdf8" rx="4"/><text x="35" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">10</text>
      <rect x="75" y="0" width="70" height="45" fill="#0284c7" stroke="#38bdf8" rx="4"/><text x="110" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">20</text>
      <rect x="150" y="0" width="70" height="45" fill="#0284c7" stroke="#38bdf8" rx="4"/><text x="185" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">30</text>
      <rect x="225" y="0" width="70" height="45" fill="#0284c7" stroke="#38bdf8" rx="4"/><text x="260" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">40</text>
    </g>
    <text x="180" y="130" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Memory Address: 0x7ffd980a0 (Owns data buffer)</text>
  </g>

  <!-- Middle: Slicing (View) -->
  <g transform="translate(60, 280)">
    <rect width="360" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="360" height="32" rx="10" fill="#b45309"/>
    <text x="180" y="22" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Slicing creates a VIEW: 'v = a[1:3]'</text>
    
    <!-- Pointer up to original -->
    <path d="M 180 0 L 180 -25" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>

    <text x="180" y="60" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">v.base is a -&gt; TRUE (No data is copied!)</text>
    
    <g transform="translate(105, 80)">
      <rect x="0" y="0" width="70" height="45" fill="#d97706" stroke="#fbbf24" rx="4"/><text x="35" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">20</text>
      <rect x="75" y="0" width="70" height="45" fill="#d97706" stroke="#fbbf24" rx="4"/><text x="110" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">30</text>
    </g>
    <text x="180" y="150" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Caution: v[0] = 999 will CHANGE a[1] to 999!</text>
  </g>

  <!-- Right: Deep Copy -->
  <g transform="translate(480, 100)">
    <rect width="360" height="360" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="360" height="32" rx="10" fill="#047857"/>
    <text x="180" y="22" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Deep Copy: 'c = a.copy()'</text>
    
    <text x="180" y="65" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">c.base is None -&gt; TRUE (Owns its buffer)</text>
    
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="70" height="45" fill="#059669" stroke="#34d399" rx="4"/><text x="35" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">10</text>
      <rect x="75" y="0" width="70" height="45" fill="#059669" stroke="#34d399" rx="4"/><text x="110" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">20</text>
      <rect x="150" y="0" width="70" height="45" fill="#059669" stroke="#34d399" rx="4"/><text x="185" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">30</text>
      <rect x="225" y="0" width="70" height="45" fill="#059669" stroke="#34d399" rx="4"/><text x="260" y="28" fill="#fff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">40</text>
    </g>

    <text x="180" y="160" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">New Independent Memory Buffer Allocated in RAM</text>

    <!-- Comparison Summary Box -->
    <rect x="25" y="190" width="310" height="150" fill="#0f172a" rx="8"/>
    <text x="40" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">When to use what?</text>
    <text x="40" y="240" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Use View (slicing): For high-speed</text>
    <text x="40" y="258" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">  processing of gigabyte arrays without RAM bloat.</text>
    <text x="40" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Use .copy(): When you must modify sub-data</text>
    <text x="40" y="303" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">  without mutating the original source dataset.</text>
  </g>
</svg>