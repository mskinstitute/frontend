<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bellBg)" />
  <rect x="2" y="2" width="896" height="476" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui" font-size="22" font-weight="800" text-anchor="middle">
    STATISTICAL HYPOTHESIS TESTING: THE NORMAL DISTRIBUTION &amp; P-VALUE
  </text>
  <text x="450" y="70" fill="#94a3b8" font-family="system-ui" font-size="13" text-anchor="middle">
    Two-Tailed Test at Significance Level α = 0.05 (Reject H₀ if p-value &lt; 0.05)
  </text>
  <!-- Main Bell Curve -->
  <g transform="translate(100, 100)">
    <!-- Shaded Rejection Regions (Tails) -->
    <path d="M 50 250 Q 80 248 100 240 L 100 250 Z" fill="#ef4444" opacity="0.8" />
    <path d="M 600 240 Q 620 248 650 250 L 600 250 Z" fill="#ef4444" opacity="0.8" />
    <!-- Acceptance Region (Center) -->
    <path d="M 100 240 Q 200 220 350 50 Q 500 220 600 240 L 600 250 L 100 250 Z" fill="#3b82f6" opacity="0.25" />
    <!-- Bell Curve Stroke -->
    <path d="M 50 250 Q 150 245 250 180 Q 350 40 450 180 Q 550 245 650 250" fill="none" stroke="#60a5fa" stroke-width="3.5" />
    <!-- Center Line Mean (μ) -->
    <line x1="350" y1="40" x2="350" y2="270" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4,4" />
    <text x="350" y="295" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Mean (μ = 0)</text>
    <text x="350" y="160" fill="#93c5fd" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">Acceptance Region (95%)</text>
    <text x="350" y="180" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">Fail to Reject Null Hypothesis (H₀)</text>
    <!-- Left Critical Value -->
    <line x1="100" y1="220" x2="100" y2="270" stroke="#ef4444" stroke-width="2" />
    <text x="100" y="295" fill="#f87171" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">-1.96</text>
    <text x="75" y="320" fill="#f87171" font-family="system-ui" font-size="10" text-anchor="middle">α/2 = 2.5%</text>
    <!-- Right Critical Value -->
    <line x1="600" y1="220" x2="600" y2="270" stroke="#ef4444" stroke-width="2" />
    <text x="600" y="295" fill="#f87171" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">+1.96</text>
    <text x="625" y="320" fill="#f87171" font-family="system-ui" font-size="10" text-anchor="middle">α/2 = 2.5%</text>
  </g>
</svg>