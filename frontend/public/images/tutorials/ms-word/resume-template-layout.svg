<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="420" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="420" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Mini-Project: Professional 2-Column Resume Architecture - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="378" fill="#EEF2F6"/>

  <!-- Resume Sheet -->
  <g transform="translate(120, 60)">
    <rect x="0" y="0" width="560" height="340" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header -->
    <rect x="0" y="0" width="560" height="65" fill="#185ABD"/>
    <text x="30" y="32" font-size="18" font-weight="bold" fill="#FFFFFF">SUMIT KUMAR</text>
    <text x="30" y="50" font-size="11" fill="#BFDBFE">Software Engineer &amp; Full-Stack Educator | Delhi, India | sumit@mskinstitute.in</text>

    <!-- Left Column: 180px -->
    <g transform="translate(25, 80)">
      <rect x="0" y="0" width="160" height="240" fill="#F8FAFC" rx="4" stroke="#E2E8F0"/>
      <text x="12" y="25" font-size="11" font-weight="bold" fill="#185ABD">TECHNICAL SKILLS</text>
      <text x="12" y="45" font-size="9" fill="#334155">• Next.js, React, Node</text>
      <text x="12" y="60" font-size="9" fill="#334155">• Python, MySQL, SQL</text>
      <text x="12" y="75" font-size="9" fill="#334155">• MS Word, Excel, VBA</text>

      <text x="12" y="110" font-size="11" font-weight="bold" fill="#185ABD">EDUCATION</text>
      <text x="12" y="128" font-size="9" font-weight="bold" fill="#0F172A">B.Tech in Computer Science</text>
      <text x="12" y="142" font-size="8" fill="#64748B">First Class with Distinction</text>

      <text x="12" y="175" font-size="11" font-weight="bold" fill="#185ABD">CERTIFICATIONS</text>
      <text x="12" y="195" font-size="9" fill="#334155">• Microsoft Certified Pro</text>
      <text x="12" y="210" font-size="9" fill="#334155">• NIELIT 'O' Level IT</text>
    </g>

    <!-- Right Column: 330px -->
    <g transform="translate(205, 80)">
      <text x="10" y="25" font-size="12" font-weight="bold" fill="#185ABD">PROFESSIONAL EXPERIENCE</text>
      <text x="10" y="46" font-size="10" font-weight="bold" fill="#0F172A">Lead Instructor &amp; Platform Architect</text>
      <text x="10" y="60" font-size="9" fill="#64748B">MSK Institute of Computer Technology (2021 - Present)</text>
      <text x="10" y="75" font-size="9" fill="#334155">• Trained 2,500+ students in web development, database management &amp; MS Office.</text>
      <text x="10" y="90" font-size="9" fill="#334155">• Engineered online LMS platform with automated quizzes &amp; interactive practice.</text>

      <text x="10" y="125" font-size="12" font-weight="bold" fill="#185ABD">KEY ACHIEVEMENTS &amp; PROJECTS</text>
      <text x="10" y="145" font-size="10" font-weight="bold" fill="#0F172A">Automated ERP Document Processing</text>
      <text x="10" y="160" font-size="9" fill="#334155">• Developed Word templates &amp; VBA scripts generating 10,000+ student certificates.</text>
      <text x="10" y="175" font-size="9" fill="#334155">• Saved 120+ admin hours monthly through mail merge automation.</text>
    </g>
  </g>

</svg>