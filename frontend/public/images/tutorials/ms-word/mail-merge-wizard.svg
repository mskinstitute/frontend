<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="380" viewBox="0 0 800 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="380" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="380" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Mail Merge 6-Step Automated Workflow - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="338" fill="#F8FAFC"/>

  <!-- Process Pipeline 6 Steps -->
  <g transform="translate(30, 65)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="55" cy="25" r="14" fill="#DBEAFE"/>
    <text x="55" y="30" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">1</text>
    <text x="55" y="60" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Select Doc</text>
    <text x="55" y="76" font-size="9" fill="#64748B" text-anchor="middle">Letters, Email,</text>
    <text x="55" y="88" font-size="9" fill="#64748B" text-anchor="middle">Envelopes, Labels</text>

    <!-- Arrow 1 -->
    <text x="118" y="60" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 2 -->
    <rect x="130" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="185" cy="25" r="14" fill="#DBEAFE"/>
    <text x="185" y="30" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">2</text>
    <text x="185" y="60" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Start Doc</text>
    <text x="185" y="76" font-size="9" fill="#64748B" text-anchor="middle">Use current file</text>
    <text x="185" y="88" font-size="9" fill="#64748B" text-anchor="middle">or base template</text>

    <!-- Arrow 2 -->
    <text x="248" y="60" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 3 -->
    <rect x="260" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="315" cy="25" r="14" fill="#D1FAE5"/>
    <text x="315" y="30" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">3</text>
    <text x="315" y="60" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Select Source</text>
    <text x="315" y="76" font-size="9" fill="#64748B" text-anchor="middle">Excel Sheet (.xlsx)</text>
    <text x="315" y="88" font-size="9" fill="#64748B" text-anchor="middle">or Access / CSV</text>

    <!-- Arrow 3 -->
    <text x="378" y="60" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 4 -->
    <rect x="390" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="445" cy="25" r="14" fill="#DBEAFE"/>
    <text x="445" y="30" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">4</text>
    <text x="445" y="60" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Insert Fields</text>
    <text x="445" y="76" font-size="9" fill="#64748B" text-anchor="middle">&lt;&lt;First_Name&gt;&gt;</text>
    <text x="445" y="88" font-size="9" fill="#64748B" text-anchor="middle">&lt;&lt;Address&gt;&gt;</text>

    <!-- Arrow 4 -->
    <text x="508" y="60" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 5 -->
    <rect x="520" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="575" cy="25" r="14" fill="#DBEAFE"/>
    <text x="575" y="30" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">5</text>
    <text x="575" y="60" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Preview</text>
    <text x="575" y="76" font-size="9" fill="#64748B" text-anchor="middle">Check record #1,</text>
    <text x="575" y="88" font-size="9" fill="#64748B" text-anchor="middle">#2, #3 live data</text>

    <!-- Arrow 5 -->
    <text x="638" y="60" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 6 -->
    <rect x="650" y="0" width="90" height="110" rx="8" fill="#185ABD"/>
    <circle cx="695" cy="25" r="14" fill="#FFFFFF"/>
    <text x="695" y="30" font-size="12" font-weight="bold" fill="#185ABD" text-anchor="middle">6</text>
    <text x="695" y="60" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Finish</text>
    <text x="695" y="76" font-size="9" fill="#DBEAFE" text-anchor="middle">Print or Edit</text>
    <text x="695" y="88" font-size="9" fill="#DBEAFE" text-anchor="middle">Individual Docs</text>
  </g>

  <!-- Live Example Card -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="740" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="740" height="28" rx="8" fill="#F1F5F9"/>
    <text x="15" y="19" font-size="11" font-weight="bold" fill="#334155">Live Mail Merge Letter Preview:</text>

    <text x="25" y="55" font-size="12" fill="#334155">Dear <tspan font-family="monospace" font-weight="bold" fill="#2563EB">&lt;&lt;Full_Name&gt;&gt;</tspan>,</text>
    <text x="25" y="75" font-size="12" fill="#334155">We are pleased to inform you that your invoice for <tspan font-family="monospace" font-weight="bold" fill="#16A34A">&lt;&lt;Course_Name&gt;&gt;</tspan> of amount <tspan font-family="monospace" font-weight="bold" fill="#DC2626">&lt;&lt;Amount&gt;&gt;</tspan> has been processed.</text>
    <text x="25" y="95" font-size="11" fill="#64748B">Result: 1 template generates 500 personalized letters in under 5 seconds!</text>
  </g>

</svg>