<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="380" viewBox="0 0 800 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="380" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="380" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Table Design & Cell Management - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="338" fill="#F8FAFC"/>

  <!-- Table Component Simulation -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="720" height="280" rx="8" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#cardShadow)"/>
    
    <!-- Table Header Toolbar -->
    <rect x="0" y="0" width="720" height="36" rx="8" fill="#F1F5F9"/>
    <text x="20" y="23" font-size="12" font-weight="bold" fill="#1E40AF">Table Tools &gt; Layout &amp; Design</text>
    <rect x="220" y="6" width="90" height="24" rx="4" fill="#185ABD"/>
    <text x="265" y="22" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">+ Insert Row</text>

    <rect x="320" y="6" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="22" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Merge Cells</text>

    <rect x="420" y="6" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="465" y="22" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">Split Cells</text>

    <rect x="520" y="6" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="565" y="22" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">fx Formula</text>

    <!-- Table Grid -->
    <g transform="translate(20, 50)">
      <!-- Row 1: Header -->
      <rect x="0" y="0" width="680" height="36" fill="#185ABD"/>
      <text x="20" y="23" font-size="12" font-weight="bold" fill="#FFFFFF">Item ID</text>
      <text x="140" y="23" font-size="12" font-weight="bold" fill="#FFFFFF">Description</text>
      <text x="360" y="23" font-size="12" font-weight="bold" fill="#FFFFFF">Category</text>
      <text x="490" y="23" font-size="12" font-weight="bold" fill="#FFFFFF">Quantity</text>
      <text x="600" y="23" font-size="12" font-weight="bold" fill="#FFFFFF">Unit Price</text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="680" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="70" x2="680" y2="70" stroke="#E2E8F0"/>
      <text x="20" y="58" font-size="11" fill="#334155">#101</text>
      <text x="140" y="58" font-size="11" fill="#334155">Executive Laptop Stand</text>
      <text x="360" y="58" font-size="11" fill="#64748B">Hardware</text>
      <text x="500" y="58" font-size="11" fill="#334155">15</text>
      <text x="600" y="58" font-size="11" font-weight="bold" fill="#0F172A">₹1,250</text>

      <!-- Row 3 (Banded) -->
      <rect x="0" y="70" width="680" height="34" fill="#EFF6FF"/>
      <line x1="0" y1="104" x2="680" y2="104" stroke="#E2E8F0"/>
      <text x="20" y="92" font-size="11" fill="#334155">#102</text>
      <text x="140" y="92" font-size="11" fill="#334155">Wireless Ergonomic Mouse</text>
      <text x="360" y="92" font-size="11" fill="#64748B">Accessories</text>
      <text x="500" y="92" font-size="11" fill="#334155">30</text>
      <text x="600" y="92" font-size="11" font-weight="bold" fill="#0F172A">₹850</text>

      <!-- Row 4 -->
      <rect x="0" y="104" width="680" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="138" x2="680" y2="138" stroke="#E2E8F0"/>
      <text x="20" y="126" font-size="11" fill="#334155">#103</text>
      <text x="140" y="126" font-size="11" fill="#334155">Mechanical Keyboard</text>
      <text x="360" y="126" font-size="11" fill="#64748B">Peripherals</text>
      <text x="500" y="126" font-size="11" fill="#334155">20</text>
      <text x="600" y="126" font-size="11" font-weight="bold" fill="#0F172A">₹2,400</text>

      <!-- Row 5: Merged Total Row -->
      <rect x="0" y="138" width="680" height="38" fill="#DBEAFE"/>
      <text x="140" y="162" font-size="12" font-weight="bold" fill="#1E40AF">Total Calculated via =SUM(ABOVE) Formula</text>
      <text x="500" y="162" font-size="12" font-weight="bold" fill="#1E40AF">65</text>
      <text x="600" y="162" font-size="13" font-weight="900" fill="#1E40AF">₹4,500</text>
    </g>

    <!-- Table Tip footer -->
    <text x="20" y="260" font-size="11" fill="#64748B">💡 <tspan font-weight="bold">Pro Tip:</tspan> Press <tspan font-weight="bold" fill="#185ABD">Tab</tspan> in the very last cell to automatically create a new row!</text>
  </g>

</svg>