<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="900" height="500" rx="16" fill="url(#vizBg)" />
  <rect x="2" y="2" width="896" height="496" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui" font-size="22" font-weight="800" text-anchor="middle">
    MATPLOTLIB OBJECT-ORIENTED ARCHITECTURE: FIGURE VS AXES
  </text>
  <text x="450" y="70" fill="#94a3b8" font-family="system-ui" font-size="13" text-anchor="middle">
    fig, ax = plt.subplots(figsize=(10, 6)) — The Canvas, Coordinate Plane, and Artists
  </text>
  <g transform="translate(60, 95)">
    <!-- Outer Canvas: Figure -->
    <rect width="780" height="360" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
    <text x="25" y="30" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700">Figure (The Top-Level Canvas Window / Bounding Box)</text>
    <!-- Inner Coordinate System: Axes -->
    <rect x="80" y="55" width="620" height="260" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="100" y="85" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">Axes (The Plot Area where data is drawn)</text>
    <!-- Grid & Plot line -->
    <line x1="120" y1="280" x2="660" y2="280" stroke="#475569" stroke-width="2" />
    <line x1="120" y1="110" x2="120" y2="280" stroke="#475569" stroke-width="2" />
    <!-- Title -->
    <text x="390" y="115" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">ax.set_title('Q4 Sales Growth')</text>
    <!-- Data Curve -->
    <path d="M 120 250 Q 250 220 380 180 T 650 130" fill="none" stroke="#10b981" stroke-width="3.5" />
    <!-- Points -->
    <circle cx="120" cy="250" r="5" fill="#34d399" />
    <circle cx="280" cy="210" r="5" fill="#34d399" />
    <circle cx="450" cy="165" r="5" fill="#34d399" />
    <circle cx="650" cy="130" r="5" fill="#34d399" />
    <!-- Annotations -->
    <text x="65" y="195" fill="#94a3b8" font-family="system-ui" font-size="11" transform="rotate(-90 65 195)" text-anchor="middle">ax.set_ylabel('Revenue in INR')</text>
    <text x="390" y="305" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">ax.set_xlabel('Fiscal Quarter / Month')</text>
    <!-- Legend -->
    <rect x="520" y="150" width="150" height="45" rx="6" fill="#1e293b" stroke="#334155" />
    <line x1="535" y1="172" x2="565" y2="172" stroke="#10b981" stroke-width="2.5" />
    <text x="575" y="176" fill="#cbd5e1" font-family="system-ui" font-size="11">Online Store</text>
  </g>
</svg>