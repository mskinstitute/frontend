<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24726"/>
      <stop offset="100%" stop-color="#A23218"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="slideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#pptOrange)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- PowerPoint Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#8F2510"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">P</text>

  <!-- Presentation Title & Search -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Audio, Video & Media Formatting - Microsoft PowerPoint</text>

  <!-- Quick Save / Undo icons placeholder -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Top Banner -->
  <rect x="0" y="38" width="800" height="40" fill="#F1F5F9"/>
  <line x1="0" y1="78" x2="800" y2="78" stroke="#E2E8F0"/>
  <text x="24" y="63" fill="#0F172A" font-size="13" font-weight="bold">Insert &gt; Media (Video, Audio, Screen Recording)</text>

  <!-- Left: Video Embed & Playback Controls -->
  <rect x="30" y="95" width="410" height="260" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <rect x="30" y="95" width="410" height="200" rx="8" fill="#1E293B"/>
  <!-- Video screen content -->
  <circle cx="235" cy="195" r="30" fill="#D24726"/>
  <polygon points="230,183 248,195 230,207" fill="#FFFFFF"/>
  <text x="235" y="245" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Product_Demo_2026.mp4</text>

  <!-- Video Playback Bar -->
  <rect x="30" y="295" width="410" height="60" rx="0 0 8 8" fill="#0F172A"/>
  <circle cx="55" cy="325" r="12" fill="#D24726"/>
  <polygon points="52,320 60,325 52,330" fill="#FFFFFF"/>
  <line x1="80" y1="325" x2="350" y2="325" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="325" x2="190" y2="325" stroke="#D24726" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="325" r="6" fill="#FFFFFF"/>
  <text x="365" y="329" fill="#94A3B8" font-size="11">01:45 / 04:30</text>

  <!-- Right: Video Tools & Audio Settings -->
  <rect x="460" y="95" width="310" height="260" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="475" y="122" fill="#0F172A" font-size="13" font-weight="bold">Playback Settings</text>

  <rect x="475" y="136" width="280" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="485" y="156" fill="#334155" font-size="11">Start: Automatically / When Clicked</text>

  <rect x="475" y="176" width="280" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="485" y="196" fill="#334155" font-size="11">Trim Video (Start &amp; End Cut markers)</text>

  <rect x="475" y="216" width="280" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="485" y="236" fill="#334155" font-size="11">Play Full Screen [✓]  Loop until Stopped [✓]</text>

  <!-- Audio Icon Badge -->
  <g transform="translate(475, 260)">
    <rect width="280" height="80" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <circle cx="30" cy="40" r="18" fill="#2563EB"/>
    <text x="30" y="45" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">🔊</text>
    <text x="60" y="32" fill="#1E3A8A" font-size="11" font-weight="bold">Background Music &amp; Voiceover</text>
    <text x="60" y="50" fill="#1D4ED8" font-size="10">"Play in Background": Loops across all slides seamlessly.</text>
    <text x="60" y="66" fill="#1E40AF" font-size="10">Fade In / Fade Out: Smooth audio transitions.</text>
  </g>

  <!-- Bottom Panel: Screen Recording -->
  <rect x="30" y="370" width="740" height="85" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="58" cy="412" r="16" fill="#DC2626"/>
  <circle cx="58" cy="412" r="7" fill="#FFFFFF"/>
  <text x="86" y="405" fill="#991B1B" font-size="12" font-weight="bold">PowerPoint Built-in Screen Recorder (Insert &gt; Screen Recording)</text>
  <text x="86" y="424" fill="#B91C1C" font-size="11">Record screen area, microphone audio, and mouse pointer directly into PowerPoint without third-party software!</text>
  <text x="86" y="442" fill="#7F1D1D" font-size="10">Shortcut to stop screen recording: Windows logo key + Shift + Q</text>

</svg>
