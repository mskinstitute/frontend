<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Anatomy of a World-Class GitHub README.md</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Structure and elements of high-impact open-source documentation</text>

  <!-- GitHub Repo Window Frame -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="800" height="390" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Header -->
    <rect x="0" y="0" width="800" height="36" rx="10" fill="#0f172a" />
    <text x="20" y="23" fill="#ffffff" font-size="12" font-weight="bold">📘 username / awesome-project / README.md</text>

    <!-- Content Sections inside README -->
    <g transform="translate(20, 50)">
      <!-- 1. Hero Title & Badges -->
      <rect x="0" y="0" width="760" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" fill="#38bdf8" font-size="16" font-weight="bold"># 🚀 AwesomeProject: Fast, Modern REST API</text>
      <g transform="translate(15, 34)">
        <rect x="0" y="0" width="80" height="18" rx="3" fill="#22c55e" />
        <text x="40" y="13" fill="#fff" font-size="9" text-anchor="middle">build: passing</text>
        <rect x="88" y="0" width="80" height="18" rx="3" fill="#3b82f6" />
        <text x="128" y="13" fill="#fff" font-size="9" text-anchor="middle">npm: v2.4.0</text>
        <rect x="176" y="0" width="75" height="18" rx="3" fill="#eab308" />
        <text x="213" y="13" fill="#000" font-size="9" text-anchor="middle">license: MIT</text>
        <rect x="258" y="0" width="80" height="18" rx="3" fill="#ec4899" />
        <text x="298" y="13" fill="#fff" font-size="9" text-anchor="middle">stars: 1.2k</text>
      </g>

      <!-- 2. Two Columns: Features & Quickstart -->
      <g transform="translate(0, 75)">
        <!-- Features Column -->
        <rect x="0" y="0" width="370" height="145" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" fill="#a855f7" font-size="13" font-weight="bold">## ✨ Key Features</text>
        <text x="15" y="44" fill="#cbd5e1" font-size="11">• ⚡ Zero dependencies &amp; lightweight (&lt;5KB)</text>
        <text x="15" y="66" fill="#cbd5e1" font-size="11">• 🔒 End-to-end type safety with TypeScript</text>
        <text x="15" y="88" fill="#cbd5e1" font-size="11">• 📊 Built-in Mermaid architecture diagrams</text>
        <text x="15" y="110" fill="#cbd5e1" font-size="11">• 🌐 100% test coverage with Vitest</text>
        <text x="15" y="130" fill="#cbd5e1" font-size="11">• 📱 Cross-platform support (Node, Deno, Bun)</text>

        <!-- Quickstart Column -->
        <g transform="translate(390, 0)">
          <rect x="0" y="0" width="370" height="145" rx="6" fill="#0f172a" stroke="#334155" />
          <text x="15" y="22" fill="#10b981" font-size="13" font-weight="bold">## 📦 Installation &amp; Usage</text>
          <rect x="15" y="32" width="340" height="26" rx="4" fill="#1e293b" />
          <text x="25" y="49" fill="#38bdf8" font-size="10" font-family="monospace">npm install awesome-project</text>
          <rect x="15" y="66" width="340" height="65" rx="4" fill="#1e293b" />
          <text x="25" y="84" fill="#94a3b8" font-size="10" font-family="monospace">import { createAPI } from 'awesome';</text>
          <text x="25" y="100" fill="#34d399" font-size="10" font-family="monospace">const app = createAPI({ port: 3000 });</text>
          <text x="25" y="116" fill="#facc15" font-size="10" font-family="monospace">app.start();</text>
        </g>
      </g>

      <!-- 3. Bottom Row: Architecture & Contributing -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="760" height="90" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" fill="#f59e0b" font-size="13" font-weight="bold">## 🤝 Contributing &amp; Community</text>
        <text x="15" y="44" fill="#cbd5e1" font-size="11">1. Fork the repo &gt; 2. Create feature branch (`git checkout -b feat/new`) &gt; 3. Commit &gt; 4. Open Pull Request</text>
        <text x="15" y="68" fill="#94a3b8" font-size="11">Distributed under the <tspan fill="#38bdf8" font-weight="bold">MIT License</tspan>. See LICENSE for more information.</text>
      </g>
    </g>
  </g>
</svg>