<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="edaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="edaShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="900" height="450" rx="16" fill="url(#edaBg)" />
  <rect x="2" y="2" width="896" height="446" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    END-TO-END EXPLORATORY DATA ANALYSIS (EDA) PIPELINE
  </text>
  <text x="450" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    From Raw Dirty Files to Actionable Business Intelligence &amp; Modeling Ready Data
  </text>

  <!-- 5 PIPELINE STAGES -->
  <!-- Stage 1 -->
  <g transform="translate(30, 110)" filter="url(#edaShadow)">
    <rect width="150" height="290" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect width="150" height="40" rx="10" fill="#334155" />
    <text x="75" y="25" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">1. INGESTION</text>
    <text x="15" y="65" fill="#38bdf8" font-family="monospace" font-size="11 font-weight="700">read_csv()</text>
    <text x="15" y="85" fill="#38bdf8" font-family="monospace" font-size="11">read_excel()</text>
    <text x="15" y="105" fill="#38bdf8" font-family="monospace" font-size="11">read_sql()</text>
    <line x1="15" y1="125" x2="135" y2="125" stroke="#334155" />
    <text x="15" y="148" fill="#94a3b8" font-family="system-ui" font-size="10">• Auto encoding</text>
    <text x="15" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">• Memory chunking</text>
    <text x="15" y="188" fill="#94a3b8" font-family="system-ui" font-size="10">• Parse dates</text>
    <text x="15" y="208" fill="#94a3b8" font-family="system-ui" font-size="10">• Schema check</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(205, 110)" filter="url(#edaShadow)">
    <rect width="150" height="290" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="150" height="40" rx="10" fill="#2563eb" />
    <text x="75" y="25" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">2. INSPECT</text>
    <text x="15" y="65" fill="#60a5fa" font-family="monospace" font-size="11 font-weight="700">df.info()</text>
    <text x="15" y="85" fill="#60a5fa" font-family="monospace" font-size="11">df.describe()</text>
    <text x="15" y="105" fill="#60a5fa" font-family="monospace" font-size="11">df.shape</text>
    <line x1="15" y1="125" x2="135" y2="125" stroke="#334155" />
    <text x="15" y="148" fill="#94a3b8" font-family="system-ui" font-size="10">• Column dtypes</text>
    <text x="15" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">• Null counts</text>
    <text x="15" y="188" fill="#94a3b8" font-family="system-ui" font-size="10">• 5-point summary</text>
    <text x="15" y="208" fill="#94a3b8" font-family="system-ui" font-size="10">• Outlier checks</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(380, 110)" filter="url(#edaShadow)">
    <rect width="150" height="290" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="150" height="40" rx="10" fill="#d97706" />
    <text x="75" y="25" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">3. CLEAN</text>
    <text x="15" y="65" fill="#fbbf24" font-family="monospace" font-size="11 font-weight="700">df.fillna()</text>
    <text x="15" y="85" fill="#fbbf24" font-family="monospace" font-size="11">drop_duplicates()</text>
    <text x="15" y="105" fill="#fbbf24" font-family="monospace" font-size="11">.astype()</text>
    <line x1="15" y1="125" x2="135" y2="125" stroke="#334155" />
    <text x="15" y="148" fill="#94a3b8" font-family="system-ui" font-size="10">• Impute NaN</text>
    <text x="15" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">• Strip strings</text>
    <text x="15" y="188" fill="#94a3b8" font-family="system-ui" font-size="10">• Type conversion</text>
    <text x="15" y="208" fill="#94a3b8" font-family="system-ui" font-size="10">• Filter outliers</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(555, 110)" filter="url(#edaShadow)">
    <rect width="150" height="290" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="150" height="40" rx="10" fill="#059669" />
    <text x="75" y="25" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">4. TRANSFORM</text>
    <text x="15" y="65" fill="#34d399" font-family="monospace" font-size="11 font-weight="700">df.groupby()</text>
    <text x="15" y="85" fill="#34d399" font-family="monospace" font-size="11">pivot_table()</text>
    <text x="15" y="105" fill="#34d399" font-family="monospace" font-size="11">pd.merge()</text>
    <line x1="15" y1="125" x2="135" y2="125" stroke="#334155" />
    <text x="15" y="148" fill="#94a3b8" font-family="system-ui" font-size="10">• Feature creation</text>
    <text x="15" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">• Category encoding</text>
    <text x="15" y="188" fill="#94a3b8" font-family="system-ui" font-size="10">• Datetime metrics</text>
    <text x="15" y="208" fill="#94a3b8" font-family="system-ui" font-size="10">• Multi-index slices</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(730, 110)" filter="url(#edaShadow)">
    <rect width="140" height="290" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <rect width="140" height="40" rx="10" fill="#db2777" />
    <text x="70" y="25" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">5. INSIGHTS</text>
    <text x="15" y="65" fill="#f472b6" font-family="monospace" font-size="11 font-weight="700">df.plot()</text>
    <text x="15" y="85" fill="#f472b6" font-family="monospace" font-size="11">corr() heatmap</text>
    <text x="15" y="105" fill="#f472b6" font-family="monospace" font-size="11">BI Export</text>
    <line x1="15" y1="125" x2="125" y2="125" stroke="#334155" />
    <text x="15" y="148" fill="#94a3b8" font-family="system-ui" font-size="10">• KPI discovery</text>
    <text x="15" y="168" fill="#94a3b8" font-family="system-ui" font-size="10">• Risk identification</text>
    <text x="15" y="188" fill="#94a3b8" font-family="system-ui" font-size="10">• Trend forecasting</text>
    <text x="15" y="208" fill="#94a3b8" font-family="system-ui" font-size="10">• Executive report</text>
  </g>
</svg>