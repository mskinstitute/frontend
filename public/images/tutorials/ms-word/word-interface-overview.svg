    <line x1="150" y1="4" x2="150" y2="76" stroke="#E2E8F0"/>
    <text x="75" y="80" font-size="10" fill="#64748B" font-weight="600" text-anchor="middle">Clipboard</text>
  </g>

  <!-- Group 2: Font -->
  <g transform="translate(170, 80)">
    <rect x="0" y="4" width="95" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="6" y="19" font-size="11" fill="#1E293B">Calibri</text>
    <text x="82" y="19" font-size="9" fill="#64748B">▼</text>
    
    <rect x="100" y="4" width="36" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="108" y="19" font-size="11" fill="#1E293B">11</text>
    <text x="126" y="19" font-size="8" fill="#64748B">▼</text>

