    <rect x="24" y="6" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="27" y="20" font-size="10">1≡</text>
    <rect x="48" y="6" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="51" y="20" font-size="11">⇤</text>
    <rect x="72" y="6" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="75" y="20" font-size="11">⇥</text>

    <rect x="0" y="34" width="20" height="20" rx="3" fill="#E2E8F0"/>
    <text x="3" y="48" font-size="11">⫷</text>
    <rect x="24" y="34" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="27" y="48" font-size="11">≡</text>
    <rect x="48" y="34" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="51" y="48" font-size="11">⫸</text>
    <rect x="72" y="34" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="75" y="48" font-size="11">≣</text>

    <line x1="120" y1="4" x2="120" y2="76" stroke="#E2E8F0"/>
    <text x="60" y="80" font-size="10" fill="#64748B" font-weight="600" text-anchor="middle">Paragraph</text>
  </g>

  <!-- Group 4: Styles Gallery -->
  <g transform="translate(460, 80)">
    <rect x="5" y="8" width="55" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="32" y="28" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">AaBb</text>
    <text x="32" y="46" font-size="9" fill="#64748B" text-anchor="middle">Normal</text>

    <rect x="65" y="8" width="55" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="92" y="28" font-size="13" font-weight="bold" fill="#185ABD" text-anchor="middle">AaBb</text>
    <text x="92" y="46" font-size="9" fill="#64748B" text-anchor="middle">Heading 1</text>

    <rect x="125" y="8" width="55" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="152" y="28" font-size="13" font-weight="bold" fill="#0284C7" text-anchor="middle">AaBb</text>
    <text x="152" y="46" font-size="9" fill="#64748B" text-anchor="middle">Heading 2</text>

    <line x1="195" y1="4" x2="195" y2="76" stroke="#E2E8F0"/>
    <text x="100" y="80" font-size="10" fill="#64748B" font-weight="600" text-anchor="middle">Styles</text>
  </g>

  <!-- Group 5: Editing -->
  <g transform="translate(665, 80)">
    <text x="10" y="22" font-size="11" fill="#334155">🔍 Find</text>
    <text x="10" y="44" font-size="11" fill="#334155">⇄ Replace</text>
    <text x="10" y="64" font-size="11" fill="#334155">↖ Select</text>
    <text x="50" y="80" font-size="10" fill="#64748B" font-weight="600" text-anchor="middle">Editing</text>
  </g>

  <!-- Workspace Canvas -->
  <rect x="0" y="166" width="800" height="286" fill="#EEF2F6"/>

  <!-- Ruler -->
  <rect x="150" y="166" width="500" height="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.5"/>
  <line x1="160" y1="184" x2="160" y2="176" stroke="#94A3B8"/>
  <line x1="210" y1="184" x2="210" y2="172" stroke="#64748B"/>
  <text x="208" y="174" font-size="8" fill="#64748B">1</text>
  <line x1="260" y1="184" x2="260" y2="172" stroke="#64748B"/>
  <text x="258" y="174" font-size="8" fill="#64748B">2</text>
  <line x1="310" y1="184" x2="310" y2="172" stroke="#64748B"/>
  <text x="308" y="174" font-size="8" fill="#64748B">3</text>
  <line x1="360" y1="184" x2="360" y2="172" stroke="#64748B"/>
  <text x="358" y="174" font-size="8" fill="#64748B">4</text>
  <line x1="410" y1="184" x2="410" y2="172" stroke="#64748B"/>
  <text x="408" y="174" font-size="8" fill="#64748B">5</text>
  <line x1="460" y1="184" x2="460" y2="172" stroke="#64748B"/>
  <text x="458" y="174" font-size="8" fill="#64748B">6</text>

  <!-- White Document Page -->
  <rect x="150" y="188" width="500" height="260" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Document Page Mock Text -->
  <text x="185" y="222" font-size="18" font-weight="bold" fill="#185ABD">Mastering Microsoft Word: Professional Guide</text>
  <rect x="185" y="234" width="430" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="185" y="246" width="390" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="185" y="258" width="410" height="4" rx="2" fill="#E2E8F0"/>

  <text x="185" y="285" font-size="13" font-weight="bold" fill="#0F172A">1. Understanding the Modern Ribbon Interface</text>
  <rect x="185" y="296" width="420" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="185" y="306" width="370" height="4" rx="2" fill="#E2E8F0"/>

  <!-- Callout boxes with arrows on UI elements -->
  <rect x="20" y="185" width="115" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="28" y="202" font-size="10" font-weight="bold" fill="#92400E">Quick Access Toolbar</text>
  <text x="28" y="217" font-size="9" fill="#78350F">Save (Ctrl+S), Undo,</text>
  <text x="28" y="229" font-size="9" fill="#78350F">Redo shortcuts</text>

  <rect x="665" y="200" width="120" height="60" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="673" y="218" font-size="10" font-weight="bold" fill="#1E40AF">The Ribbon</text>
  <text x="673" y="233" font-size="9" fill="#1E3A8A">Tabs organize related</text>
  <text x="673" y="245" font-size="9" fill="#1E3A8A">commands into logical</text>
  <text x="673" y="255" font-size="9" fill="#1E3A8A">functional groups.</text>

  <!-- Status Bar -->
  <rect x="0" y="452" width="800" height="28" fill="#185ABD"/>
  <text x="20" y="470" fill="#FFFFFF" font-size="11" font-weight="500">Page 1 of 1</text>
  <text x="110" y="470" fill="#FFFFFF" font-size="11" font-weight="500">342 words</text>
  <text x="200" y="470" fill="#FFFFFF" font-size="11" font-weight="500">English (United States)</text>
  <text x="670" y="470" fill="#FFFFFF" font-size="11" font-weight="500">100%</text>
  <text x="720" y="470" fill="#FFFFFF" font-size="11">🔍 ───○───</text>

</svg>