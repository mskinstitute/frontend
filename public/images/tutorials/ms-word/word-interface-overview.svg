    <rect x="0" y="34" width="22" height="22" rx="3" fill="#E2E8F0"/>
    <text x="7" y="49" font-size="12" font-weight="bold" fill="#0F172A">B</text>

    <rect x="25" y="34" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="33" y="49" font-size="12" font-style="italic" font-weight="bold" fill="#334155">I</text>

    <rect x="50" y="34" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="57" y="49" font-size="12" font-weight="bold" text-decoration="underline" fill="#334155">U</text>

    <rect x="75" y="34" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="80" y="49" font-size="11" fill="#DC2626" font-weight="bold">A<tspan font-size="8" fill="#DC2626">▼</tspan></text>

    <rect x="100" y="34" width="22" height="22" rx="3" fill="#FEF08A"/>
    <text x="104" y="49" font-size="11" fill="#854D0E">🖍️</text>

