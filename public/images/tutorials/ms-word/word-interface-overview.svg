<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="500" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="480" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Document1 [Compatibility Mode] - Microsoft Word</text>

  
  <!-- Ribbon Tabs Bar -->
  <rect x="0" y="42" width="800" height="32" fill="#EAEFF5" border-bottom="1px solid #D1D5DB"/>
  <line x1="0" y1="74" x2="800" y2="74" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Tabs -->
  <rect x="10" y="46" width="48" height="28" rx="4" fill="#185ABD"/>
  <text x="34" y="65" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">File</text>

  <rect x="64" y="46" width="56" height="28" rx="4" fill="#FFFFFF"/>
  <text x="92" y="65" fill="#185ABD" font-size="12" font-weight="bold" text-anchor="middle">Home</text>
  <line x1="68" y1="73" x2="116" y2="73" stroke="#185ABD" stroke-width="2.5"/>

  <text x="144" y="65" fill="#475569" font-size="12" font-weight="500">Insert</text>
  <text x="195" y="65" fill="#475569" font-size="12" font-weight="500">Draw</text>
  <text x="242" y="65" fill="#475569" font-size="12" font-weight="500">Design</text>
  <text x="296" y="65" fill="#475569" font-size="12" font-weight="500">Layout</text>
  <text x="354" y="65" fill="#475569" font-size="12" font-weight="500">References</text>
  <text x="432" y="65" fill="#475569" font-size="12" font-weight="500">Mailings</text>
  <text x="496" y="65" fill="#475569" font-size="12" font-weight="500">Review</text>
  <text x="552" y="65" fill="#475569" font-size="12" font-weight="500">View</text>
  <text x="600" y="65" fill="#475569" font-size="12" font-weight="500">Help</text>

  <!-- Ribbon Command Bar -->
  <rect x="0" y="74" width="800" height="92" fill="#F8FAFC"/>
  <line x1="0" y1="166" x2="800" y2="166" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Group 1: Clipboard -->
  <g transform="translate(10, 80)">
    <rect x="5" y="5" width="34" height="42" rx="4" fill="#E2E8F0"/>
    <text x="22" y="32" font-size="18" text-anchor="middle">📋</text>
    <text x="22" y="58" font-size="10" fill="#334155" text-anchor="middle">Paste</text>
    <text x="56" y="20" font-size="11" fill="#334155">✂️ Cut</text>
    <text x="56" y="40" font-size="11" fill="#334155">📄 Copy</text>
