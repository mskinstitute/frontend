<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="360" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="360" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Formula Dialog Box in Word Tables - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="318" fill="#EEF2F6"/>

  <!-- Modal Dialog -->
  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="440" height="280" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Modal Title -->
    <rect x="0" y="0" width="440" height="32" rx="8" fill="#F1F5F9"/>
    <text x="15" y="21" font-size="12" font-weight="bold" fill="#0F172A">Formula</text>
    <text x="420" y="20" font-size="12" fill="#64748B">✕</text>

    <!-- Input 1: Formula -->
    <text x="25" y="60" font-size="11" font-weight="bold" fill="#334155">Formula:</text>
    <rect x="25" y="68" width="390" height="28" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="35" y="86" font-size="12" font-family="monospace" font-weight="bold" fill="#1D4ED8">=SUM(ABOVE)</text>

    <!-- Input 2: Number Format -->
    <text x="25" y="118" font-size="11" font-weight="bold" fill="#334155">Number format:</text>
    <rect x="25" y="126" width="390" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="35" y="144" font-size="12" fill="#334155">₹#,##0.00;(₹#,##0.00)</text>
    <text x="395" y="144" font-size="9" fill="#64748B">▼</text>

    <!-- Input 3: Paste function -->
    <text x="25" y="176" font-size="11" font-weight="bold" fill="#334155">Paste function:</text>
    <rect x="25" y="184" width="390" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="35" y="202" font-size="12" fill="#64748B">SUM, AVERAGE, COUNT, MAX, MIN, IF...</text>
    <text x="395" y="202" font-size="9" fill="#64748B">▼</text>

    <!-- Buttons -->
    <rect x="235" y="235" width="85" height="28" rx="4" fill="#185ABD"/>
    <text x="277" y="253" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">OK</text>

    <rect x="330" y="235" width="85" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="372" y="253" font-size="12" fill="#334155" text-anchor="middle">Cancel</text>
  </g>

</svg>