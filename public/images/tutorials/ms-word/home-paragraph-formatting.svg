<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="360" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="360" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Home Tab: Paragraph Alignment & Spacing - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="318" fill="#F8FAFC"/>

  <!-- Visual Alignment Demonstration -->
  <g transform="translate(30, 65)">
    <!-- Align Left -->
    <rect x="0" y="0" width="170" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#EFF6FF"/>
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#1D4ED8">Align Left (Ctrl+L)</text>
    <line x1="15" y1="50" x2="155" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="135" y2="65" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="80" x2="148" y2="80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="95" x2="105" y2="95" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="135" font-size="10" fill="#64748B">Standard for body text &amp; English letters.</text>
  </g>

  <g transform="translate(220, 65)">
    <!-- Center -->
    <rect x="0" y="0" width="170" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#F0FDF4"/>
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#15803D">Center (Ctrl+E)</text>
    <line x1="25" y1="50" x2="145" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="65" x2="130" y2="65" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="80" x2="140" y2="80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="95" x2="115" y2="95" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="135" font-size="10" fill="#64748B">Used for Headings, Titles &amp; Certificates.</text>
  </g>

  <g transform="translate(410, 65)">
    <!-- Align Right -->
    <rect x="0" y="0" width="170" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#FFF7ED"/>
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#C2410C">Align Right (Ctrl+R)</text>
    <line x1="15" y1="50" x2="155" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="65" x2="155" y2="65" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="80" x2="155" y2="80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="95" x2="155" y2="95" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="135" font-size="10" fill="#64748B">Used for Dates, Signatures &amp; Headers.</text>
  </g>

  <g transform="translate(600, 65)">
    <!-- Justify -->
    <rect x="0" y="0" width="170" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#FAF5FF"/>
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#7E22CE">Justify (Ctrl+J)</text>
    <line x1="15" y1="50" x2="155" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="155" y2="65" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="80" x2="155" y2="80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="95" x2="95" y2="95" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="135" font-size="10" fill="#64748B">Clean straight edges for books &amp; reports.</text>
  </g>

  <!-- Spacing & Indents Bar -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="740" height="95" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="25" font-size="13" font-weight="bold" fill="#0F172A">Line &amp; Paragraph Spacing Guide:</text>
    
    <text x="20" y="55" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + 1</tspan> : Single Spacing (1.0)</text>
    <text x="20" y="78" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + 2</tspan> : Double Spacing (2.0)</text>
    
    <text x="260" y="55" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + 5</tspan> : 1.5 Line Spacing</text>
    <text x="260" y="78" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + 0</tspan> : Add/Remove 12pt Space Before</text>

    <text x="500" y="55" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + M</tspan> : Increase Indent 0.5"</text>
    <text x="500" y="78" font-size="11" fill="#334155">• <tspan font-weight="bold">Ctrl + Shift + M</tspan> : Decrease Indent</text>
  </g>

</svg>