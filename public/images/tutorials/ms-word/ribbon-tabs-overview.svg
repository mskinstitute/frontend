<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="360" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="360" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Ribbon Architecture Breakdown - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="318" fill="#F8FAFC"/>
  
  <!-- Visual Tabs Header -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="740" height="42" rx="8" fill="#E2E8F0"/>
    <rect x="5" y="4" width="70" height="34" rx="6" fill="#185ABD"/>
    <text x="40" y="26" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Home</text>

    <rect x="80" y="4" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="115" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">Insert</text>

    <rect x="155" y="4" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="190" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">Layout</text>

    <rect x="230" y="4" width="90" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="275" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">References</text>

    <rect x="325" y="4" width="85" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="367" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">Mailings</text>

    <rect x="415" y="4" width="75" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="452" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">Review</text>

    <rect x="495" y="4" width="65" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="527" y="26" fill="#1E293B" font-size="13" font-weight="bold" text-anchor="middle">View</text>
  </g>

  <!-- 3 Pillar Breakdown Cards -->
  <g transform="translate(30, 120)">
    <!-- Card 1: Tabs -->
    <rect x="0" y="0" width="230" height="210" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="38" rx="10" fill="#EFF6FF"/>
    <text x="15" y="24" font-size="14" font-weight="bold" fill="#1E40AF">1. Ribbon Tabs</text>
    <text x="15" y="65" font-size="12" fill="#334155" font-weight="600">• Top-level categories</text>
    <text x="15" y="85" font-size="11" fill="#64748B">Organizes commands by major</text>
    <text x="15" y="100" font-size="11" fill="#64748B">authoring phases (e.g. Home,</text>
    <text x="15" y="115" font-size="11" fill="#64748B">Insert, Layout, Mailings).</text>
    <rect x="15" y="140" width="200" height="48" rx="6" fill="#F1F5F9"/>
    <text x="25" y="160" font-size="11" font-weight="bold" fill="#0F172A">Shortcut Tip:</text>
    <text x="25" y="176" font-size="10" fill="#475569">Press <tspan font-weight="bold" fill="#185ABD">Alt</tspan> to reveal KeyTips!</text>
  </g>

  <g transform="translate(285, 120)">
    <!-- Card 2: Groups -->
    <rect x="0" y="0" width="230" height="210" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="38" rx="10" fill="#F0FDF4"/>
    <text x="15" y="24" font-size="14" font-weight="bold" fill="#166534">2. Command Groups</text>
    <text x="15" y="65" font-size="12" fill="#334155" font-weight="600">• Clustered functions</text>
    <text x="15" y="85" font-size="11" fill="#64748B">Related tool buttons grouped</text>
    <text x="15" y="100" font-size="11" fill="#64748B">together with labels like</text>
    <text x="15" y="115" font-size="11" fill="#64748B">Font, Paragraph, &amp; Styles.</text>
    <rect x="15" y="140" width="200" height="48" rx="6" fill="#F1F5F9"/>
    <text x="25" y="160" font-size="11" font-weight="bold" fill="#0F172A">Dialog Launcher:</text>
    <text x="25" y="176" font-size="10" fill="#475569">Click ↘ button for full dialog.</text>
  </g>

  <g transform="translate(540, 120)">
    <!-- Card 3: Quick Access Toolbar -->
    <rect x="0" y="0" width="230" height="210" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="38" rx="10" fill="#FFF7ED"/>
    <text x="15" y="24" font-size="14" font-weight="bold" fill="#9A3412">3. Quick Access (QAT)</text>
    <text x="15" y="65" font-size="12" fill="#334155" font-weight="600">• Always accessible</text>
    <text x="15" y="85" font-size="11" fill="#64748B">Customizable toolbar at the top</text>
    <text x="15" y="100" font-size="11" fill="#64748B">for 1-click access to Save,</text>
    <text x="15" y="115" font-size="11" fill="#64748B">Undo, Redo, and Print.</text>
    <rect x="15" y="140" width="200" height="48" rx="6" fill="#F1F5F9"/>
    <text x="25" y="160" font-size="11" font-weight="bold" fill="#0F172A">Customization:</text>
    <text x="25" y="176" font-size="10" fill="#475569">Right-click any tool &gt; Add to QAT</text>
  </g>

</svg>