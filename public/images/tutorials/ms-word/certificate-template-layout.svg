<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#103F91"/>
    </linearGradient>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="820" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="420" rx="12" fill="#FFFFFF"/>
  <rect width="800" height="420" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 788 0 C 794.627 0 800 5.373 800 12 L 800 42 L 0 42 Z" fill="url(#wordBlue)"/>
  
  <!-- Window Controls & Title -->
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Word App Icon Badge -->
  <rect x="76" y="10" width="22" height="22" rx="4" fill="#0C3B78"/>
  <text x="87" y="26" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">W</text>

  <!-- Document Title -->
  <text x="400" y="26" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Mini-Project: Professional Certificate of Completion - Microsoft Word</text>

  
  <rect x="0" y="42" width="800" height="378" fill="#EEF2F6"/>

  <g transform="translate(80, 60)">
    <!-- Certificate Sheet (Landscape) -->
    <rect x="0" y="0" width="640" height="340" fill="#FFFFFE" stroke="#D1D5DB" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Double Gold / Navy Border -->
    <rect x="12" y="12" width="616" height="316" fill="none" stroke="#D97706" stroke-width="3"/>
    <rect x="18" y="18" width="604" height="304" fill="none" stroke="#185ABD" stroke-width="1.5"/>

    <!-- Certificate Title -->
    <text x="320" y="65" font-size="13" font-weight="900" fill="#92400E" text-anchor="middle" letter-spacing="3">MSK INSTITUTE OF COMPUTER TECHNOLOGY</text>
    <text x="320" y="100" font-size="24" font-weight="bold" fill="#185ABD" text-anchor="middle">CERTIFICATE OF EXCELLENCE</text>
    <text x="320" y="125" font-size="11" fill="#64748B" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>

    <!-- Student Name -->
    <text x="320" y="165" font-size="26" font-style="italic" font-weight="bold" fill="#0F172A" text-anchor="middle">Rohit Sharma</text>
    <line x1="160" y1="175" x2="480" y2="175" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Details -->
    <text x="320" y="202" font-size="11" fill="#334155" text-anchor="middle">For successfully completing the comprehensive professional program in</text>
    <text x="320" y="222" font-size="14" font-weight="bold" fill="#185ABD" text-anchor="middle">Advanced Microsoft Word: Automation, Mail Merge &amp; Publishing</text>

    <!-- Seal Badge -->
    <circle cx="320" cy="275" r="26" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <circle cx="320" cy="275" r="21" fill="none" stroke="#FEF3C7" stroke-dasharray="2,2"/>
    <text x="320" y="278" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SEAL OF</text>
    <text x="320" y="288" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QUALITY</text>

    <!-- Signatures -->
    <line x1="80" y1="285" x2="220" y2="285" stroke="#475569" stroke-width="1"/>
    <text x="150" y="300" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Sumit Kumar (Director)</text>

    <line x1="420" y1="285" x2="560" y2="285" stroke="#475569" stroke-width="1"/>
    <text x="490" y="300" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Academic Head</text>
  </g>

</svg>