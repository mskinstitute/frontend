<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5A2E"/>
    </linearGradient>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#excelGreen)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- Excel Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#0A4D27"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">X</text>

  <!-- Workbook Title -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Data Validation & Dropdown Menus - Microsoft Excel</text>

  <!-- AutoSave Pill -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <rect x="0" y="38" width="800" height="442" fill="#F1F5F9"/>

  <!-- Modal Dialog Window -->
  <g transform="translate(130, 60)">
    <rect width="540" height="375" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.15))"/>
    
    <!-- Modal Header -->
    <rect width="540" height="34" rx="8 8 0 0" fill="#F8FAFC"/>
    <line x1="0" y1="34" x2="540" y2="34" stroke="#E2E8F0"/>
    <text x="18" y="22" fill="#0F172A" font-size="13" font-weight="bold">Data Validation</text>
    <text x="520" y="22" fill="#64748B" font-size="14" text-anchor="end">✕</text>

    <!-- Tabs -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="75" height="26" rx="4 4 0 0" fill="#FFFFFF" stroke="#CBD5E1"/>
      <line x1="0" y1="26" x2="75" y2="26" stroke="#107C41" stroke-width="2"/>
      <text x="37" y="17" fill="#107C41" font-size="11" font-weight="bold" text-anchor="middle">Settings</text>

      <rect x="80" y="0" width="105" height="26" rx="4 4 0 0" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="132" y="17" fill="#64748B" font-size="11" text-anchor="middle">Input Message</text>

      <rect x="190" y="0" width="85" height="26" rx="4 4 0 0" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="232" y="17" fill="#64748B" font-size="11" text-anchor="middle">Error Alert</text>
    </g>

    <!-- Dialog Body: Validation Criteria -->
    <g transform="translate(25, 85)">
      <text x="0" y="15" fill="#0F172A" font-size="12" font-weight="bold">Validation criteria</text>

      <!-- Allow Dropdown -->
      <text x="0" y="42" fill="#334155" font-size="11">Allow:</text>
      <rect y="48" width="230" height="28" rx="4" fill="#FFFFFF" stroke="#107C41" stroke-width="1.5"/>
      <text x="12" y="66" fill="#0F172A" font-size="12" font-weight="bold">List</text>
      <text x="215" y="66" fill="#64748B" font-size="11" text-anchor="end">▾</text>

      <!-- Checkboxes -->
      <rect x="260" y="52" width="16" height="16" rx="2" fill="#107C41"/>
      <text x="268" y="64" fill="#FFFFFF" font-size="11" text-anchor="middle">✓</text>
      <text x="285" y="65" fill="#334155" font-size="11">Ignore blank</text>

      <rect x="260" y="82" width="16" height="16" rx="2" fill="#107C41"/>
      <text x="268" y="94" fill="#FFFFFF" font-size="11" text-anchor="middle">✓</text>
      <text x="285" y="95" fill="#334155" font-size="11">In-cell dropdown</text>

      <!-- Source input -->
      <text x="0" y="115" fill="#334155" font-size="11">Source:</text>
      <rect y="122" width="490" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="12" y="140" fill="#0F172A" font-size="12" font-family="monospace">=$G$2:$G$6  (or: Active, Pending, Closed)</text>

      <!-- Visual Preview of In-Cell Dropdown -->
      <g transform="translate(0, 165)">
        <rect width="490" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="15" y="20" fill="#0F172A" font-size="11" font-weight="bold">Worksheet In-Cell Dropdown Preview:</text>
        
        <rect x="15" y="32" width="180" height="32" rx="3" fill="#FFFFFF" stroke="#107C41" stroke-width="2"/>
        <text x="25" y="52" fill="#0F172A" font-size="12">Approved</text>
        <!-- Dropdown button on right of cell -->
        <rect x="160" y="33" width="34" height="30" rx="0 2 2 0" fill="#E2E8F0"/>
        <text x="177" y="52" fill="#334155" font-size="12" text-anchor="middle">▾</text>

        <!-- Dropdown menu popped open -->
        <g transform="translate(15, 64)">
          <rect width="180" height="75" rx="0 0 4 4" fill="#FFFFFF" stroke="#CBD5E1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
          <text x="10" y="18" fill="#334155" font-size="11">Pending Review</text>
          <rect y="24" width="180" height="22" fill="#DCFCE7"/>
          <text x="10" y="39" fill="#166534" font-size="11" font-weight="bold">Approved</text>
          <text x="10" y="60" fill="#334155" font-size="11">Rejected</text>
        </g>

        <text x="215" y="52" fill="#16A34A" font-size="11" font-weight="bold">Prevents typos &amp; invalid data entry!</text>
      </g>
    </g>

    <!-- Dialog Bottom Buttons -->
    <rect x="18" y="335" width="80" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="58" y="353" fill="#475569" font-size="11" text-anchor="middle">Clear All</text>

    <rect x="365" y="335" width="75" height="28" rx="4" fill="#107C41"/>
    <text x="402" y="353" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">OK</text>

    <rect x="450" y="335" width="75" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="487" y="353" fill="#475569" font-size="11" text-anchor="middle">Cancel</text>
  </g>

</svg>
