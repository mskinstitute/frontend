<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5A2E"/>
    </linearGradient>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#excelGreen)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- Excel Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#0A4D27"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">X</text>

  <!-- Workbook Title -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Charts & Data Visualization - Microsoft Excel</text>

  <!-- AutoSave Pill -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <rect x="0" y="38" width="800" height="38" fill="#F8FAFC"/>
  <line x1="0" y1="76" x2="800" y2="76" stroke="#CBD5E1"/>
  <text x="24" y="61" fill="#0F172A" font-size="13" font-weight="bold">Excel Chart Types: Clustered Column, Secondary Axis Combo &amp; In-Cell Sparklines</text>

  <!-- Left: Clustered Column / Combo Chart -->
  <g transform="translate(30, 90)">
    <rect width="450" height="255" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="25" fill="#0F172A" font-size="13" font-weight="bold">Revenue vs. Profit Margin % (Combo Chart)</text>

    <!-- Chart Canvas Area -->
    <g transform="translate(45, 45)">
      <!-- Y-Axis 1 (Revenue) -->
      <text x="-8" y="20" fill="#64748B" font-size="9" text-anchor="end">$60K</text>
      <text x="-8" y="65" fill="#64748B" font-size="9" text-anchor="end">$40K</text>
      <text x="-8" y="110" fill="#64748B" font-size="9" text-anchor="end">$20K</text>
      <text x="-8" y="155" fill="#64748B" font-size="9" text-anchor="end">$0</text>
      <line x1="0" y1="155" x2="330" y2="155" stroke="#CBD5E1"/>

      <!-- Y-Axis 2 (Profit Margin %) -->
      <text x="340" y="20" fill="#D97706" font-size="9">30%</text>
      <text x="340" y="65" fill="#D97706" font-size="9">20%</text>
      <text x="340" y="110" fill="#D97706" font-size="9">10%</text>
      <text x="340" y="155" fill="#D97706" font-size="9">0%</text>

      <!-- Q1 Bars -->
      <rect x="25" y="65" width="40" height="90" fill="#107C41"/>
      <text x="45" y="170" fill="#475569" font-size="10" text-anchor="middle">Q1</text>

      <!-- Q2 Bars -->
      <rect x="105" y="45" width="40" height="110" fill="#107C41"/>
      <text x="125" y="170" fill="#475569" font-size="10" text-anchor="middle">Q2</text>

      <!-- Q3 Bars -->
      <rect x="185" y="75" width="40" height="80" fill="#107C41"/>
      <text x="205" y="170" fill="#475569" font-size="10" text-anchor="middle">Q3</text>

      <!-- Q4 Bars -->
      <rect x="265" y="20" width="40" height="135" fill="#107C41"/>
      <text x="285" y="170" fill="#475569" font-size="10" text-anchor="middle">Q4</text>

      <!-- Combo Line on Secondary Axis -->
      <polyline points="45,95 125,60 205,80 285,35" stroke="#D97706" stroke-width="3" fill="none"/>
      <circle cx="45" cy="95" r="4" fill="#D97706"/>
      <circle cx="125" cy="60" r="4" fill="#D97706"/>
      <circle cx="205" cy="80" r="4" fill="#D97706"/>
      <circle cx="285" cy="35" r="4" fill="#D97706"/>
    </g>

    <!-- Legend -->
    <rect x="150" y="230" width="12" height="12" fill="#107C41"/>
    <text x="168" y="240" fill="#334155" font-size="10">Revenue (Primary Axis)</text>
    <line x1="285" y1="236" x2="305" y2="236" stroke="#D97706" stroke-width="3"/>
    <circle cx="295" cy="236" r="3" fill="#D97706"/>
    <text x="312" y="240" fill="#334155" font-size="10">Profit Margin % (Secondary Axis)</text>
  </g>

  <!-- Right: Sparklines Card -->
  <g transform="translate(500, 90)">
    <rect width="270" height="255" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect width="270" height="32" rx="6 6 0 0" fill="#047857"/>
    <text x="135" y="21" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">In-Cell Sparklines (Insert &gt; Sparkline)</text>

    <!-- Mini Table with Sparklines -->
    <g transform="translate(15, 45)">
      <text x="0" y="15" fill="#334155" font-size="10" font-weight="bold">Product</text>
      <text x="130" y="15" fill="#334155" font-size="10" font-weight="bold">12-Mo Trend</text>

      <line x1="0" y1="22" x2="240" y2="22" stroke="#CBD5E1"/>

      <!-- Row 1 -->
      <text x="0" y="44" fill="#0F172A" font-size="11">Enterprise CRM</text>
      <polyline points="130,46 150,38 170,42 190,30 210,25 230,22" stroke="#107C41" stroke-width="2" fill="none"/>
      <circle cx="230" cy="22" r="3" fill="#107C41"/>

      <!-- Row 2 -->
      <text x="0" y="74" fill="#0F172A" font-size="11">Cloud Analytics</text>
      <polyline points="130,80 150,75 170,68 190,62 210,58 230,52" stroke="#107C41" stroke-width="2" fill="none"/>
      <circle cx="230" cy="52" r="3" fill="#107C41"/>

      <!-- Row 3 -->
      <text x="0" y="104" fill="#0F172A" font-size="11">API Storage</text>
      <polyline points="130,95 150,105 170,100 190,110 210,102 230,115" stroke="#DC2626" stroke-width="2" fill="none"/>
      <circle cx="230" cy="115" r="3" fill="#DC2626"/>

      <!-- Sparkline Column Bars -->
      <g transform="translate(130, 135)">
        <rect x="0" y="10" width="8" height="20" fill="#3B82F6"/>
        <rect x="12" y="5" width="8" height="25" fill="#3B82F6"/>
        <rect x="24" y="15" width="8" height="15" fill="#3B82F6"/>
        <rect x="36" y="0" width="8" height="30" fill="#3B82F6"/>
        <rect x="48" y="8" width="8" height="22" fill="#3B82F6"/>
        <rect x="60" y="2" width="8" height="28" fill="#3B82F6"/>
      </g>
      <text x="0" y="155" fill="#0F172A" font-size="11">Monthly Volume</text>
    </g>
  </g>

  <!-- Bottom Panel: Chart Formatting Shortcuts -->
  <g transform="translate(30, 360)">
    <rect width="740" height="95" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="20" y="24" fill="#166534" font-size="12" font-weight="bold">Executive Charting Best Practices:</text>
    <text x="20" y="46" fill="#15803D" font-size="11">• Instant Chart Shortcut: Press F11 to create a chart sheet instantly, or Alt + F1 to insert an embedded chart.</text>
    <text x="20" y="66" fill="#15803D" font-size="11">• Eliminate Clutter: Remove heavy gridlines, eliminate redundant legends when the title is self-explanatory, and add direct data callouts.</text>
    <text x="20" y="86" fill="#166534" font-size="10" font-weight="600">• Always set vertical Y-axis minimums to zero on bar charts to avoid misleading visual distortion.</text>
  </g>

</svg>
