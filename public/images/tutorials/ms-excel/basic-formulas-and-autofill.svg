<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5A2E"/>
    </linearGradient>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5" y="-3" width="810" height="490" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="800" height="480" rx="10" fill="#FFFFFF"/>
  <rect width="800" height="480" rx="10" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 38 L 0 38 Z" fill="url(#excelGreen)"/>
  
  <!-- Window Controls -->
  <circle cx="18" cy="19" r="5" fill="#FF5F56"/>
  <circle cx="34" cy="19" r="5" fill="#FFBD2E"/>
  <circle cx="50" cy="19" r="5" fill="#27C93F"/>

  <!-- Excel Icon Badge -->
  <rect x="68" y="8" width="22" height="22" rx="4" fill="#0A4D27"/>
  <text x="79" y="24" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">X</text>

  <!-- Workbook Title -->
  <text x="400" y="24" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.2">Formulas & AutoFill Mechanics - Microsoft Excel</text>

  <!-- AutoSave Pill -->
  <rect x="670" y="9" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="730" y="23" fill="#FFFFFF" font-size="11" text-anchor="middle">AutoSave: On</text>

  
  <!-- Top Banner -->
  <rect x="0" y="38" width="800" height="42" fill="#F8FAFC"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#CBD5E1"/>
  <text x="24" y="64" fill="#0F172A" font-size="13" font-weight="bold">Understanding Excel Formulas, Relative References &amp; The Fill Handle</text>

  <!-- Left: Formula Architecture Card -->
  <g transform="translate(30, 95)">
    <rect width="360" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="360" height="34" rx="8 8 0 0" fill="#107C41"/>
    <text x="180" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Anatomy of an Excel Formula</text>

    <!-- Large Formula Syntax Breakdown -->
    <rect x="20" y="50" width="320" height="50" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="40" y="82" fill="#107C41" font-size="20" font-weight="900">=</text>
    <text x="60" y="82" fill="#2563EB" font-size="20" font-weight="900">SUM</text>
    <text x="110" y="82" fill="#64748B" font-size="20">(</text>
    <text x="120" y="82" fill="#D97706" font-size="20" font-weight="900">B2:B10</text>
    <text x="195" y="82" fill="#64748B" font-size="20">)</text>
    <text x="210" y="82" fill="#DC2626" font-size="20" font-weight="900">*</text>
    <text x="230" y="82" fill="#7C3AED" font-size="20" font-weight="900">$C$1</text>

    <!-- Explanation callouts -->
    <text x="25" y="125" fill="#107C41" font-size="11" font-weight="bold">• "=" Equals Sign</text>
    <text x="135" y="125" fill="#475569" font-size="11">Tells Excel to compute, not treat as text</text>

    <text x="25" y="150" fill="#2563EB" font-size="11" font-weight="bold">• SUM</text>
    <text x="135" y="150" fill="#475569" font-size="11">The built-in function name</text>

    <text x="25" y="175" fill="#D97706" font-size="11" font-weight="bold">• B2:B10</text>
    <text x="135" y="175" fill="#475569" font-size="11">Relative cell range (shifts when copied)</text>

    <text x="25" y="200" fill="#DC2626" font-size="11" font-weight="bold">• * Operator</text>
    <text x="135" y="200" fill="#475569" font-size="11">Arithmetic multiply (+, -, *, /)</text>

    <text x="25" y="225" fill="#7C3AED" font-size="11" font-weight="bold">• $C$1</text>
    <text x="135" y="225" fill="#475569" font-size="11">Absolute cell reference (locked with $)</text>
  </g>

  <!-- Right: AutoFill Mechanics Card -->
  <g transform="translate(410, 95)">
    <rect width="360" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="360" height="34" rx="8 8 0 0" fill="#0B5A2E"/>
    <text x="180" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">The Magic AutoFill Handle (Green Square)</text>

    <!-- Mini grid demonstrating AutoFill -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="80" height="24" fill="#E2E8F0" stroke="#CBD5E1"/>
      <text x="40" y="16" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Month</text>
      <rect x="80" y="0" width="90" height="24" fill="#E2E8F0" stroke="#CBD5E1"/>
      <text x="125" y="16" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Formula</text>

      <rect x="0" y="24" width="80" height="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="40" y="40" fill="#1E293B" font-size="11" text-anchor="middle">January</text>
      <rect x="80" y="24" width="90" height="24" fill="#DCFCE7" stroke="#107C41" stroke-width="2"/>
      <text x="125" y="40" fill="#15803D" font-size="11" font-weight="bold" text-anchor="middle">=A2*10%</text>
      <!-- Green dot -->
      <rect x="167" y="45" width="6" height="6" fill="#107C41"/>

      <!-- Downward drag arrow -->
      <path d="M 170 51 L 170 120" stroke="#107C41" stroke-width="2" stroke-dasharray="3 3"/>
      <polygon points="170,125 166,118 174,118" fill="#107C41"/>

      <!-- Auto-populated rows -->
      <rect x="0" y="48" width="80" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="40" y="64" fill="#64748B" font-size="11" text-anchor="middle">February</text>
      <rect x="80" y="48" width="90" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="125" y="64" fill="#64748B" font-size="11" text-anchor="middle">=A3*10%</text>

      <rect x="0" y="72" width="80" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="40" y="88" fill="#64748B" font-size="11" text-anchor="middle">March</text>
      <rect x="80" y="72" width="90" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="125" y="88" fill="#64748B" font-size="11" text-anchor="middle">=A4*10%</text>

      <rect x="0" y="96" width="80" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="40" y="112" fill="#64748B" font-size="11" text-anchor="middle">April</text>
      <rect x="80" y="96" width="90" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="125" y="112" fill="#64748B" font-size="11" text-anchor="middle">=A5*10%</text>
    </g>

    <text x="215" y="85" fill="#0F172A" font-size="11" font-weight="bold">Double-Click Shortcut:</text>
    <text x="215" y="103" fill="#475569" font-size="10">Double-clicking the green</text>
    <text x="215" y="118" fill="#475569" font-size="10">fill handle auto-fills down</text>
    <text x="215" y="133" fill="#475569" font-size="10">to match adjacent rows!</text>

    <text x="30" y="195" fill="#334155" font-size="11" font-weight="bold">AutoFill Smart Patterns:</text>
    <text x="30" y="215" fill="#64748B" font-size="10">• Jan ➔ Feb, Mar | Mon ➔ Tue, Wed | 1, 2 ➔ 3, 4, 5</text>
    <text x="30" y="232" fill="#64748B" font-size="10">• Flash Fill (Ctrl + E): Instantly splits First/Last names</text>
  </g>

  <!-- Bottom Pro Tip Banner -->
  <rect x="30" y="360" width="740" height="95" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="50" y="386" fill="#166534" font-size="13" font-weight="bold">Cell Referencing Golden Rule (Relative vs. Absolute):</text>
  <text x="50" y="408" fill="#15803D" font-size="11">• Relative Reference (A1): Shifts rows and columns automatically when dragged.</text>
  <text x="50" y="426" fill="#15803D" font-size="11">• Absolute Reference ($A$1): Locks both column and row permanently. Press F4 to cycle: A1 ➔ $A$1 ➔ A$1 ➔ $A1</text>
  <text x="50" y="444" fill="#166534" font-size="10" font-weight="600">• AutoSum Shortcut: Alt + = (instantly inserts =SUM() for adjacent numbers)</text>

</svg>
