<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Reshaping, Stacking &amp; Splitting Arrays</text>
  <text x="450" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Manipulating Dimensions, Concatenations (vstack/hstack) and Array Chunks</text>

  <!-- Left: Reshaping -->
  <g transform="translate(40, 95)">
    <rect width="390" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="390" height="35" rx="10" fill="#0284c7"/>
    <text x="195" y="23" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Reshaping Arrays: arr.reshape(3, 4)</text>

    <text x="25" y="65" fill="#93c5fd" font-family="monospace" font-size="12">1D Array (12 elements): np.arange(12)</text>
    
    <!-- 1D strip -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="14" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">0</text>
      <rect x="29" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="43" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">1</text>
      <rect x="58" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="72" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">2</text>
      <rect x="87" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="101" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">3</text>
      <rect x="116" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="130" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">4</text>
      <rect x="145" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="159" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">5</text>
      <rect x="174" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="188" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">6</text>
      <rect x="203" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="217" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">7</text>
      <rect x="232" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="246" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">8</text>
      <rect x="261" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="275" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">9</text>
      <rect x="290" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="304" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">10</text>
      <rect x="319" y="0" width="28" height="28" fill="#0369a1" stroke="#38bdf8" rx="2"/><text x="333" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">11</text>
    </g>

    <path d="M 195 115 L 195 135" stroke="#38bdf8" stroke-width="2"/>

    <text x="25" y="150" fill="#93c5fd" font-family="monospace" font-size="12">Reshaped into 2D (3 Rows x 4 Cols):</text>
    <!-- 2D matrix -->
    <g transform="translate(60, 165)">
      <rect x="0" y="0" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="30" y="18" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0</text>
      <rect x="65" y="0" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="95" y="18" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="130" y="0" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="160" y="18" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">2</text>
      <rect x="195" y="0" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="225" y="18" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">3</text>

      <rect x="0" y="32" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="30" y="50" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">4</text>
      <rect x="65" y="32" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="95" y="50" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">5</text>
      <rect x="130" y="32" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="160" y="50" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">6</text>
      <rect x="195" y="32" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="225" y="50" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>

      <rect x="0" y="64" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="30" y="82" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">8</text>
      <rect x="65" y="64" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="95" y="82" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">9</text>
      <rect x="130" y="64" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="160" y="82" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">10</text>
      <rect x="195" y="64" width="60" height="28" fill="#0369a1" stroke="#38bdf8" rx="3"/><text x="225" y="82" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">11</text>
    </g>

    <rect x="25" y="275" width="340" height="85" fill="#0f172a" rx="6"/>
    <text x="35" y="298" fill="#f59e0b" font-family="monospace" font-size="12">arr.reshape(3, -1) # Auto-computes 4 cols</text>
    <text x="35" y="320" fill="#34d399" font-family="monospace" font-size="12">arr.flatten()      # Deep copy into 1D</text>
    <text x="35" y="342" fill="#38bdf8" font-family="monospace" font-size="12">arr.ravel()        # Fast memory view in 1D</text>
  </g>

  <!-- Right: Stacking & Splitting -->
  <g transform="translate(470, 95)">
    <rect width="390" height="375" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="390" height="35" rx="10" fill="#059669"/>
    <text x="195" y="23" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Joining (Stacking) &amp; Splitting</text>

    <!-- vstack visual -->
    <g transform="translate(25, 55)">
      <text x="0" y="15" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">np.vstack((A, B)) -&gt; Vertical Stacking</text>
      <rect x="0" y="25" width="160" height="25" fill="#0284c7" rx="3"/><text x="80" y="42" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Array A (2, 3)</text>
      <rect x="0" y="53" width="160" height="25" fill="#d97706" rx="3"/><text x="80" y="70" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Array B (2, 3)</text>
      <text x="175" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Result: (4, 3)</text>
    </g>

    <!-- hstack visual -->
    <g transform="translate(25, 150)">
      <text x="0" y="15" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">np.hstack((A, B)) -&gt; Horizontal Stacking</text>
      <rect x="0" y="25" width="80" height="50" fill="#0284c7" rx="3"/><text x="40" y="55" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">A (2, 2)</text>
      <rect x="85" y="25" width="80" height="50" fill="#d97706" rx="3"/><text x="125" y="55" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">B (2, 2)</text>
      <text x="180" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Result: (2, 4)</text>
    </g>

    <!-- Splitting visual -->
    <g transform="translate(25, 250)">
      <text x="0" y="15" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">np.split(arr, 3) -&gt; Divide into 3 chunks</text>
      <rect x="0" y="25" width="100" height="30" fill="#7c3aed" rx="3"/><text x="50" y="45" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Chunk 1</text>
      <rect x="110" y="25" width="100" height="30" fill="#7c3aed" rx="3"/><text x="160" y="45" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Chunk 2</text>
      <rect x="220" y="25" width="100" height="30" fill="#7c3aed" rx="3"/><text x="270" y="45" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Chunk 3</text>
    </g>

    <text x="195" y="355" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">np.concatenate([A, B], axis=0 or 1)</text>
  </g>
</svg>