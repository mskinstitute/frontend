<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="npGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Header -->
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NumPy Architecture vs. Standard Python Lists</text>
  <text x="450" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Contiguous C-Memory Array vs. Pointer Overhead and Memory Fragmentation</text>

  <!-- LEFT PANEL: Python List -->
  <g transform="translate(40, 100)">
    <rect width="390" height="360" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <rect width="390" height="42" rx="12" fill="url(#pyGrad)"/>
    <text x="195" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Standard Python List: [10, 20, 30, 40]</text>

    <!-- Pointer Array -->
    <text x="25" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1. Array of Pointers (Memory References)</text>
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="80" height="35" fill="#334155" stroke="#64748b" rx="6"/>
      <text x="40" y="22" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">ptr -&gt; #1</text>
      
      <rect x="85" y="0" width="80" height="35" fill="#334155" stroke="#64748b" rx="6"/>
      <text x="125" y="22" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">ptr -&gt; #2</text>
      
      <rect x="170" y="0" width="80" height="35" fill="#334155" stroke="#64748b" rx="6"/>
      <text x="210" y="22" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">ptr -&gt; #3</text>
      
      <rect x="255" y="0" width="80" height="35" fill="#334155" stroke="#64748b" rx="6"/>
      <text x="295" y="22" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">ptr -&gt; #4</text>
    </g>

    <!-- Pointers Downward Arrows -->
    <path d="M 65 125 L 65 155 M 150 125 L 120 200 M 235 125 L 235 160 M 320 125 L 290 220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

    <!-- Scattered PyObject Blocks in Heap -->
    <text x="25" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2. Scattered PyObject Wrappers (28+ bytes each)</text>
    <rect x="25" y="175" width="80" height="60" fill="#451a03" stroke="#f59e0b" rx="6"/>
    <text x="65" y="195" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PyObject</text>
    <text x="65" y="212" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Type, RefCount</text>
    <text x="65" y="228" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">val: 10</text>

    <rect x="195" y="175" width="80" height="60" fill="#451a03" stroke="#f59e0b" rx="6"/>
    <text x="235" y="195" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PyObject</text>
    <text x="235" y="212" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Type, RefCount</text>
    <text x="235" y="228" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">val: 30</text>

    <rect x="100" y="250" width="80" height="60" fill="#451a03" stroke="#f59e0b" rx="6"/>
    <text x="140" y="270" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PyObject</text>
    <text x="140" y="287" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Type, RefCount</text>
    <text x="140" y="303" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">val: 20</text>

    <rect x="270" y="250" width="80" height="60" fill="#451a03" stroke="#f59e0b" rx="6"/>
    <text x="310" y="270" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PyObject</text>
    <text x="310" y="287" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Type, RefCount</text>
    <text x="310" y="303" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">val: 40</text>

    <rect x="20" y="325" width="350" height="25" fill="#0f172a" rx="4"/>
    <text x="195" y="342" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Slow: Cache misses, pointer chasing, high RAM</text>
  </g>

  <!-- RIGHT PANEL: NumPy ndarray -->
  <g transform="translate(470, 100)">
    <rect width="390" height="360" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="390" height="42" rx="12" fill="url(#npGrad)"/>
    <text x="195" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">NumPy ndarray: np.array([10, 20, 30, 40])</text>

    <!-- Header Metadata Object -->
    <text x="25" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1. Array Header (Tiny Metadata Wrapper)</text>
    <rect x="25" y="85" width="340" height="50" fill="#0c4a6e" stroke="#38bdf8" rx="6"/>
    <text x="40" y="105" fill="#38bdf8" font-family="monospace" font-size="11">shape: (4,)   |  dtype: int64 (8 bytes)</text>
    <text x="40" y="123" fill="#38bdf8" font-family="monospace" font-size="11">strides: (8,) |  data pointer -&gt; memory buffer</text>

    <!-- Downward Arrow -->
    <path d="M 195 140 L 195 170" stroke="#38bdf8" stroke-width="3"/>

    <!-- Contiguous C-Memory Block -->
    <text x="25" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2. Contiguous Raw Data Buffer in RAM (Strict C-Array)</text>
    <g transform="translate(25, 200)">
      <rect x="0" y="0" width="85" height="70" fill="#0369a1" stroke="#38bdf8" rx="6"/>
      <text x="42" y="25" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Index [0]</text>
      <text x="42" y="52" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">10</text>

      <rect x="85" y="0" width="85" height="70" fill="#0369a1" stroke="#38bdf8" rx="6"/>
      <text x="127" y="25" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Index [1]</text>
      <text x="127" y="52" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">20</text>

      <rect x="170" y="0" width="85" height="70" fill="#0369a1" stroke="#38bdf8" rx="6"/>
      <text x="212" y="25" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Index [2]</text>
      <text x="212" y="52" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">30</text>

      <rect x="255" y="0" width="85" height="70" fill="#0369a1" stroke="#38bdf8" rx="6"/>
      <text x="297" y="25" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Index [3]</text>
      <text x="297" y="52" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">40</text>
    </g>

    <text x="195" y="295" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Direct 32-byte continuous block: 4 elements x 8 bytes</text>

    <rect x="20" y="325" width="350" height="25" fill="#0f172a" rx="4"/>
    <text x="195" y="342" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Fast: 50x-100x speedup, CPU SIMD vectorization, tiny RAM</text>
  </g>
</svg>