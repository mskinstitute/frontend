<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad)" rx="16"/>

  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">The Mechanics of NumPy Broadcasting</text>
  <text x="450" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Stretching Dimensions of Size 1 Without Physical Memory Duplication</text>

  <!-- Example 1: 2D Matrix + 1D Row -->
  <g transform="translate(50, 95)">
    <rect width="800" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Case 1: Shape (3, 3) + Shape (3,) -&gt; Result (3, 3)</text>
    
    <!-- Matrix A (3, 3) -->
    <g transform="translate(30, 50)">
      <text x="60" y="-10" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Array A (3, 3)</text>
      <rect x="0" y="0" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="19" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
      <rect x="42" y="0" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="61" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">2</text>
      <rect x="84" y="0" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="103" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">3</text>
      
      <rect x="0" y="34" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="19" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">4</text>
      <rect x="42" y="34" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="61" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">5</text>
      <rect x="84" y="34" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="103" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">6</text>
      
      <rect x="0" y="68" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="19" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
      <rect x="42" y="68" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="61" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">8</text>
      <rect x="84" y="68" width="38" height="30" fill="#0284c7" stroke="#38bdf8" rx="3"/><text x="103" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">9</text>
    </g>

    <text x="195" y="105" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">+</text>

    <!-- Vector B (1, 3) Stretch -->
    <g transform="translate(230, 50)">
      <text x="60" y="-10" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">Array B (1, 3) Broadcasts</text>
      <!-- Row 0 Real -->
      <rect x="0" y="0" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="19" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">10</text>
      <rect x="42" y="0" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="61" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">20</text>
      <rect x="84" y="0" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="103" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">30</text>
      <!-- Stretched rows (virtual) -->
      <g opacity="0.4" stroke-dasharray="3,3">
        <rect x="0" y="34" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="19" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">10</text>
        <rect x="42" y="34" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="61" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">20</text>
        <rect x="84" y="34" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="103" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">30</text>
        <rect x="0" y="68" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="19" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">10</text>
        <rect x="42" y="68" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="61" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">20</text>
        <rect x="84" y="68" width="38" height="30" fill="#d97706" stroke="#fbbf24" rx="3"/><text x="103" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">30</text>
      </g>
    </g>

    <text x="395" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">=</text>

    <!-- Result Matrix (3, 3) -->
    <g transform="translate(435, 50)">
      <text x="60" y="-10" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">Result (3, 3)</text>
      <rect x="0" y="0" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="19" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">11</text>
      <rect x="42" y="0" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="61" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">22</text>
      <rect x="84" y="0" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="103" y="20" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">33</text>
      
      <rect x="0" y="34" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="19" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">14</text>
      <rect x="42" y="34" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="61" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">25</text>
      <rect x="84" y="34" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="103" y="54" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">36</text>
      
      <rect x="0" y="68" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="19" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">17</text>
      <rect x="42" y="68" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="61" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">28</text>
      <rect x="84" y="68" width="38" height="30" fill="#047857" stroke="#34d399" rx="3"/><text x="103" y="88" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">39</text>
    </g>

    <!-- Rule text on the right -->
    <g transform="translate(590, 50)">
      <rect width="180" height="100" fill="#0f172a" rx="6"/>
      <text x="15" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">The Golden Rule:</text>
      <text x="15" y="45" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Compare dimensions from</text>
      <text x="15" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">RIGHT to LEFT:</text>
      <text x="15" y="78" fill="#22c55e" font-family="monospace" font-size="11">Dim A:  3  x  3</text>
      <text x="15" y="93" fill="#22c55e" font-family="monospace" font-size="11">Dim B:  1  x  3 (Match!)</text>
    </g>
  </g>

  <!-- Example 2: Incompatible Shapes Alert -->
  <g transform="translate(50, 310)">
    <rect width="800" height="180" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="30" y="30" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Case 2: Broadcasting Error Example: (3, 3) + (2,)</text>

    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="350" height="105" fill="#0f172a" rx="8"/>
      <text x="20" y="30" fill="#f8fafc" font-family="monospace" font-size="12">&gt;&gt;&gt; a = np.ones((3, 3))</text>
      <text x="20" y="55" fill="#f8fafc" font-family="monospace" font-size="12">&gt;&gt;&gt; b = np.array([10, 20])</text>
      <text x="20" y="80" fill="#f43f5e" font-family="monospace" font-size="12">&gt;&gt;&gt; a + b</text>
      <text x="20" y="98" fill="#ef4444" font-family="monospace" font-size="11">ValueError: operands could not be broadcast</text>
    </g>

    <g transform="translate(420, 50)">
      <rect width="350" height="105" fill="#450a0a" rx="8" stroke="#f43f5e"/>
      <text x="20" y="30" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Why did this fail?</text>
      <text x="20" y="55" fill="#fecaca" font-family="monospace" font-size="12">Dim A: 3 x 3</text>
      <text x="20" y="75" fill="#fecaca" font-family="monospace" font-size="12">Dim B:     2  &lt;-- Mismatch! (3 != 2 &amp;&amp; != 1)</text>
      <text x="20" y="95" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Trailing dimensions must either be EQUAL or ONE.</text>
    </g>
  </g>
</svg>