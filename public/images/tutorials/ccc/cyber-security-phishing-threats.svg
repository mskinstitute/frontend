<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Cyber Security &amp; Safe Digital Practices (साइबर सुरक्षा)</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Protecting PC, Mobile, Bank &amp; Social Accounts from Online Fraud and Malware</text>

  <!-- Left Card: Types of Cyber Threats -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="380" height="360" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <rect x="0" y="0" width="380" height="42" rx="12" fill="#e11d48" />
    <text x="190" y="27" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">⚠️ Cyber Threats &amp; Malwares (खतरे)</text>

    <g transform="translate(20, 60)" fill="#e2e8f0" font-size="12">
      <rect x="0" y="0" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="20" fill="#f87171" font-weight="bold">🦠 Computer Virus</text>
      <text x="15" y="38" fill="#94a3b8">Modifies other programs &amp; corrupts data</text>

      <rect x="0" y="56" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="76" fill="#f87171" font-weight="bold">🐛 Worms</text>
      <text x="15" y="94" fill="#94a3b8">Self-replicating, clogs internet &amp; network bandwidth</text>

      <rect x="0" y="112" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="132" fill="#f87171" font-weight="bold">🐴 Trojan Horse</text>
      <text x="15" y="150" fill="#94a3b8">Disguised as useful software, opens backdoor</text>

      <rect x="0" y="168" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="188" fill="#f87171" font-weight="bold">🔒 Ransomware</text>
      <text x="15" y="206" fill="#94a3b8">Encrypts user files &amp; demands money/Bitcoin</text>

      <rect x="0" y="224" width="340" height="58" rx="6" fill="#0f172a" stroke="#e11d48" />
      <text x="15" y="244" fill="#facc15" font-weight="bold">🎣 Phishing &amp; Fake Links (फिशिंग)</text>
      <text x="15" y="260" fill="#cbd5e1">Fake emails/SMS pretending to be SBI or Paytm</text>
      <text x="15" y="274" fill="#94a3b8">Steals passwords, debit card numbers &amp; OTP</text>
    </g>
  </g>

  <!-- Right Card: Safe Defense Practices -->
  <g transform="translate(470, 85)">
    <rect x="0" y="0" width="380" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="380" height="42" rx="12" fill="#059669" />
    <text x="190" y="27" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">🛡️ Best Defense Practices (सुरक्षा नियम)</text>

    <g transform="translate(20, 60)" fill="#e2e8f0" font-size="12">
      <rect x="0" y="0" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="20" fill="#34d399" font-weight="bold">🔐 Strong Password &amp; 2FA</text>
      <text x="15" y="38" fill="#94a3b8">12+ chars (A-Z, a-z, 0-9, @#$) + Mobile OTP</text>

      <rect x="0" y="56" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="76" fill="#34d399" font-weight="bold">🔒 HTTPS &amp; Padlock Sign</text>
      <text x="15" y="94" fill="#94a3b8">Always verify "https://" before entering banking data</text>

      <rect x="0" y="112" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="132" fill="#34d399" font-weight="bold">🛡️ Windows Defender &amp; Firewall</text>
      <text x="15" y="150" fill="#94a3b8">Keep Real-Time Protection &amp; OS updates turned ON</text>

      <rect x="0" y="168" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="188" fill="#34d399" font-weight="bold">🚫 Beware of Public Free Wi-Fi</text>
      <text x="15" y="206" fill="#94a3b8">Do NOT do financial transactions on railway/cafe open Wi-Fi</text>

      <rect x="0" y="224" width="340" height="58" rx="6" fill="#064e3b" stroke="#10b981" />
      <text x="15" y="244" fill="#facc15" font-weight="bold">🚨 National Cyber Helpline: 1930</text>
      <text x="15" y="260" fill="#a7f3d0">Report fraud immediately at: cybercrime.gov.in</text>
      <text x="15" y="274" fill="#6ee7b7">Golden hour: Report within 2 hours to freeze stolen money</text>
    </g>
  </g>
</svg>