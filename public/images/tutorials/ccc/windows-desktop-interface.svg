<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif;">
  <text x="450" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">GUI Operating System - Windows Desktop Anatomy (डेस्कटॉप संरचना)</text>

  <!-- Monitor Screen Outer Frame -->
  <rect x="60" y="65" width="780" height="380" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4" />
  <!-- Wallpaper area -->
  <rect x="64" y="69" width="772" height="332" fill="#0f172a" />
  
  <!-- Desktop Icons -->
  <g transform="translate(85, 90)" fill="#f8fafc" font-size="11" text-anchor="middle">
    <!-- This PC -->
    <rect x="0" y="0" width="50" height="40" rx="6" fill="#3b82f6" opacity="0.3" stroke="#60a5fa" />
    <text x="25" y="25" font-size="18">🖥️</text>
    <text x="25" y="55">This PC</text>

    <!-- Recycle Bin -->
    <rect x="0" y="75" width="50" height="40" rx="6" fill="#10b981" opacity="0.3" stroke="#34d399" />
    <text x="25" y="100" font-size="18">🗑️</text>
    <text x="25" y="130">Recycle Bin</text>

    <!-- Control Panel -->
    <rect x="0" y="150" width="50" height="40" rx="6" fill="#f59e0b" opacity="0.3" stroke="#fbbf24" />
    <text x="25" y="175" font-size="18">⚙️</text>
    <text x="25" y="205">Control Panel</text>

    <!-- Chrome -->
    <rect x="0" y="225" width="50" height="40" rx="6" fill="#ef4444" opacity="0.3" stroke="#f87171" />
    <text x="25" y="250" font-size="18">🌐</text>
    <text x="25" y="280">Browser</text>
  </g>

  <!-- Center Active Window: File Explorer -->
  <g transform="translate(230, 100)">
    <rect x="0" y="0" width="460" height="260" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Titlebar -->
    <rect x="0" y="0" width="460" height="30" rx="6" fill="#0284c7" />
    <text x="15" y="20" fill="#ffffff" font-size="12" font-weight="bold">📁 File Explorer (This PC &gt; Documents)</text>
    <circle cx="410" cy="15" r="5" fill="#f59e0b" />
    <circle cx="428" cy="15" r="5" fill="#10b981" />
    <circle cx="446" cy="15" r="5" fill="#ef4444" />
    
    <!-- Window Body -->
    <rect x="10" y="40" width="110" height="205" fill="#0f172a" stroke="#334155" />
    <text x="20" y="65" fill="#94a3b8" font-size="11">Desktop</text>
    <text x="20" y="90" fill="#38bdf8" font-size="11" font-weight="bold">Documents</text>
    <text x="20" y="115" fill="#94a3b8" font-size="11">Downloads</text>
    <text x="20" y="140" fill="#94a3b8" font-size="11">Pictures</text>
    <text x="20" y="165" fill="#94a3b8" font-size="11">Local Disk (C:)</text>
    <text x="20" y="190" fill="#94a3b8" font-size="11">Local Disk (D:)</text>

    <!-- File List Area -->
    <rect x="130" y="40" width="315" height="205" fill="#0f172a" stroke="#334155" />
    <text x="145" y="65" fill="#f8fafc" font-size="11">📄 CCC_Notes_Chapter1.docx (24 KB)</text>
    <text x="145" y="95" fill="#f8fafc" font-size="11">📊 Marksheet_Analysis.ods (18 KB)</text>
    <text x="145" y="125" fill="#f8fafc" font-size="11">🖼️ Institute_Photo.jpg (1.2 MB)</text>
    <text x="145" y="155" fill="#f8fafc" font-size="11">📕 NIELIT_Admit_Card.pdf (140 KB)</text>
  </g>

  <!-- BOTTOM TASKBAR -->
  <rect x="64" y="401" width="772" height="44" fill="#020617" stroke="#334155" stroke-width="1" />
  
  <!-- Start Button -->
  <rect x="75" y="408" width="32" height="30" rx="4" fill="#0284c7" />
  <text x="91" y="428" fill="#ffffff" font-size="14" text-anchor="middle">⊞</text>
  
  <!-- Search Bar -->
  <rect x="115" y="410" width="140" height="26" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="125" y="427" fill="#94a3b8" font-size="11">🔍 Type to search...</text>

  <!-- Pinned Icons -->
  <text x="280" y="428" font-size="16">📁</text>
  <text x="310" y="428" font-size="16">🌐</text>
  <text x="340" y="428" font-size="16">📝</text>
  <text x="370" y="428" font-size="16">📊</text>

  <!-- Notification Area / System Tray (Right Corner) -->
  <rect x="660" y="408" width="166" height="30" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="670" y="427" font-size="12">📶 🔊 🔋</text>
  <text x="735" y="422" fill="#f8fafc" font-size="10" font-weight="bold">10:30 AM</text>
  <text x="735" y="434" fill="#94a3b8" font-size="9">13-09-2026</text>

  <!-- Monitor Stand -->
  <rect x="420" y="445" width="60" height="25" fill="#334155" />
  <rect x="360" y="470" width="180" height="12" rx="4" fill="#475569" />
</svg>