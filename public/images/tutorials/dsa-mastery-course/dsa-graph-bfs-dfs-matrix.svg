<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg5)"/>
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Graph Theory: Representations, BFS (Queue) &amp; DFS (Stack)</text>
  <rect x="630" y="25" width="130" height="28" rx="14" fill="#065f46"/>
  <text x="695" y="44" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GRAPH ALGORITHMS</text>

  <!-- Left: Visual Graph Network -->
  <line x1="120" y1="150" x2="240" y2="110" stroke="#334155" stroke-width="3"/>
  <line x1="120" y1="150" x2="160" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="240" y1="110" x2="320" y2="200" stroke="#334155" stroke-width="3"/>
  <line x1="160" y1="270" x2="320" y2="200" stroke="#334155" stroke-width="3"/>
  <line x1="320" y1="200" x2="260" y2="330" stroke="#334155" stroke-width="3"/>

  <!-- Node 0 -->
  <circle cx="120" cy="150" r="22" fill="#059669" stroke="#34d399" stroke-width="2"/>
  <text x="120" y="157" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">0</text>

  <!-- Node 1 -->
  <circle cx="240" cy="110" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="117" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text>

  <!-- Node 2 -->
  <circle cx="160" cy="270" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="277" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text>

  <!-- Node 3 -->
  <circle cx="320" cy="200" r="22" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>
  <text x="320" y="207" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text>

  <!-- Node 4 -->
  <circle cx="260" cy="330" r="22" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  <text x="260" y="337" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text>

  <!-- Right: Representations -->
  <!-- Adjacency List Box -->
  <rect x="420" y="90" width="340" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="115" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Adjacency List (Space: O(V + E)) - Standard</text>
  <text x="440" y="145" fill="#cbd5e1" font-family="monospace" font-size="12">0: [1, 2]</text>
  <text x="440" y="165" fill="#cbd5e1" font-family="monospace" font-size="12">1: [0, 3]</text>
  <text x="440" y="185" fill="#cbd5e1" font-family="monospace" font-size="12">2: [0, 3]</text>
  <text x="440" y="205" fill="#cbd5e1" font-family="monospace" font-size="12">3: [1, 2, 4]</text>
  <text x="440" y="225" fill="#cbd5e1" font-family="monospace" font-size="12">4: [3]</text>

  <!-- BFS vs DFS Comparison -->
  <rect x="420" y="260" width="340" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BFS vs DFS Traversal Mechanics:</text>

  <text x="440" y="315" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Breadth-First Search (BFS):</text>
  <text x="440" y="333" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Uses a <tspan fill="#38bdf8">FIFO Queue</tspan></text>
  <text x="440" y="350" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Explores concentric rings outward (Shortest Path in unweighted)</text>

  <text x="440" y="380" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Depth-First Search (DFS):</text>
  <text x="440" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Uses a <tspan fill="#c084fc">LIFO Stack</tspan> or Function Call Stack (Recursion)</text>
  <text x="440" y="415" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Dives deeply along branches before backtracking (Cycle detection)</text>
</svg>