<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="o1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ologn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="on" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="onlogn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="on2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="o2n" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bg)"/>

  <!-- Title & Badge -->
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Big-O Time &amp; Space Complexity Hierarchy</text>
  <rect x="630" y="25" width="130" height="28" rx="14" fill="#334155"/>
  <text x="695" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DSA FOUNDATIONS</text>

  <!-- Coordinate Grid -->
  <line x1="80" y1="410" x2="740" y2="410" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="410" stroke="#475569" stroke-width="2"/>

  <!-- Arrows -->
  <polygon points="745,410 735,405 735,415" fill="#475569"/>
  <polygon points="80,85 75,95 85,95" fill="#475569"/>

  <!-- Axis Labels -->
  <text x="740" y="435" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Input Size (n) →</text>
  <text x="40" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" transform="rotate(-90 40 90)">Operations / Time (T) →</text>

  <!-- Grid Guide Lines -->
  <line x1="80" y1="330" x2="740" y2="330" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="80" y1="250" x2="740" y2="250" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="80" y1="170" x2="740" y2="170" stroke="#1e293b" stroke-dasharray="4"/>

  <!-- Curves -->
  <!-- O(1) Constant -->
  <line x1="80" y1="395" x2="730" y2="395" stroke="url(#o1)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="735" y="398" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(1) - Excellent</text>

  <!-- O(log n) Logarithmic -->
  <path d="M 80 410 Q 200 375, 450 360 T 730 345" fill="none" stroke="url(#ologn)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="735" y="348" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(log n) - Good</text>

  <!-- O(n) Linear -->
  <line x1="80" y1="410" x2="700" y2="260" stroke="url(#on)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="705" y="258" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(n) - Fair</text>

  <!-- O(n log n) Linearithmic -->
  <path d="M 80 410 Q 300 350, 500 230 T 660 140" fill="none" stroke="url(#onlogn)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="665" y="135" fill="#fb923c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(n log n) - Bad</text>

  <!-- O(n^2) Quadratic -->
  <path d="M 80 410 Q 250 380, 380 180 T 430 95" fill="none" stroke="url(#on2)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="435" y="100" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(n²) - Horrible</text>

  <!-- O(2^n) Exponential -->
  <path d="M 80 410 Q 140 400, 180 200 T 210 95" fill="none" stroke="url(#o2n)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="215" y="95" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">O(2ⁿ) - Catastrophic</text>

  <!-- Footer Legend -->
  <rect x="80" y="440" width="12" height="12" rx="3" fill="#10b981"/>
  <text x="100" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Hash Tables, Array Lookup</text>

  <rect x="270" y="440" width="12" height="12" rx="3" fill="#06b6d4"/>
  <text x="290" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Binary Search, BST</text>

  <rect x="430" y="440" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="450" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Linear Scan, Two Pointers</text>

  <rect x="610" y="440" width="12" height="12" rx="3" fill="#f97316"/>
  <text x="630" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Merge Sort, Heap Sort</text>
</svg>