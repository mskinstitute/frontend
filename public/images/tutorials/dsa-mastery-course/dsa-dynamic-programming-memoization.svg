<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg6)"/>
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Dynamic Programming: Overlapping Subproblems &amp; Memoization</text>
  <rect x="630" y="25" width="130" height="28" rx="14" fill="#3b0764"/>
  <text x="695" y="44" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OPTIMIZATION</text>

  <!-- Fibonacci Recursion Tree Visual -->
  <text x="40" y="95" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Naive Recursion Tree for Fib(5) [O(2ⁿ) Exponential Explosion]:</text>

  <!-- Branches -->
  <line x1="280" y1="125" x2="160" y2="185" stroke="#475569" stroke-width="2"/>
  <line x1="280" y1="125" x2="400" y2="185" stroke="#475569" stroke-width="2"/>

  <line x1="160" y1="185" x2="100" y2="245" stroke="#475569" stroke-width="2"/>
  <line x1="160" y1="185" x2="220" y2="245" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="185" x2="340" y2="245" stroke="#ef4444" stroke-width="2" stroke-dasharray="3"/>
  <line x1="400" y1="185" x2="460" y2="245" stroke="#ef4444" stroke-width="2" stroke-dasharray="3"/>

  <!-- Root Fib(5) -->
  <circle cx="280" cy="125" r="22" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>
  <text x="280" y="131" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">f(5)</text>

  <!-- Fib(4) -->
  <circle cx="160" cy="185" r="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">f(4)</text>

  <!-- Fib(3) Duplicate 1 -->
  <circle cx="400" cy="185" r="20" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">f(3)</text>
  <text x="470" y="190" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">REDUNDANT!</text>

  <!-- Fib(3) First computation -->
  <circle cx="100" cy="245" r="18" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
  <text x="100" y="251" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">f(3)</text>

  <!-- Fib(2) First computation -->
  <circle cx="220" cy="245" r="18" fill="#059669" stroke="#34d399" stroke-width="2"/>
  <text x="220" y="251" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">f(2)</text>

  <circle cx="340" cy="245" r="18" fill="#059669" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="251" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">f(2)</text>

  <circle cx="460" cy="245" r="18" fill="#475569"/>
  <text x="460" y="251" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">f(1)</text>

  <!-- Right: Memoization Table / Array -->
  <rect x="520" y="90" width="240" height="230" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="540" y="118" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DP Memo Table [O(n)]:</text>

  <rect x="540" y="135" width="200" height="30" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="555" y="155" fill="#94a3b8" font-family="monospace" font-size="12">memo[0] = 0</text>

  <rect x="540" y="170" width="200" height="30" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="555" y="190" fill="#94a3b8" font-family="monospace" font-size="12">memo[1] = 1</text>

  <rect x="540" y="205" width="200" height="30" rx="4" fill="#0f172a" stroke="#34d399"/>
  <text x="555" y="225" fill="#34d399" font-family="monospace" font-size="12">memo[2] = 1 (Cached)</text>

  <rect x="540" y="240" width="200" height="30" rx="4" fill="#0f172a" stroke="#34d399"/>
  <text x="555" y="260" fill="#34d399" font-family="monospace" font-size="12">memo[3] = 2 (Cached)</text>

  <rect x="540" y="275" width="200" height="30" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="555" y="295" fill="#38bdf8" font-family="monospace" font-size="12">memo[4] = 3 (Instant)</text>

  <!-- Bottom Comparison Card -->
  <rect x="40" y="340" width="720" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="370" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Two Approaches to Dynamic Programming:</text>
  <text x="60" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">
    1. <tspan fill="#c084fc" font-weight="700">Top-Down Memoization:</tspan> Natural recursive logic + hash map/array cache to store answers to already-solved subproblems.
  </text>
  <text x="60" y="425" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">
    2. <tspan fill="#34d399" font-weight="700">Bottom-Up Tabulation:</tspan> Iterative table-filling starting from base cases, eliminating recursion call-stack overhead ($O(1)$ space optimization).
  </text>
</svg>