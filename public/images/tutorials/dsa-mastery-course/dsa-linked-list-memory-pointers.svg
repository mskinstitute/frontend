<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg2)"/>
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Linked List Architecture: Node Pointers in Memory</text>
  <rect x="630" y="25" width="130" height="28" rx="14" fill="#334155"/>
  <text x="695" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LINEAR STRUCTURES</text>

  <!-- Singly Linked List Title -->
  <text x="40" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">1. Singly Linked List (Sequential Forward Traversal)</text>

  <!-- HEAD Pointer -->
  <rect x="40" y="130" width="70" height="35" rx="6" fill="#0284c7"/>
  <text x="75" y="152" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HEAD</text>
  <line x1="110" y1="147" x2="150" y2="147" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="155,147 146,142 146,152" fill="#38bdf8"/>

  <!-- Node 1 -->
  <rect x="160" y="120" width="140" height="65" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="160" y="120" width="70" height="65" rx="8" fill="#1e293b"/>
  <text x="195" y="157" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">10</text>
  <text x="195" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DATA</text>
  <text x="265" y="153" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">0x04A</text>
  <text x="265" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">NEXT →</text>
  <text x="230" y="202" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Addr: 0x01F</text>

  <line x1="300" y1="152" x2="350" y2="152" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="355,152 346,147 346,157" fill="#38bdf8"/>

  <!-- Node 2 -->
  <rect x="360" y="120" width="140" height="65" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="360" y="120" width="70" height="65" rx="8" fill="#1e293b"/>
  <text x="395" y="157" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">25</text>
  <text x="395" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DATA</text>
  <text x="465" y="153" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">0x08C</text>
  <text x="465" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">NEXT →</text>
  <text x="430" y="202" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Addr: 0x04A</text>

  <line x1="500" y1="152" x2="550" y2="152" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="555,152 546,147 546,157" fill="#38bdf8"/>

  <!-- Node 3 (TAIL) -->
  <rect x="560" y="120" width="140" height="65" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="560" y="120" width="70" height="65" rx="8" fill="#1e293b"/>
  <text x="595" y="157" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">42</text>
  <text x="595" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DATA</text>
  <text x="665" y="155" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">NULL</text>
  <text x="665" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">END</text>
  <text x="630" y="202" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Addr: 0x08C (TAIL)</text>

  <!-- Doubly Linked List Section -->
  <text x="40" y="260" fill="#a855f7" font-family="system-ui, sans-serif" font-size="15" font-weight="600">2. Doubly Linked List (Bidirectional Navigation)</text>

  <!-- Doubly Node 1 -->
  <rect x="140" y="290" width="180" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="140" y="290" width="55" height="70" rx="8" fill="#0f172a"/>
  <text x="167" y="327" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NULL</text>
  <text x="167" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">PREV</text>

  <text x="230" y="330" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">100</text>
  <text x="230" y="348" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DATA</text>

  <rect x="265" y="290" width="55" height="70" rx="8" fill="#0f172a"/>
  <text x="292" y="327" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">0x0F2</text>
  <text x="292" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">NEXT →</text>

  <!-- Bidirectional Arrows -->
  <line x1="320" y1="315" x2="410" y2="315" stroke="#a855f7" stroke-width="2"/>
  <polygon points="415,315 407,311 407,319" fill="#a855f7"/>

  <line x1="410" y1="335" x2="320" y2="335" stroke="#a855f7" stroke-width="2"/>
  <polygon points="315,335 323,331 323,339" fill="#a855f7"/>

  <!-- Doubly Node 2 -->
  <rect x="420" y="290" width="180" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="420" y="290" width="55" height="70" rx="8" fill="#0f172a"/>
  <text x="447" y="327" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">0x0A1</text>
  <text x="447" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">← PREV</text>

  <text x="510" y="330" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">200</text>
  <text x="510" y="348" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DATA</text>

  <rect x="545" y="290" width="55" height="70" rx="8" fill="#0f172a"/>
  <text x="572" y="327" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NULL</text>
  <text x="572" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">NEXT</text>

  <!-- Summary Box -->
  <rect x="40" y="400" width="720" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="430" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">
    <tspan fill="#38bdf8" font-weight="700">Key Insight:</tspan> Arrays store contiguous elements in RAM (<tspan fill="#34d399">O(1) index access</tspan>). Linked Lists store scattered nodes connected via pointers (<tspan fill="#f59e0b">O(1) dynamic insert/delete</tspan> without array shifting).
  </text>
</svg>