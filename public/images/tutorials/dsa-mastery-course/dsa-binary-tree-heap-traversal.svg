<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg4)"/>
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Binary Tree Traversals &amp; Min-Heap Array Mapping</text>
  <rect x="630" y="25" width="130" height="28" rx="14" fill="#21262d"/>
  <text x="695" y="44" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TREE ALGORITHMS</text>

  <!-- Tree Branches -->
  <!-- Root to Children -->
  <line x1="240" y1="105" x2="140" y2="185" stroke="#30363d" stroke-width="2.5"/>
  <line x1="240" y1="105" x2="340" y2="185" stroke="#30363d" stroke-width="2.5"/>

  <!-- Level 2 to Level 3 -->
  <line x1="140" y1="185" x2="90" y2="265" stroke="#30363d" stroke-width="2.5"/>
  <line x1="140" y1="185" x2="190" y2="265" stroke="#30363d" stroke-width="2.5"/>
  <line x1="340" y1="185" x2="290" y2="265" stroke="#30363d" stroke-width="2.5"/>
  <line x1="340" y1="185" x2="390" y2="265" stroke="#30363d" stroke-width="2.5"/>

  <!-- Root Node (5) -->
  <circle cx="240" cy="105" r="24" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="240" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text>
  <text x="240" y="75" fill="#58a6ff" font-family="monospace" font-size="11" text-anchor="middle">i = 0 (ROOT)</text>

  <!-- Level 2 Left (12) -->
  <circle cx="140" cy="185" r="22" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="140" y="192" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">12</text>
  <text x="95" y="185" fill="#3fb950" font-family="monospace" font-size="11">i = 1</text>

  <!-- Level 2 Right (9) -->
  <circle cx="340" cy="185" r="22" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="340" y="192" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">9</text>
  <text x="385" y="185" fill="#3fb950" font-family="monospace" font-size="11">i = 2</text>

  <!-- Level 3 Nodes -->
  <circle cx="90" cy="265" r="18" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="90" y="271" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">20</text>
  <text x="90" y="300" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">i = 3</text>

  <circle cx="190" cy="265" r="18" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="190" y="271" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">15</text>
  <text x="190" y="300" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">i = 4</text>

  <circle cx="290" cy="265" r="18" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="290" y="271" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">18</text>
  <text x="290" y="300" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">i = 5</text>

  <circle cx="390" cy="265" r="18" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="390" y="271" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">10</text>
  <text x="390" y="300" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">i = 6</text>

  <!-- Right Side: Traversal Formulas & Heap Array Representation -->
  <rect x="470" y="90" width="290" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="490" y="118" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Heap Array Index Formulas:</text>
  <text x="490" y="145" fill="#c9d1d9" font-family="monospace" font-size="12">Left Child  = 2 * i + 1</text>
  <text x="490" y="170" fill="#c9d1d9" font-family="monospace" font-size="12">Right Child = 2 * i + 2</text>
  <text x="490" y="195" fill="#c9d1d9" font-family="monospace" font-size="12">Parent Node = Math.floor((i-1)/2)</text>
  <text x="490" y="222" fill="#7ee787" font-family="system-ui, sans-serif" font-size="11">Complete binary trees store in contiguous RAM!</text>

  <!-- Array Visualization -->
  <text x="40" y="345" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Array Storage [O(1) parent-child jumping without pointer overhead]:</text>

  <g transform="translate(40, 360)">
    <!-- Array Boxes -->
    <rect x="0" y="0" width="55" height="40" fill="#1f6feb" stroke="#58a6ff"/>
    <text x="27" y="25" fill="#fff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">5</text>
    <text x="27" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[0]</text>

    <rect x="55" y="0" width="55" height="40" fill="#238636" stroke="#3fb950"/>
    <text x="82" y="25" fill="#fff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">12</text>
    <text x="82" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[1]</text>

    <rect x="110" y="0" width="55" height="40" fill="#238636" stroke="#3fb950"/>
    <text x="137" y="25" fill="#fff" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">9</text>
    <text x="137" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[2]</text>

    <rect x="165" y="0" width="55" height="40" fill="#21262d" stroke="#30363d"/>
    <text x="192" y="25" fill="#f0f6fc" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">20</text>
    <text x="192" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[3]</text>

    <rect x="220" y="0" width="55" height="40" fill="#21262d" stroke="#30363d"/>
    <text x="247" y="25" fill="#f0f6fc" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">15</text>
    <text x="247" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[4]</text>

    <rect x="275" y="0" width="55" height="40" fill="#21262d" stroke="#30363d"/>
    <text x="302" y="25" fill="#f0f6fc" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">18</text>
    <text x="302" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[5]</text>

    <rect x="330" y="0" width="55" height="40" fill="#21262d" stroke="#30363d"/>
    <text x="357" y="25" fill="#f0f6fc" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">10</text>
    <text x="357" y="55" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">[6]</text>
  </g>

  <!-- Traversals pill -->
  <rect x="470" y="260" width="290" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="490" y="285" fill="#e3b341" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Standard Traversal Orders:</text>
  <text x="490" y="310" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700">Preorder (N-L-R):</tspan> Root first (cloning trees)</text>
  <text x="490" y="333" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700">Inorder (L-N-R):</tspan> Yields sorted array on BST!</text>
  <text x="490" y="356" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700">Postorder (L-R-N):</tspan> Bottom-up (deletion, math evaluation)</text>
  <text x="490" y="379" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="11">• <tspan font-weight="700">Level-Order (BFS):</tspan> Level-by-level queue traversal</text>
</svg>