<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0F172A" rx="16"/>
  <text x="400" y="45" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Tailwind CSS Responsive &amp; Box Architecture</text>
  
  <!-- Breakpoint Badges -->
  <g transform="translate(50, 75)">
    <rect width="120" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="23" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">sm: 640px</text>
  </g>
  <g transform="translate(195, 75)">
    <rect width="120" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="23" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">md: 768px</text>
  </g>
  <g transform="translate(340, 75)">
    <rect width="120" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="23" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">lg: 1024px</text>
  </g>
  <g transform="translate(485, 75)">
    <rect width="120" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="23" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">xl: 1280px</text>
  </g>
  <g transform="translate(630, 75)">
    <rect width="120" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="23" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2xl: 1536px</text>
  </g>

  <!-- Box Model Nested Hierarchy -->
  <g transform="translate(100, 140)">
    <!-- Margin -->
    <rect width="600" height="270" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
    <text x="25" y="28" fill="#FBBF24" font-family="monospace" font-size="14" font-weight="bold">Margin (m-4, mx-auto, my-6)</text>
    
    <!-- Border -->
    <g transform="translate(40, 40)">
      <rect width="520" height="190" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2"/>
      <text x="25" y="26" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">Border (border-2, rounded-xl, border-slate-700)</text>
      
      <!-- Padding -->
      <g transform="translate(40, 36)">
        <rect width="440" height="118" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2"/>
        <text x="25" y="24" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">Padding (p-6, px-4, py-2)</text>
        
        <!-- Content Area -->
        <g transform="translate(40, 34)">
          <rect width="360" height="54" rx="4" fill="#6366F1" fill-opacity="0.4" stroke="#818CF8" stroke-width="1.5"/>
          <text x="180" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Content (w-full, flex, grid, text-center)</text>
        </g>
      </g>
    </g>
  </g>
</svg>